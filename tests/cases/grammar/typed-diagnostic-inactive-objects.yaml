feature: mcp-parity
story: A typed diagnostic search uses the selected source even when the get object also names a source and record.
live_check: retained replay; no source requests
replay: diagnostic/device-approvals
config:
  mcp_tool_mode: typed
steps:
  - mcp_call:
      name: diagnostic
      arguments:
        action: search
        search: {query: FoundationOne CDx, source: fda-pma}
        get: {id: K231327, source: fda-510k, section: summary}
    expect:
      /status: complete
      /query/name: FoundationOne CDx
      /query/source: fda-pma

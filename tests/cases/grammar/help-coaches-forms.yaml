{
  "live_check": "local-only command help and validation; no source requests",
  "feature": "query-validation",
  "story": "Help and errors steer the guesses a regulatory run made: a filter names the only sources that serve it, a section is a bare word after the ID, and unknown --fields names come back as the same call with the names the rows carry, or the selected source's names when one is chosen.",
  "steps": [
    {
      "run": [
        "help",
        "search",
        "diagnostic"
      ],
      "expect": {
        "/result/commands/0/arguments/*/description": {
          "includes": "PMA or K identifier.\nExact PMA application, application/supplement or source K identity. Value form: string. Example: --device-id P200010/S026. Only with --source fda-cdx."
        }
      }
    },
    {
      "run": [
        "help",
        "get",
        "drug"
      ],
      "expect": {
        "/result/commands/0/arguments/*/description": {
          "includes": "Source sections; help get drug\nListed choices accept any letter case; replies use their listed spelling.\nForm: get drug INPUT SECTION...; not --section."
        }
      }
    },
    {
      "run": [
        "search",
        "diagnostic",
        "--source",
        "fda-pma",
        "--name",
        "FoundationOne CDx",
        "--fields",
        "id,product_name,decision_date,supplements"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/option": "--fields",
        "/next/0/args": [
          "--fields=id,product_name",
          "search",
          "diagnostic",
          "--name",
          "FoundationOne CDx",
          "--source",
          "fda-pma"
        ],
        "/next/1/args": [
          "help",
          "search",
          "diagnostic"
        ]
      }
    },
    {
      "run": [
        "search",
        "drug",
        "--source",
        "who-pq",
        "--prequalified-from",
        "2023",
        "--fields",
        "id,name,manufacturer,date_of_prequalification"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/option": "--fields",
        "/next/0/args": [
          "--fields=id,name,date_of_prequalification",
          "search",
          "drug",
          "--prequalified-from",
          "2023",
          "--source",
          "who-pq"
        ]
      }
    },
    {
      "run": [
        "search",
        "trial",
        "melanoma",
        "--source",
        "ctgov",
        "--fields",
        "phase,title,bogus"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/option": "--fields",
        "/next/0/args": [
          "--fields=phases,title",
          "search",
          "trial",
          "melanoma",
          "--source",
          "ctgov"
        ]
      }
    }
  ]
}

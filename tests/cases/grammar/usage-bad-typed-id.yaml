{
  "feature": "query-validation",
  "live_check": "local-only validation; no source requests",
  "story": "A refused get identifier offers the same entity search with the unchanged input.",
  "steps": [
    {
      "run": [
        "get",
        "trial",
        "lung cancer"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "input",
        "/error/message": "option is missing or invalid; choose an accepted value or form and use the suggested help command",
        "/error/valid_values": [
          "Canonical ClinicalTrials.gov identifier."
        ],
        "/next/0/args": [
          "search",
          "trial",
          "--",
          "lung cancer"
        ]
      }
    },
    {
      "run": [
        "get",
        "article",
        "lung cancer"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "input",
        "/next/0/args": [
          "search",
          "article",
          "--",
          "lung cancer"
        ]
      }
    },
    {
      "run": [
        "get",
        "variant",
        "BRAF V600E"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "input",
        "/next/0/args": [
          "search",
          "variant",
          "--query=BRAF V600E",
          "--source=myvariant"
        ]
      }
    },
    {
      "run": [
        "get",
        "variant",
        "--",
        "--help"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/next/0/args": [
          "search",
          "variant",
          "--query=--help",
          "--source=myvariant"
        ]
      }
    },
    {
      "run": [
        "get",
        "trial",
        "NCT02563002",
        "--offset",
        "1"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/next/0/args": [
          "help",
          "get",
          "trial"
        ]
      }
    }
  ]
}

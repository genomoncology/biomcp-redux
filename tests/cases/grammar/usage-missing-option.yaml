{
  "feature": "query-validation",
  "live_check": "local-only validation; no source requests",
  "story": "A missing option names its accepted values. When exactly one value lets the call run, that call is the next step; when several would, choosing one would be a guess, so the next step is help.",
  "steps": [
    {
      "run": [
        "search",
        "drug"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--source",
        "/error/message": "option is missing or invalid; choose an accepted value or form and use the suggested help command",
        "/error/valid_values/*": {
          "includes_all_of": [
            "openfda-label",
            "drugsfda"
          ]
        },
        "/next/*/args": {
          "includes": [
            "help",
            "search",
            "drug"
          ]
        },
        "/next/0/args/0": "help"
      }
    },
    {
      "run": [
        "get",
        "disease",
        "MONDO:0013267",
        "genes",
        "--section-limit",
        "5"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/next/0/kind": "configure",
        "/next/0/args": {
          "includes": [
            "--source",
            "monarch"
          ]
        },
        "/next": {
          "count": 1
        }
      }
    }
  ]
}

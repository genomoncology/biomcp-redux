{
  "feature": "query-validation",
  "live_check": "local-only validation; no source requests",
  "story": "A missing option names its accepted values. When exactly one value lets the call run, that call is the only next step; when several would, the first is offered as a guess and help stays beside it.",
  "steps": [
    {
      "run": [
        "search",
        "drug"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--source",
        "/error/message": "option is missing or invalid; choose an accepted value or form and use the suggested help command",
        "/error/valid_values/*": {
          "includes_all_of": [
            "openfda-label",
            "drugsfda"
          ]
        },
        "/next/*/args": {
          "includes": [
            "help",
            "search",
            "drug"
          ]
        },
        "/next/0/args": [
          "search",
          "drug",
          "--source",
          "fda-drug-recall"
        ],
        "/next": {
          "count": 2
        }
      }
    },
    {
      "run": [
        "get",
        "disease",
        "MONDO:0013267",
        "genes",
        "--section-limit",
        "5"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/next/0/kind": "configure",
        "/next/0/args": [
          "get",
          "disease",
          "MONDO:0013267",
          "genes",
          "--section-limit",
          "5",
          "--source",
          "monarch"
        ],
        "/next": {
          "count": 1
        }
      }
    }
  ]
}

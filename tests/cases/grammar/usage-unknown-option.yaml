{
  "feature": "query-validation",
  "live_check": "local-only validation; no source requests",
  "story": "An unknown option names itself and the command's options, and the first next step is the same call without it. When the word after it could be the caller's own search word, that would be a guess, so help stays. The call offered without it must also pass the check made before any source is read, so it carries the one source that check names.",
  "steps": [
    {
      "run": [
        "get",
        "drug",
        "CHEMBL941",
        "--source",
        "chembl",
        "--country",
        "US"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--country",
        "/error/message": "unknown option: this command has no error.option; valid_values lists the options it takes",
        "/error/valid_values/0": "--civic-cursor",
        "/next/0/args": [
          "get",
          "drug",
          "CHEMBL941",
          "--source",
          "chembl"
        ],
        "/next": {
          "count": 1
        }
      }
    },
    {
      "run": [
        "search",
        "drug",
        "--bogus",
        "imatinib",
        "--source",
        "fda-drug-recall"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--bogus",
        "/next/0/args/0": "help",
        "/next": {
          "count": 1
        }
      }
    },
    {
      "run": [
        "get",
        "disease",
        "MONDO:0013267",
        "genes",
        "--section-limit",
        "5",
        "--bogus",
        "x"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--bogus",
        "/next/0/args": [
          "get",
          "disease",
          "MONDO:0013267",
          "genes",
          "--section-limit",
          "5",
          "--source",
          "monarch"
        ],
        "/next": {
          "count": 1
        }
      }
    }
  ]
}

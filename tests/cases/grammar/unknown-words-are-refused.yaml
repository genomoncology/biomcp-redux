  "story": "A word after a get command's ID that names no section is refused, never dropped or looked up: the refusal names the word in error.option, says whether it was read as a section rather than a second ID, lists the record's sections, and its next step runs. A near section is offered as the next call, never read in the word's place. Several IDs with sections still read as before (gene/sections/clingen-validity, protein/chembl-targets, trial/get/batch-failure-says-why).",

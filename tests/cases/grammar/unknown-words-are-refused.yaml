  "story": "A word after a get command's ID that names no section of this record is refused, never dropped: a word in the section's place, a trailing word that is not an ID, or a trailing word near one of this record's section names (any letter case, dash, underscore or plural, or one or two edits) or naming another record's section. The refusal names the word in error.option, says when it was read as a section rather than a second ID, lists the record's sections, and its next step runs. A near section is offered as the next call, never read in the word's place. Once a trailing word names a section, every later word must be one, so an ID after a section is refused with the call that puts it first. A suggested call passes every check a run makes, with the one source that serves it, or the step is help. Any other trailing word is an ID (gene/unknown-words).",

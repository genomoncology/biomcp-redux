      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "bogussection",
        "/error/message": "unknown section: error.option was read as a section, not an ID; valid_values lists the sections; to read it as an ID, give it first or use --section",
        "/error/valid_values": {
          "includes": "pathways"
        },
        "/next/0/args": [
          "help",
          "get",
          "gene"
        ]
      }
    },

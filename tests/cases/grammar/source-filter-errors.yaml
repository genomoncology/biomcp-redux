{
  "feature": "query-validation",
  "live_check": "synthetic",
  "story": "Source-incompatible filters name accepting sources and a declared replacement, while invalid source values keep their own identity. Swapping a source the caller named for the one that takes the filter, or dropping the filter, is a guess that keeps help beside it. When the caller named no source and exactly one other source takes the filter, that call is the only next step.",
  "steps": [
    {
      "run": [
        "search",
        "adverse-event",
        "pump",
        "--event-type",
        "malfunction"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--event-type",
        "/error/valid_values": [
          "maude"
        ],
        "/next/0/kind": "configure",
        "/next/0/args": [
          "search",
          "adverse-event",
          "pump",
          "--event-type",
          "malfunction",
          "--source",
          "maude"
        ],
        "/next": {
          "count": 1
        }
      }
    },
    {
      "run": [
        "search",
        "adverse-event",
        "pump",
        "--source",
        "maude",
        "--reaction",
        "Headache"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/option": "--reaction",
        "/error/valid_values": [
          "faers"
        ],
        "/error/message": "a selected source does not support the requested filters",
        "/next/0/kind": "configure",
        "/next": {
          "count": 2
        },
        "/next/0/args": [
          "search",
          "adverse-event",
          "pump",
          "--reaction",
          "Headache"
        ],
        "/next/1/args": [
          "help",
          "search",
          "adverse-event"
        ]
      }
    },
    {
      "run": [
        "search",
        "drug",
        "artemether",
        "--source",
        "who-pq",
        "--initiated-from",
        "2026-01-01"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/option": "--initiated-from",
        "/error/valid_values": [
          "fda-drug-recall"
        ],
        "/error/message": "a selected source does not support the requested filters",
        "/next/0/kind": "configure",
        "/next": {
          "count": 2
        },
        "/next/0/args": [
          "search",
          "drug",
          "artemether",
          "--initiated-from",
          "2026-01-01",
          "--source",
          "fda-drug-recall"
        ],
        "/next/1/args": [
          "help",
          "search",
          "drug"
        ]
      }
    },
    {
      "run": [
        "search",
        "diagnostic",
        "--source",
        "fda-cdx",
        "--gene",
        "BRAF"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/option": "--gene",
        "/error/valid_values": [
          "gtr"
        ],
        "/next/0/args": [
          "search",
          "diagnostic",
          "--biomarker",
          "BRAF",
          "--source",
          "fda-cdx"
        ],
        "/error/message": "a selected source does not support the requested filters"
      }
    },
    {
      "run": [
        "search",
        "diagnostic",
        "--source",
        "gtr",
        "--gene",
        "BRAF",
        "--marker",
        "malaria"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/option": "--marker",
        "/error/valid_values": [
          "who-ivd"
        ],
        "/error/message": "a selected source does not support the requested filters",
        "/next/0/kind": "configure",
        "/next": {
          "count": 2
        },
        "/next/0/args": [
          "search",
          "diagnostic",
          "--gene",
          "BRAF",
          "--source",
          "gtr"
        ],
        "/next/1/args": [
          "help",
          "search",
          "diagnostic"
        ]
      }
    },
    {
      "run": [
        "search",
        "pathway",
        "--source",
        "wikipathways",
        "--gene",
        "BRAF"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/option": "--gene",
        "/error/valid_values": [
          "reactome"
        ],
        "/error/message": "a selected source does not support the requested filters",
        "/next/0/kind": "configure",
        "/next": {
          "count": 2
        },
        "/next/0/args": [
          "search",
          "pathway",
          "--gene",
          "BRAF"
        ],
        "/next/1/args": [
          "help",
          "search",
          "pathway"
        ]
      }
    },
    {
      "run": [
        "search",
        "pathway",
        "--source",
        "reactome,wikipathways",
        "--top-level"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/option": "--top-level",
        "/error/valid_values": [
          "reactome"
        ],
        "/error/message": "a selected source does not support the requested filters",
        "/next/0/kind": "configure",
        "/next": {
          "count": 1
        },
        "/next/0/args": [
          "help",
          "search",
          "pathway"
        ]
      }
    },
    {
      "run": [
        "search",
        "biomarker",
        "--source",
        "gtr",
        "--name",
        "BRAF"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/option": "--source",
        "/error/valid_values": [
          "nci"
        ]
      }
    }
  ]
}

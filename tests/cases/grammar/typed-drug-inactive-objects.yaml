feature: mcp-parity
story: A typed drug label read uses the selected ID and section even if inactive siblings hold search values or a malformed payload.
live_check: retained replay; no source requests
replay: drug/label-discovery
config:
  mcp_tool_mode: typed
steps:
  - mcp_call:
      name: drug
      arguments:
        action: get
        get:
          id: 98b197ea-bca4-427e-8737-97f70a3262bc
          section: label
          source: openfda-label
          label_section: warnings_and_cautions
        search: {query: imatinib, limit: 1}
    expect:
      /status: complete
      /result/identity/id: 98b197ea-bca4-427e-8737-97f70a3262bc
      /result/label/state: empty
  - mcp_call:
      name: drug
      arguments:
        action: get
        get:
          id: 98b197ea-bca4-427e-8737-97f70a3262bc
          section: label
          source: openfda-label
          label_section: warnings_and_cautions
        search: [arbitrary, payload]
    expect:
      /status: complete
      /result/identity/id: 98b197ea-bca4-427e-8737-97f70a3262bc

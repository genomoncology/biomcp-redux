{
  "feature": "query-validation",
  "live_check": "offline parser-only; no source requests",
  "story": "Numeric argument failures retain their source-owned accepted form and bounds.",
  "steps": [
    {
      "run": [
        "search",
        "diagnostic",
        "--source",
        "gtr",
        "--limit",
        "old-value"
      ],
      "offline": true,
      "exit": 2,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments"
      }
    },
    {
      "run": [
        "search",
        "diagnostic",
        "--source",
        "gtr",
        "--offset",
        "old-value"
      ],
      "offline": true,
      "exit": 2,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments"
      }
    },
    {
      "run": [
        "search",
        "adverse-event",
        "aspirin",
        "--limit",
        "old-value"
      ],
      "offline": true,
      "exit": 2,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments"
      }
    },
    {
      "run": [
        "search",
        "adverse-event",
        "aspirin",
        "--offset",
        "old-value"
      ],
      "offline": true,
      "exit": 2,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments"
      }
    },
    {
      "run": [
        "get",
        "variant",
        "rs113488022",
        "civic",
        "--section-limit",
        "old-value"
      ],
      "offline": true,
      "exit": 2,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments"
      }
    },
    {
      "run": [
        "get",
        "variant",
        "rs113488022",
        "civic",
        "--section-offset",
        "old-value"
      ],
      "offline": true,
      "exit": 2,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments"
      }
    },
    {
      "run": [
        "search",
        "trial",
        "--condition",
        "melanoma",
        "--age",
        "old-value"
      ],
      "offline": true,
      "exit": 2,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments"
      }
    },
    {
      "run": [
        "search",
        "trial",
        "--condition",
        "melanoma",
        "--limit",
        "old-value"
      ],
      "offline": true,
      "exit": 2,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments"
      }
    },
    {
      "run": [
        "search",
        "article",
        "BRCA1",
        "--offset",
        "old-value"
      ],
      "offline": true,
      "exit": 2,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments"
      }
    }
  ]
}

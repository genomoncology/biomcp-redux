{
  "feature": "drug-name-search",
  "live_check": "synthetic names in real ChEMBL and MyChem synonym shapes; no clinical or live completeness claim",
  "story": "Names the source types as official survive the name cap past shorter trade names, whichever name was typed and whichever source answers.",
  "replay": "search/drug-names",
  "config": {
    "drug_search_name_limit": 2
  },
  "steps": [
    {
      "run": [
        "search",
        "trial",
        "Official therapy"
      ],
      "expect": {
        "/status": "complete",
        "/sources/0/source": "chembl",
        "/sources/0/notices/0/names": [
          "Official therapy",
          "Worldname"
        ],
        "/sources/0/notices/0/message": "Searched the names stated by chembl record CHEMBL900002. Left out 4 of 6 names, past the drug_search_name_limit setting.",
        "/page/total": 3
      }
    },
    {
      "run": [
        "search",
        "trial",
        "Worldname"
      ],
      "expect": {
        "/status": "complete",
        "/sources/0/notices/0/names": [
          "OFFICIAL THERAPY",
          "Worldname"
        ],
        "/page/total": 3
      }
    },
    {
      "run": [
        "search",
        "trial",
        "Rowed therapy"
      ],
      "expect": {
        "/status": "complete",
        "/sources/0/source": "mychem",
        "/sources/0/notices/0/names": [
          "Rowed therapy",
          "Rowname"
        ],
        "/page/total": 3
      }
    },
    {
      "run": [
        "get",
        "drug",
        "Worldname",
        "--source",
        "chembl"
      ],
      "expect": {
        "/result/official_names": [
          "Official therapy",
          "Worldname"
        ]
      }
    }
  ]
}

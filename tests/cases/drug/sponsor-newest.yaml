{
  "feature": "drug-approvals",
  "story": "A sponsor's Drugs@FDA applications come newest first in one call: each row carries its latest submission's date, type, number and status and its original approval's date and number, the source total stays, and a notice states the order and warns that the latest submission is often a supplement; the next page keeps the order.",
  "live_check": "public",
  "verified": "Native openFDA Drugs@FDA replies recorded 2026-11-13 with biomcp --record in pm job j38975; bodies unchanged. Requests, byte counts and SHA-256 are in tests/replies/drug/sponsor-newest/README.md.",
  "replay": "drug/sponsor-newest",
  "steps": [
    {
      "run": [
        "search",
        "drug",
        "--source",
        "drugsfda",
        "--applicant",
        "NOVARTIS",
        "--sort",
        "newest",
        "--limit",
        "5"

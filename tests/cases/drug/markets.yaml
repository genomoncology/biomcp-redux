{
  "feature": "drug-markets",
  "story": "One call gives dolutegravir's row in each market: Drugs@FDA NDA204790 first approved 2013-08-12, EMA EMEA/H/C/002753 (Tivicay) authorised 2014-01-16 and WHO HA634 (ViiV) prequalified 2014-10-14, each with its own number, status, date role, record URL and source, and no date joined across markets. Imatinib has FDA and EMA rows, and its WHO row says WHO lists no product under that name.",
  "live_check": "public",
  "verified": "Drugs@FDA, MyChem and ChEMBL replies and the WHO PQ finished-product export recorded unchanged 2026-11-13 with biomcp --record; the EMA medicines and referrals files from the same recording are trimmed to the dolutegravir and imatinib medicines. Details are in tests/replies/drug/markets/README.md.",
  "replay": "drug/markets",
  "steps": [
    {
      "run": ["sync", "ema"],
      "max_bytes": 800
    },
    {
      "run": ["sync", "who-pq"],
      "expect": {
        "/result/rows": 657
      },
      "max_bytes": 500
    },
    {
      "run": ["get", "drug", "dolutegravir", "markets"],
      "mcp": ["get", "drug", "dolutegravir", "markets"],
      "expect": {
        "/schema": "biomcp.drug-markets/1",
        "/status": "complete",
        "/query/input": "dolutegravir",
        "/result/markets/*/source": ["drugsfda", "ema", "who-pq"],
        "/result/markets/*/state": ["found", "found", "found"],
        "/result/markets/*/record": ["NDA204790", "EMEA/H/C/002753", "HA634"],
        "/result/markets/0/name": "TIVICAY",
        "/result/markets/0/holder": "VIIV HLTHCARE",
        "/result/markets/0/status": ["Discontinued", "Prescription"],
        "/result/markets/0/first_approval/role": "submission_status_date",
        "/result/markets/0/first_approval/date": "2013-08-12",
        "/result/markets/0/url": "https://www.accessdata.fda.gov/scripts/cder/daf/index.cfm?event=overview.process&ApplNo=204790",
        "/result/markets/1/name": "Tivicay",
        "/result/markets/1/holder": "ViiV Healthcare BV",
        "/result/markets/1/status": ["Authorised"],
        "/result/markets/1/first_approval/role": "marketing_authorisation_date",
        "/result/markets/1/first_approval/date": "2014-01-16",
        "/result/markets/1/url": "https://www.ema.europa.eu/en/medicines/human/EPAR/tivicay",
        "/result/markets/2/holder": "ViiV Healthcare BV",
        "/result/markets/2/first_approval/role": "date_of_prequalification",
        "/result/markets/2/first_approval/date": "2014-10-14",
        "/result/markets/2/url": "https://extranet.who.int/prequal/medicines/ha634",
        "/result/markets/2/matches": 52,
        "/sources/*/source": {
          "includes_all_of": ["drugsfda", "ema", "who-pq"]
        },
        "/next/*/args": {
          "includes_all_of": [
            ["get", "drug", "NDA204790", "approvals", "--source", "drugsfda"],
            ["get", "drug", "EMEA/H/C/002753", "regulatory", "--source", "ema"],
            ["get", "drug", "HA634", "--source", "who-pq"]
          ]
        }
      }
    },
    {
      "run": ["get", "drug", "imatinib", "markets"],
      "expect": {
        "/schema": "biomcp.drug-markets/1",
        "/status": "complete",
        "/result/markets/*/source": ["drugsfda", "ema", "who-pq"],
        "/result/markets/*/state": ["found", "found", "no-record"],
        "/result/markets/*/record": ["NDA021335", "EMEA/H/C/000406"],
        "/result/markets/1/first_approval/date": "2001-11-07",
        "/result/markets/2/matches": 0,
        "/result/markets/2": {
          "omits": ["record", "first_approval", "url"]
        }
      }
    },
    {
      "run": ["get", "drug", "dolutegravir", "markets", "--source", "ema"],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments"
      }
    }
  ]
}

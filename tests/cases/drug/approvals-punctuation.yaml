      "expect": {
        "/status": "complete",
        "/query/applicant": "!",
        "/page/total": 0,
        "/sources/0/state": "ok",
        "/sources/0/notices/*/message": {
          "includes": "--applicant held no letter or digit openFDA accepts, so it matched no sponsor."
        }
      }
    }
  ]

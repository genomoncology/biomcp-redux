{
  "live_check": "synthetic authored WHO PQ export rows; no live provider observation",
  "feature": "drug-who-medicines",
  "story": "A WHO PQ search by therapeutic area returns, in one page, only the products listed under that area in the Therapeutic Area column, newest first with undated rows last; whole words match in any letter case, dates and names narrow the same search, and the area works only with WHO PQ.",
  "replay": "drug/who-pq-area-synthetic",
  "steps": [
    {
      "run": [
        "sync",
        "who-pq"
      ],
      "expect": {
        "/result/rows": 8
      },
      "max_bytes": 500
    },
    {
      "run": [
        "search",
        "drug",
        "--source",
        "who-pq",
        "--therapeutic-area",
        "oncology",
        "--limit",
        "50"
      ],
      "expect": {
        "/status": "complete",
        "/page/total": 4,
        "/page/returned": 4,
        "/result/items/*/reference": [
          "SYN-ON02",
          "SYN-ON01",
          "SYN-ON03",
          "SYN-ON04"
        ],
        "/result/items/*/therapeutic_area": [
          "Oncology",
          "Oncology",
          "Oncology",
          "Oncology"
        ]
      },
      "max_bytes": 40000
    },
    {
      "run": [
        "search",
        "drug",
        "--source",
        "who-pq",
        "--therapeutic-area",
        "Oncology",
        "--prequalified-from",
        "2021"
      ],
      "expect": {
        "/page/total": 2,
        "/result/items/*/reference": [
          "SYN-ON02",
          "SYN-ON01"
        ]
      },
      "max_bytes": 40000
    },
    {
      "run": [
        "search",
        "drug",
        "--source",
        "who-pq",
        "synthetic medicine a",
        "--therapeutic-area",
        "oncology",
        "--limit",
        "50"
      ],
      "expect": {
        "/page/total": 2,
        "/result/items/*/reference": [
          "SYN-ON01",
          "SYN-ON03"
        ]
      },
      "max_bytes": 40000
    },
    {
      "run": [
        "search",
        "drug",
        "--source",
        "who-pq",
        "--therapeutic-area",
        "hiv"
      ],
      "expect": {
        "/page/total": 1,
        "/result/items/*/reference": [
          "SYN-HV01"
        ],
        "/result/items/*/therapeutic_area": [
          "HIV/AIDS"
        ]
      },
      "max_bytes": 40000
    },
    {
      "run": [
        "search",
        "drug",
        "--source",
        "who-pq"
      ],
      "expect": {
        "/error/code": "usage.arguments",
        "/error/message": "WHO PQ search requires a name, --therapeutic-area or a --prequalified-from/--prequalified-to date range"
      },
      "max_bytes": 40000,
      "exit": 2
    },
    {
      "run": [
        "search",
        "drug",
        "imatinib",
        "--source",
        "ema",
        "--therapeutic-area",
        "oncology"
      ],
      "expect": {
        "/error/code": "usage.arguments"
      },
      "max_bytes": 40000,
      "exit": 2
    }
  ]
}

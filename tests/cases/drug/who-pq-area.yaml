{
  "live_check": "WHO PQ finished-product export captured live 2026-11-13; reuses the who-pq-dates-read recording",
  "feature": "drug-who-medicines",
  "story": "A WHO PQ search by therapeutic area returns, in one page, only the products WHO lists under that area in its own Therapeutic Area column, newest first; dates and names narrow the same search, and the area works only with WHO PQ.",
  "replay": "drug/who-pq-dates-read",

{
  "live_check": "local-only command help, validation or stored-state behavior; no recorded source replies",
  "feature": "drug-label-history",
  "story": "A label-history call refused before any source is read names its real cause: --offset without --every-version is refused with that cause and the same call reading every version from that offset, and a --label-section that label-history does not read is refused with the seven sections it reads.",
  "steps": [
    {
      "run": [
        "get",
        "drug",
        "NDA022363",
        "label-history",
        "--source",
        "drugsfda",
        "--label-section",
        "warnings_and_cautions",
        "--find",
        "myasthenia",
        "--offset",
        "10"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--section-offset",
        "/error/message": "--offset needs --every-version: label-history pages only while it reads every version; add --every-version, or drop --offset (also spelled --section-offset)",
        "/next/0/args": {
          "includes_all_of": [
            "--every-version",
            "10"
          ]
        },
        "/error": {
          "omits": [
            "valid_values"
          ]
        }
      }
    },
    {
      "run": [
        "get",
        "drug",
        "NDA020702",
        "label-history",
        "--source",
        "drugsfda",
        "--label-section",
        "clinical_pharmacology",
        "--find",
        "fold"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--label-section",
        "/error/message": "label-history reads only the label sections in valid_values; give --label-section one of them, or read another section with: get drug <NAME> label --label-section NAME",
        "/error/valid_values": [
          "boxed_warning",
          "indications_and_usage",
          "contraindications",
          "warnings_and_cautions",
          "adverse_reactions",
          "drug_interactions",
          "use_in_specific_populations"
        ]
      }
    }
  ]
}

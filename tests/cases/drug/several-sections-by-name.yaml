{
  "live_check": "recorded only; synthetic label fixtures",
  "feature": "several-sections",
  "story": "A drug read by name with three label headings states the drug and its name lookup once, keeps each part's own status, paging and next calls, and reads the name and the label record once; an unknown heading inside the list is refused as a usage error naming the record's headings.",
  "replay": "drug/several-sections-name",
  "config": {
    "disable_sources": [
      "mychem",
      "chembl"
    ]
  },
  "steps": [
    {
      "run": [
        "get",
        "drug",
        "EXAMPLE LABEL",
        "label",
        "--label-section",
        "boxed_warning,dosage_and_administration,warnings_and_cautions",
        "--section-limit",
        "1",
        "--fresh"
      ],
      "expect": {
        "/schema": "biomcp.drug-sections/1",
        "/status": "complete",
        "/query/input": "11111111-1111-1111-1111-111111111111",
        "/result/identity/id": "11111111-1111-1111-1111-111111111111",
        "/result/identity/name_resolution/input": "EXAMPLE LABEL",
        "/result/parts/*/section": [
          "label",
          "label",
          "label"
        ],
        "/result/parts/*/reply/status": [
          "complete",
          "complete",
          "complete"
        ],
        "/result/parts/*/reply/result/label_section": [
          "boxed_warning",
          "dosage_and_administration",
          "warnings_and_cautions"
        ],
        "/result/parts/*/reply/result/label/data/text": [
          "Synthetic boxed warning.",
          "Synthetic dose, part one.",
          "Synthetic warning."
        ],
        "/result/parts/0/reply": {
          "omits": [
            "identity",
            "query"
          ]
        },
        "/result/parts/1/reply": {
          "omits": [
            "identity",
            "query"
          ]
        },
        "/result/parts/2/reply": {
          "omits": [
            "identity",
            "query"
          ]
        },
        "/result/parts/1/reply/page/total": 2,
        "/result/parts/1/reply/page/returned": 1,
        "/result/parts/1/reply/next/0/kind": "page",
        "/result/parts/1/reply/next/0/args": {
          "includes_all_of": [
            "11111111-1111-1111-1111-111111111111",
            "dosage_and_administration",
            "--section-offset",
            "1"
          ],
          "excludes": "boxed_warning"
        }
      }
    },
    {
      "run": [
        "get",
        "drug",
        "EXAMPLE LABEL",
        "label",
        "--label-section",
        "boxed_warning,not_a_heading,adverse_reactions"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--label-section",
        "/error/valid_values/*": {
          "includes_all_of": [
            "boxed_warning",
            "adverse_reactions"
          ]
        }
      }
    }
  ]
}

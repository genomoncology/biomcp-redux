{
  "feature": "drug-native-sources",
  "story": "Native drug source admission and explicit selector validation happen before provider access",
  "steps": [
    {
      "run": [
        "search",
        "drug",
        "Enhertu",
        "--source",
        "mychem",
        "--name-selector",
        "preferred"
      ],
      "mcp": [
        "search",
        "drug",
        "Enhertu",
        "--source",
        "mychem",
        "--name-selector",
        "preferred"
      ],
      "exit": 2,
      "is_error": true,
      "max_bytes": 300,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments"
      }
    },
    {
      "run": [
        "search",

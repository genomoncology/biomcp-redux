{
  "feature": "drug-recall",
  "live_check": "public",
  "story": "A drug recall page shows records numbered in FDA's older D-NNN-YYYY form as rows, and get finds a recall by such a number. A record whose recall number is malformed, such as one cut short or missing a hyphen, is still declined: the page keeps its other rows as a partial page and names the declined record in its own record.declined problem by the raw recall number openFDA sent (event_id only when the number is blank or N/A).",
  "verified": "Native openFDA replies recorded by biomcp --record without a key: the 2013-10-18 and 2013-02-27 pages on 2026-11-15 in pm job j41440 (0977), the Olympia, Qualitest and D-502-2013 replies on 2026-11-15 in pm job j41472; bodies unchanged. On base commit 94395bcad the 2013 pages declined every D-NNN-YYYY record (0977's expectations) and get drug D-404-2014 was refused as a usage error before any request (pm job j41441). Requests, sizes and SHA-256 are in tests/replies/drug/recall-declined-records/README.md. Source https://open.fda.gov/license/ and https://open.fda.gov/terms/. No rows or values invented.",
  "replay": "drug/recall-declined-records",
  "steps": [
    {
      "run": [
        "search",
        "drug",
        "--source",
        "fda-drug-recall",
        "--initiated-from",
        "2013-10-18",
        "--initiated-to",
        "2013-10-18"
      ],
      "expect": {
        "/status": "complete",

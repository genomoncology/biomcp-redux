        "/result/listings/data/records/0/committee": "The Committee recommended the addition of dabigatran with a square box to the core list of the EML for the prevention of stroke and systemic embolism in patients with nonvalvular atrial fibrillation and for treatment of venous thromboembolism based on favourable efficacy and acceptable safety. The square box refers to apixaban, edoxaban and rivaroxaban as therapeutically equivalent alternatives. The Committee noted that the DOACs demonstrated clinical benefits in terms of reduced mortality, reduced risk of stroke or systemic embolism, and were associated with fewer severe/major bleeding episodes compared to well-controlled warfarin in patients with NVAF. In the treatment of patients with venous thromboembolism, DOACs were associated with small reductions in mortality, risk of subsequent/recurrent thromboembolic events and major bleeding compared to low-molecular weight heparin and vitamin K antagonists. The use of DOACs may also have relevant health system benefits related to the infrastructure required for warfarin treatment monitoring, as they do not require laboratory monitoring. The Committee noted that DOACs have higher daily treatment costs than warfarin, but have been found to be a cost-effective intervention. It is recommended that countries take all these factors into consideration when selecting anticoagulants to best suit their national and local needs and circumstances. The Committtee recommended that WHO take action to facilitate access to these medicines through the WHO prequalification programme, and through collaboration with partners such as the Medicines Patent Pool.",

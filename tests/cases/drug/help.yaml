{
  "feature": "generated-help",
  "story": "Drug help exposes source-scoped sections and options with two executable examples per command and bundle sync.",
  "steps": [
    {
      "run": [
        "help",
        "search",
        "drug"
      ],
      "mcp": [
        "help",
        "search",
        "drug"
      ],
      "expect": {
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "query",
            "--source",
            "--limit",
            "--offset",
            "--name-selector"
          ]
        }
      },
      "max_bytes": 1422
    },
    {
      "run": [
        "help",
        "get",
        "drug"
      ],
      "mcp": [
        "help",
        "get",
        "drug"
      ],
      "expect": {
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/sections/*/word": [
          "xrefs",
          "targets",
          "indications",
          "civic",
          "label",
          "approvals",
          "regulatory",
          "interactions"
        ],
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "input",
            "--source",
            "section",
            "--section-limit",
            "--section-offset",
            "--label-section",
            "--product-number",
            "--civic-kind",
            "--civic-profile",
            "--civic-cursor"
          ]
        }
      },
      "max_bytes": 3291
    },
    {
      "run": [
        "help",
        "sync",
        "ema"
      ],
      "mcp": [
        "help",
        "sync",
        "ema"
      ],
      "expect": {
        "/result/commands/0/command": [
          "sync",
          "ema"
        ],
        "/result/commands/0/examples": {
          "count": 2
        }
      },
      "max_bytes": 429
    },
    {
      "run": [
        "help",
        "sync",
        "ddinter"
      ],
      "mcp": [
        "help",
        "sync",
        "ddinter"
      ],
      "expect": {
        "/result/commands/0/command": [
          "sync",
          "ddinter"
        ],
        "/result/commands/0/examples": {
          "count": 2
        }
      },
      "max_bytes": 448
    }
  ],
  "verified": "Measured complete CLI and MCP help envelopes, including the output newline, use 15 percent headroom. Examples are embedded from case run steps and executed with only their owning explicit sync prerequisites."
}

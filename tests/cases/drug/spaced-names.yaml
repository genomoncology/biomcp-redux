{
  "feature": "drug-name-get",
  "story": "A drug name with a space, such as a salt or full name, answers with a reply that matches its schema on every source that keeps the name. Drugs@FDA and openFDA labels have no record for metamizole sodium, which is not marketed in the US, and Open Targets has none for domperidone maleate; each answers absent, names the record another source holds, and echoes the name as given, spaces included, in query.input.",
  "live_check": "public",
  "verified": "Source replies recorded unchanged with biomcp --record; see tests/replies/drug/spaced-names/README.md.",
  "replay": "drug/spaced-names",
  "steps": [
    {
      "run": [
        "get",
        "drug",
        "metamizole sodium",
        "--source",
        "drugsfda"
      ],
      "exit": 1,
      "expect": {
        "/status": "absent",
        "/schema": "biomcp.drug-card/7",
        "/query/input": "metamizole sodium",
        "/query/source": "drugsfda"
      },
      "max_bytes": 3000
    },
    {
      "run": [
        "get",
        "drug",
        "metamizole sodium",
        "--source",
        "openfda-label"
      ],
      "exit": 1,
      "expect": {
        "/status": "absent",
        "/schema": "biomcp.drug-card/7",
        "/query/input": "metamizole sodium",
        "/query/source": "openfda-label"
      },
      "max_bytes": 3000
    },
    {
      "run": [
        "get",
        "drug",
        "domperidone maleate",
        "--source",
        "opentargets"
      ],
      "exit": 1,
      "expect": {
        "/status": "absent",
        "/schema": "biomcp.drug-card/7",
        "/query/input": "domperidone maleate",
        "/query/source": "opentargets"
      },
      "max_bytes": 3000
    }
  ]
}

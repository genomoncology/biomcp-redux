{
  "feature": "drug-name-get",
  "story": "A drug name with a space, such as a salt or full name, answers with a reply that matches its schema on every source that keeps the name. Drugs@FDA and openFDA labels have no record for metamizole sodium, which is not marketed in the US, and Open Targets has none for domperidone maleate; each answers absent, names the record another source holds, and echoes the name as given, spaces included, in query.input. The fda-drug-recall get for dabigatran etexilate looks up names for the typed name and again for each other name of the drug, replays as it ran live, and answers absent with the ten names its one recall query searched.",
  "live_check": "public",
  "verified": "Source replies recorded unchanged with biomcp --record; see tests/replies/drug/spaced-names/README.md.",
  "replay": "drug/spaced-names",
  "steps": [
    {
      "run": [
        "get",
        "drug",
        "metamizole sodium",
        "--source",
        "drugsfda"
      ],
      "exit": 1,
      "expect": {
        "/status": "absent",
        "/schema": "biomcp.drug-card/7",
        "/query/input": "metamizole sodium",
        "/query/source": "drugsfda"
      },
      "max_bytes": 3000
    },
    {
      "run": [
        "get",
        "drug",
        "metamizole sodium",
        "--source",
        "openfda-label"
      ],
      "exit": 1,
      "expect": {
        "/status": "absent",
        "/schema": "biomcp.drug-card/7",
        "/query/input": "metamizole sodium",
        "/query/source": "openfda-label"
      },
      "max_bytes": 3000
    },
    {
      "run": [
        "get",
        "drug",
        "domperidone maleate",
        "--source",
        "opentargets"
      ],
      "exit": 1,
      "expect": {
        "/status": "absent",
        "/schema": "biomcp.drug-card/7",
        "/query/input": "domperidone maleate",
        "/query/source": "opentargets"
      },
      "max_bytes": 3000
    },
    {
      "run": [
        "get",
        "drug",
        "dabigatran etexilate",
        "--source",
        "fda-drug-recall"
      ],
      "exit": 1,
      "expect": {
        "/status": "absent",
        "/schema": "biomcp.drug-card/7",
        "/query/input": "dabigatran etexilate",
        "/query/source": "fda-drug-recall",
        "/sources/0/notices/1/kind": "drug-name-search",
        "/sources/0/notices/1/names": [
          "dabigatran etexilate",
          "Dabigatran etexilate methanesulfonate",
          "Pradaxa",
          "Prazaxa",
          "BIBR1048",
          "BIBR 1048",
          "BIBR-1048",
          "BIBR 1048 BS RS1",
          "BIBR-1048-BS-RS1",
          "Dabigatran etexilato"
        ],
        "/sources/0/notices/1/message": "one recall query"
      },
      "max_bytes": 3000
    }
  ]
}

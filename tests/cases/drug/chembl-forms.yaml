        "/status": "complete",
        "/result/identity/id": "CHEMBL941",
        "/page/total": 4,
        "/page/returned": 4,
        "/result/targets/data/records/*/drug/id": ["CHEMBL1642", "CHEMBL1642", "CHEMBL1642", "CHEMBL1642"],
        "/result/targets/data/records/*/attribution/record": ["304", "418", "451", "8630"]
      },
      "max_bytes": 4500
    },
    {
      "run": ["get", "drug", "CHEMBL1642", "targets", "--source", "chembl", "--section-limit", "4"],
      "expect": {
        "/result/identity/id": "CHEMBL1642",
        "/page/total": 4,
        "/result/targets/data/records/*/attribution/record": ["304", "418", "451", "8630"]
      },
      "max_bytes": 4500
    },
    {
      "run": ["get", "drug", "imatinib", "indications", "--source", "chembl", "--section-limit", "2", "--section-offset", "35"],
      "expect": {
        "/status": "complete",
        "/result/identity/id": "CHEMBL941",
        "/page/total": 134,
        "/page/offset": 35,
        "/page/returned": 2,

{
  "feature": "drug-who-medicines",
  "story": "A missing WHO medicines bundle names explicit sync without downloading on a read",
  "steps": [
    {
      "run": [
        "search",
        "drug",
        "trastuzumab",
        "--region",
        "who"
      ],
      "mcp": [
        "search",
        "drug",
        "trastuzumab",
        "--region",
        "who"
      ],
      "exit": 4,
      "is_error": true,
      "expect": {
        "/status": "failed",
        "/sources/0/reason": "syncing",
        "/next/0/args": [
          "sync",
          "who"
        ]
      },
      "max_bytes": 1000,
      "max_tokens": 250
    }
  ]
}

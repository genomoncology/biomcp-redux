{
  "feature": "source-data-age",
  "live_check": "Entirely synthetic native-shaped source facts; no live provider observation",
  "replay": "source-age/comparison",
  "story": "Open Targets shows native phases and points to the separate FDA lookup. The regulatory section keeps dated application facts and identifies the name-only relationship.",
  "steps": [
    {
      "run": [
        "get",
        "drug",
        "CHEMBL941",
        "indications",
        "--source",
        "opentargets",
        "--section-limit",
        "1"
      ],
      "expect": {
        "/status": "complete",
        "/sources": {
          "count": 1
        },
        "/sources/0/source": "opentargets",
        "/result/indications/data/records/0/stage/value": "PHASE_III",
        "/result/indications/data/records/0": {
          "omits": [
            "drug",
            "attribution"
          ]
        },
        "/result/indication_attribution/source": "opentargets",
        "/result/indication_attribution/record": "CHEMBL941",
        "/result/regulatory_context/args/3": "--section",
        "/result/regulatory_context/args/4": "regulatory",
        "/sources/0/notices/0/data_date": "2026-09",
        "/sources/0/notices/0/message": "Publisher dataset date: 2026-09. This is distinct from retrieval and record event dates."
      }
    },
    {
      "run": [
        "get",
        "drug",
        "CHEMBL941",
        "regulatory",
        "--source",
        "opentargets",
        "--section-limit",
        "1"
      ],
      "expect": {
        "/status": "complete",
        "/sources/1/source": "drugsfda",
        "/result/regulatory_context/indications_linked": false,
        "/result/regulatory_context/applications/0/identity/id": "NDA999999",
        "/result/regulatory_context/applications/0/approvals/data/records/0/event/status": "AP",
        "/result/regulatory_context/applications/0/approvals/data/records/0/event/dates/0/date": "2025-01-16",
        "/result/regulatory_context/applications/0/approvals/data/records/0/event": {
          "omits": [
            "indication"
          ]
        }
      }
    }
  ]
}

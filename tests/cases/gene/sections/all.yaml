{
  "feature": "gene-sections",
  "story": "TP53 all expands each landed section in enum order",
  "replay": "gene/all",
  "steps": [
    {
      "run": [
        "get",
        "gene",
        "TP53",
        "all"
      ],
      "expect": {
        "/query/section": [
          "all"
        ],
        "/result/items/0/sections/constraint/state": "data",
        "/sources/*/source": {
          "includes": "gnomad"
        },
        "/result/items/0/sections/expression/state": "data",
        "/sources": {
          "includes": {
            "source": "hpa",
            "state": "ok"
          }
        }
      },
      "max_bytes": 14200,
      "mcp": [
        "get",
        "gene",
        "TP53",
        "all"
      ]
    },
    {
      "run": [
        "get",
        "gene",
        "TP53",
        "constraint",
        "constraint",
        "all"
      ],
      "expect": {
        "/query/section": [
          "constraint",
          "constraint",
          "all"
        ],
        "/result/items/0/sections/constraint/state": "data"
      },
      "mcp": [
        "get",
        "gene",
        "TP53",
        "constraint",
        "constraint",
        "all"
      ]
    },
    {
      "run": [
        "get",
        "gene",
        "TP53",
        "constraint",
        "--section",
        "constraint",
        "--section",
        "all"
      ],
      "expect": {
        "/query/input": [
          "TP53",
          "constraint"
        ],
        "/query/section": [
          "constraint",
          "all"
        ],
        "/result/items/0/sections/constraint/state": "data",
        "/result/items/1/answer/resolution": "not_found"
      },
      "mcp": [
        "get",
        "gene",
        "TP53",
        "constraint",
        "--section",
        "constraint",
        "--section",
        "all"
      ]
    },
    {
      "run": [
        "get",
        "gene",
        "TP53",
        "constraint",
        "NOTAGENE",
        "all"
      ],
      "expect": {
        "/query/input": [
          "TP53",
          "constraint",
          "NOTAGENE"
        ],
        "/query/section": [
          "all"
        ],
        "/result/items/0/sections/constraint/state": "data"
      },
      "mcp": [
        "get",
        "gene",
        "TP53",
        "constraint",
        "NOTAGENE",
        "all"
      ]
    }
  ]

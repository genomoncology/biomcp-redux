{
  "live_check": "public",
  "feature": "gene-clingen",
  "story": "A gene absent from both ClinGen files retains both successful source statuses",
  "replay": "gene/clingen",
  "steps": [
    {
      "run": [
        "get",
        "gene",
        "MIR21",
        "clingen"
      ],
      "expect": {
        "/status": "complete",
        "/sources/*/source": {
          "includes": "clingen",
          "excludes": "gnomad"
        },
        "/result/items/0/sections/clingen/data/validity_status/state": "ok",
        "/result/items/0/sections/clingen/data/dosage_status/state": "ok",
        "/result/items/0/sections/clingen/data": {
          "equals": {
            "validity_status": {
              "source": "clingen",
              "use": "open",
              "terms": "CC0 1.0",
              "terms_url": "https://clinicalgenome.org/docs/terms-of-use/",
              "state": "ok"
            },
            "dosage_status": {
              "source": "clingen",
              "use": "open",
              "terms": "CC0 1.0",
              "terms_url": "https://clinicalgenome.org/docs/terms-of-use/",
              "state": "ok"
            }
          }
        }
      }
    }
  ]
}

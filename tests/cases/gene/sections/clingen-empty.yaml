{
  "feature": "gene-sections",
  "story": "A gene absent from both complete ClinGen files is empty without a source record",
  "replay": "gene/clingen",
  "steps": [
    {
      "run": [
        "get",
        "gene",
        "MIR21",
        "clingen"
      ],
      "mcp": [
        "get",
        "gene",
        "MIR21",
        "clingen"
      ],
      "expect": {
        "/status": "complete",
        "/result/items/0/sections/clingen": {
          "equals": {
            "state": "empty",
            "source": "clingen"
          }
        },
        "/sources/*/source": {
          "includes": "clingen",
          "excludes": "gnomad"
        }
      }
    }
  ]
}

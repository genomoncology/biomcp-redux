{
  "feature": "gene-search",
  "story": "Typed gene query preserves the same previous-name search as the CLI and single MCP tool",
  "replay": "gene/main",
  "config": {
    "mcp_tool_mode": "typed"
  },
  "steps": [
    {
      "mcp_call": {
        "name": "search_gene",
        "arguments": {
          "query": "kirsten rat sarcoma"
        }
      },
      "expect": {
        "/status": "complete",
        "/page/total": 1,
        "/result/items/0/symbol": "KRAS"
      }
    }
  ]
}

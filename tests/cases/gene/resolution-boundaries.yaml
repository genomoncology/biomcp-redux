feature: gene-commands
story: Exact gene identities preserve optional absence and do not confuse identifier families
replay: gene/main
steps:
  - run: [search, gene, DMD]
    expect:
      /result/items/0:
        equals:
          hgnc_id: HGNC:2928
          symbol: DMD
          name: dystrophin
          locus_group: protein_coding
          status: approved
          match: {kind: symbol, text: DMD}
  - run: [search, gene, AK6]
    expect:
      /result/items/0/symbol: AK6
  - run: [get, gene, "999999999", "ENSG99999999999"]
    exit: 1
    expect:
      /result/items/*/answer/resolution: [not_found, not_found]
  - run: [get, gene, AK6, FALEC]
    offline: true
    expect:
      /result/items/0/answer/resolution: resolved
      /result/items/0/answer/gene/symbol: AK6
      /result/items/1/answer/gene/mane_select/refseq: NR_186305.1

{
  "feature": "query-validation",
  "live_check": "local-only validation and generated help; no source requests",
  "story": "Gene search names its HGNC lookup and directs a refused curation source to its gene section.",
  "replay": "gene/main",
  "steps": [
    {
      "run": ["search", "gene", "Fanconi anemia", "--source", "clingen"],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--source",
        "/error/message": "search gene does not take --source. It looks up HGNC names and aliases. For curation, use get gene SYMBOL and the source section.",
        "/next/0/args": ["help", "get", "gene", "clingen"]
      }
    },
    {
      "follow": "configure",
      "expect": {
        "/status": "complete",
        "/result/commands/0/command": ["get", "gene"],
        "/result/commands/0/sections/0/word": "clingen"
      }
    },
    {
      "run": ["search", "gene", "Fanconi anemia", "--source", "gencc"],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--source",
        "/error/message": "search gene does not take --source. It looks up HGNC names and aliases. For curation, use get gene SYMBOL and the source section.",
        "/next/0/args": ["help", "get", "gene", "gencc"]
      }
    },
    {
      "follow": "configure",
      "expect": {
        "/status": "complete",
        "/result/commands/0/command": ["get", "gene"],
        "/result/commands/0/sections/0/word": "gencc"
      }
    }
  ]
}

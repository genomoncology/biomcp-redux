feature: gene-commands
story: An empty offline cache reports an identity source failure and offers synchronization.
steps:
  - run: [get, gene, BRAF, --offline]
    exit: 4
    expect:
      /status: failed
      /sources/0/source: hgnc
      /sources/0/reason: offline
      /next/0/kind: fresh
      /next/1/kind: sync

  "feature": "list-paging",
  "story": "A trial search pages to its end with --limit and --offset alone: an offset without a registry token reaches its row through the registry's own pages, and a page past the end is empty with the total.",
  "replay": "paging/search-trial",
  "verified": "Recorded live ClinicalTrials.gov and MyChem replies on 2026-11-19: melanoma with tebentafusp and its other names matched 20 trials. On main be96d8d40 an offset without --next-page was refused (1061).",

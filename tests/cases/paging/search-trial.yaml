        "--condition",
        "melanoma",
        "--intervention",
        "tebentafusp",
        "--limit",
        "8"
      ],
      "expect": {
        "/status": "complete",
        "/page/offset": 0,
        "/page/returned": 8,
        "/page/total": 20
      }
    },
    {

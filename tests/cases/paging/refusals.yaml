{
  "live_check": "synthetic",
  "feature": "list-paging",
  "story": "A paging word a command does not take is refused with the paging options it does take, and help says in one line which options page the command.",
  "steps": [
    {
      "run": [
        "get",
        "drug",
        "NDA022363",
        "approvals",
        "--source",
        "drugsfda",
        "--page",
        "2"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/option": "--page",
        "/error/valid_values": [
          "--section-limit",
          "--section-offset"
        ]
      }
    },
    {
      "run": [
        "search",
        "gene",
        "BRAF",
        "--skip",
        "3"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/option": "--skip",
        "/error/valid_values": [
          "--limit",
          "--offset"
        ]
      }
    },
    {
      "run": [
        "variant",
        "recurrence",
        "rs113488022",
        "--offset",
        "3"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/option": "--offset",
        "/error/valid_values": [
          "--limit",
          "--page"
        ]
      }
    },
    {
      "run": [
        "get",
        "trial",
        "NCT03734029",
        "locations",
        "--limit",
        "201"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/option": "--limit",
        "/error/valid_values/0": "integer >= 1 <= 200"
      }
    },
    {
      "run": [
        "help",
        "get",
        "drug",
        "--format",
        "md"
      ],
      "expect": {
        "": {
          "includes_all_of": [
            "Paging: --limit and --offset; --section-limit and --section-offset are the same options."
          ]
        }
      }
    },
    {
      "run": [
        "help",
        "get",
        "variant",
        "--format",
        "md"
      ],
      "expect": {
        "": {
          "includes_all_of": [
            "Paging: --limit and --offset page the named section, else the candidates; --section-limit and --section-offset page the section."
          ]
        }
      }
    }
  ]
}

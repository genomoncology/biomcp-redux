{
  "feature": "disease-mydisease",
  "live_check": "public",
  "story": "A caller gives an Orphanet or OMIM number and reads the MONDO record that cross-references it, and its Monarch sections, with the cross-reference used and any obsolete record named; a refused ID offers only steps that run.",
  "verified": "MyDisease MONDO CC BY 4.0 replies for ORPHANET:115, ORPHANET:183530, OMIM:121050 and DOID:0111595, Monarch association pages for MONDO:0007363 and the OLS NCIt (CC BY 4.0) term NCIT:C34807, recorded live on 2026-11-19 with no key.",
  "replay": "disease/orphanet-id",
  "steps": [
    {
      "run": [
        "get",
        "disease",
        "ORPHA:115"
      ],
      "expect": {
        "/status": "complete",
        "/result/requested_id": "ORPHA:115",
        "/result/returned_id": "MONDO:0007363",
        "/result/concept/label": "congenital contractural arachnodactyly",
        "/result/alias/predicate": "mydisease:mondo.xrefs.orphanet",
        "/result/alias/object/id": "ORPHANET:115"
      }
    },
    {
      "run": [
        "get",
        "disease",
        "OMIM:121050"
      ],
      "expect": {
        "/status": "complete",
        "/result/returned_id": "MONDO:0007363",
        "/result/alias/predicate": "mydisease:mondo.xrefs.omim",
        "/result/alias/object/id": "OMIM:121050"
      }
    },
    {
      "run": [
        "get",
        "disease",
        "orpha:115",
        "genes",
        "--source",
        "monarch",
        "--section-limit",
        "5"
      ],
      "expect": {
        "/status": "complete",
        "/query/id": "ORPHA:115",
        "/result/items/0/association/object/id": "MONDO:0007363",
        "/sources/0/source": "mydisease",
        "/sources/0/notices/0/message": "ORPHA:115 was read as MONDO:0007363, the MONDO record whose cross-reference mydisease:mondo.xrefs.orphanet states ORPHANET:115; a MONDO cross-reference may be broader than the code asked for.",
        "/sources/1/source": "monarch"
      }
    },
    {
      "run": [
        "get",
        "disease",
        "ORPHA:183530"
      ],
      "expect": {
        "/status": "complete",
        "/result/returned_id": "MONDO:0015960",
        "/result/obsolete": true,
        "/result/replaced_by": [
          "MONDO:0021147"
        ],
        "/sources/0/notices/0/message": "MONDO marks MONDO:0015960 obsolete and names MONDO:0021147 as its replacement."
      }
    },
    {
      "run": [
        "get",
        "disease",
        "NCIT:C34807"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/status": "usage",
        "/error/valid_values": [
          "ols"
        ]
      }
    },
    {
      "follow": "configure",
      "expect": {
        "/status": "complete",
        "/query/ontology": "ncit",
        "/result/concept/label": "Marfan Syndrome"
      }
    },
    {
      "run": [
        "get",
        "disease",
        "ICD10CM:Q87.4"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/status": "usage",
        "/error/option": "--source",
        "/next/0/args": [
          "help",
          "get",
          "disease"
        ]
      }
    },
    {
      "follow": "configure",
      "offline": true,
      "expect": {
        "/schema": "biomcp.help/7"
      }
    }
  ]
}

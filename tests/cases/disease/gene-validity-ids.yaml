feature: disease-gene-validity
story: OMIM and Orphanet IDs resolve to the same curations as the MONDO ID, including submissions under the original identifier.
live_check: Public ClinGen, GenCC and MyDisease data recorded on 2026-11-27.
replay: disease/gene-validity-ids
steps:
  - run: [sync, gencc]
    expect:
      /status: complete
      /result/rows: 24
  - run: [get, disease, 'MONDO:0008426', gene-validity, --section-limit, '11']
    expect: &shprintzen_goldberg
      /status: complete
      /page/total: 11
      /page/returned: 11
      /result/coverage/*/matched: [2, 9]
      /result/items/*/gene_id: ['HGNC:10896', 'HGNC:3603', 'HGNC:10896', 'HGNC:10896', 'HGNC:3603', 'HGNC:10896', 'HGNC:3603', 'HGNC:10896', 'HGNC:10896', 'HGNC:10896', 'HGNC:10896']
      /result/items/0/assertion/classification: Definitive
      /result/items/1/assertion/classification: Disputed
      /result/items/2/assertion/id: SGC-100001
      /result/items/3/assertion/id: SGC-105634
      /result/items/4/assertion/id: SGC-106511
      /result/items/5/assertion/id: SGC-108922
      /result/items/6/assertion/id: SGC-109553
      /result/items/7/assertion/id: SGC-109843
      /result/items/8/assertion/id: SGC-119202
      /result/items/9/assertion/id: SGC-120739
      /result/items/10/assertion/id: SGC-122539
  - run: [get, disease, 'OMIM:182212', gene-validity, --section-limit, '11']
    expect: *shprintzen_goldberg
  - run: [get, disease, 'MONDO:0008185', gene-validity, --source, gencc, --section-limit, '15']
    expect: &hereditary_pancreatitis
      /status: complete
      /page/total: 15
      /result/coverage/0/matched: 15
      /result/items/*/assertion/id: [SGC-100152, SGC-102547, SGC-102565, SGC-103577, SGC-105925, SGC-109223, SGC-109363, SGC-109443, SGC-109821, SGC-112388, SGC-114350, SGC-115484, SGC-120754, SGC-175823, SGC-177828]
  - run: [get, disease, 'ORPHA:676', gene-validity, --source, gencc, --section-limit, '15']
    expect: *hereditary_pancreatitis
  - run: [get, disease, 'Orphanet:676', gene-validity, --source, gencc, --section-limit, '1']
    expect:
      /sources/*/source: [mydisease, gencc]
      /sources/1/notices/*/message: {includes_all_of: [Coverage excludes curations for descendant diseases.]}
      /next/0/args: {includes_all_of: ['Orphanet:676', --offset, '1']}

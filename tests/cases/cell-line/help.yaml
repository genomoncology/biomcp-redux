{
  "feature": "cell-line-identity",
  "story": "Cell line commands expose sections, paging, exact source identities and two parsed examples without response inference.",
  "steps": [
    {
      "run": [
        "help",
        "search",
        "cell-line"
      ],
      "mcp": [
        "help",
        "search",
        "cell-line"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "query",
            "--limit",
            "--offset"
          ]
        },
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/description": "One literal cell line search, with native order and no total claim. An assay count is not an activity or sensitivity count. No treatment response is inferred; no bioinformatics tool runs."
      },
      "max_bytes": 1012,
      "full_output_bytes": true
    },
    {
      "run": [
        "help",
        "get",
        "cell-line"
      ],
      "mcp": [
        "help",
        "get",
        "cell-line"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "id",
            "section",
            "--section-limit",
            "--section-offset"
          ]
        },
        "/result/commands/0/description": "One exact identity and an optional bounded named section. An assay count is not an activity or sensitivity count. No treatment response is inferred; no bioinformatics tool runs.",
        "/result/commands/0/sections/*/word": {
          "includes_all_of": [
            "names",
            "identity",
            "xrefs",
            "variants",
            "chembl",
            "all"
          ]
        },
        "/result/commands/0/section_rule": "Omit for the default card; all returns bounded first pages without an assay count."
      },
      "max_bytes": 1976,
      "full_output_bytes": true
    },
    {
      "run": [
        "help",
        "cell-line",
        "assay-count"
      ],
      "mcp": [
        "help",
        "cell-line",
        "assay-count"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "id"
          ]
        },
        "/result/commands/0/description": "A separate assay-count request, never implicit in metadata or all. An assay count is not an activity or sensitivity count. No treatment response is inferred; no bioinformatics tool runs."
      },
      "max_bytes": 727,
      "full_output_bytes": true
    }
  ]
}

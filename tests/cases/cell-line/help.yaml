{
  "feature": "cell-line-identity",
  "story": "Cell line commands expose sections, paging, exact source identities and two parsed examples without response inference.",
  "steps": [
    {
      "run": [
        "help",
        "search",
        "cell-line"
      ],
      "mcp": [
        "help",
        "search",
        "cell-line"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "query",
            "--limit",
            "--offset"
          ]
        },
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/description": {
          "includes": "No treatment response is inferred; no bioinformatics tool runs."
        }
      },
      "max_bytes": 874,
      "max_tokens": 219
    },
    {
      "run": [
        "help",
        "get",
        "cell-line"
      ],
      "mcp": [
        "help",
        "get",
        "cell-line"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "id",
            "section",
            "--section-limit",
            "--section-offset"
          ]
        },
        "/result/commands/0/description": {
          "includes": "No treatment response is inferred; no bioinformatics tool runs."
        },
        "/result/commands/0/sections/*/word": {
          "includes_all_of": [
            "names",
            "identity",
            "xrefs",
            "variants",
            "chembl",
            "all"
          ]
        }
      },
      "max_bytes": 1168,
      "max_tokens": 292
    },
    {
      "run": [
        "help",
        "cell-line",
        "assay-count"
      ],
      "mcp": [
        "help",
        "cell-line",
        "assay-count"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "id"
          ]
        }
      },
      "max_bytes": 478,
      "max_tokens": 120
    }
  ]
}

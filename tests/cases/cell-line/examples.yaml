{
  "feature": "cell-line-identity",
  "story": "Executable cell line help examples preserve exact retained native requests and identities.",
  "replay": "cell-line/examples",
  "steps": [
    {
      "run": [
        "search",
        "cell-line",
        "MOLM13"
      ],
      "expect": {
        "/status": "complete",
        "/result/items/0/accession": "CVCL_2119"
      },
      "max_bytes": 1828,
      "full_output_bytes": true
    },
    {
      "run": [
        "search",
        "cell-line",
        "--query",
        "MV4;11"
      ],
      "expect": {
        "/status": "complete",
        "/result/items/0/accession": "CVCL_0064"
      },
      "max_bytes": 1562,
      "full_output_bytes": true
    },
    {
      "run": [
        "get",
        "cell-line",
        "CVCL_2119"
      ],
      "expect": {
        "/status": "complete",
        "/result/header/accession": "CVCL_2119"
      },
      "max_bytes": 2392,
      "full_output_bytes": true
    },
    {
      "run": [
        "get",
        "cell-line",
        "CVCL_0004"
      ],
      "expect": {
        "/status": "complete",
        "/result/header/accession": "CVCL_0004"
      },
      "max_bytes": 2143,
      "full_output_bytes": true
    }
  ]
}

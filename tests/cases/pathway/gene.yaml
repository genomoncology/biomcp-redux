{
  "feature": "pathway-reactome",
  "story": "The retained complete source relation pages locally without repeating the source walk.",
  "replay": "pathway/native",
  "steps": [
    {
      "run": [
        "search",
        "pathway",
        "--gene",
        "HGNC:1097"
      ],
      "mcp": [
        "search",
        "pathway",
        "--gene",
        "HGNC:1097"
      ],
      "expect": {
        "/status": "complete",
        "/result/items": {
          "count": 5
        },
        "/result/page/total": 16,
        "/result/page/next_offset": 5
      },
      "max_bytes": 10000
    },
    {
      "follow": "page",
      "offline": true,
      "expect": {
        "/status": "complete",
        "/result/page/offset": 5,
        "/result/items": {
          "count": 5
        },
        "/result/page/total": 16
      },
      "max_bytes": 10000
    },
    {
      "follow": "page",
      "offline": true,
      "expect": {
        "/status": "complete",
        "/result/page/offset": 10,
        "/result/items": {
          "count": 5
        },
        "/result/page/total": 16
      },
      "max_bytes": 10000
    },
    {
      "follow": "page",
      "offline": true,
      "expect": {
        "/status": "complete",
        "/result/page/offset": 15,
        "/result/items": {
          "count": 1
        },
        "/result/page/total": 16,
        "/next/*/kind": {
          "excludes": "page"
        }
      },
      "max_bytes": 10000
    }
  ]
}

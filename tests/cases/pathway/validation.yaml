{
  "feature": "pathway-reactome",
  "story": "Invalid selectors fail before I/O and genuine source absence never triggers a replacement search.",
  "replay": "pathway/native",
  "steps": [
    {
      "run": [
        "search",
        "pathway",
        "MAPK signaling",
        "--pool",
        "foreign-query"
      ],
      "exit": 3,
      "is_error": true,
      "expect": {
        "/error/code": "pool.expired",
        "/next/0/kind": "restart"
      },
      "max_bytes": 227
    },
    {
      "run": [
        "search",
        "pathway",
        "text",
        "--top-level"
      ],
      "exit": 2,
      "expect": {
        "/error/code": "usage.arguments"
      },
      "max_bytes": 210,
      "is_error": true
    },
    {
      "run": [
        "search",
        "pathway",
        "text",
        "--limit",
        "0"
      ],
      "exit": 2,
      "expect": {
        "/error/code": "usage.arguments"
      },
      "max_bytes": 166,
      "is_error": true
    }
  ]
}

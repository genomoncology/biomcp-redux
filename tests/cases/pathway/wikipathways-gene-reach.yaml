{
  "feature": "pathway-wikipathways-genes",
  "live_check": "public",
  "story": "WikiPathways gene membership keeps native gene nodes, joins publisher cross-references, and counts unmappable nodes. A missing Data-Source does not prevent a pathway read.",
  "verified": "GPML and distinct Entrez IDs come from the 20261110 WikiPathways release. The pathway JSON recordings retain node and cross-reference fields from the same revisions. HGNC rows and catalog entries are scoped to the recorded requests.",

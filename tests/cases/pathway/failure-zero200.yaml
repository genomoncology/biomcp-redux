  "replay": "pathway/zero200",
  "steps": [
    {
      "run": [
        "search",
        "pathway",
        "MAPK signaling"
      ],
      "exit": 4,
      "expect": {
        "/status": "failed",
        "/sources/0/source": "reactome",
        "/sources/0/terms": "CC0 1.0 database data"
      },
      "max_bytes": 268,
      "is_error": true
    },
    {
      "run": [
        "search",
        "pathway",
        "MAPK signaling"
      ],
      "offline": true,
      "exit": 4,
      "expect": {
        "/status": "failed",
        "/sources/0/reason": "offline"
      },
      "max_bytes": 266,
      "is_error": true
    }
  ]
}

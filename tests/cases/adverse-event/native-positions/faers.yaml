{
  "feature": "adverse-event-get",
  "live_check": "synthetic",
  "story": "Rejected native rows leave physical indexes and page windows intact after snapshot reload.",
  "replay": "adverse-event/native-positions/faers",
  "steps": [
    {
      "run": [
        "get",
        "adverse-event",
        "100",
        "drugs",
        "--source",
        "faers",
        "--section-limit",
        "1"
      ],
      "expect": {
        "/page/returned": 0,
        "/page/total": 4,
        "/result/drugs": {
          "omits": [
            "records"
          ]
        }
      }
    },
    {
      "follow": "page",
      "expect": {
        "/page/offset": 1,
        "/result/drugs/records/0/index": 1,
        "/result/drugs/records/0/medicinalproduct": "Synthetic position one"
      }
    },
    {
      "follow": "page",
      "expect": {
        "/page/offset": 2,
        "/page/returned": 0,
        "/result/drugs": {
          "omits": [
            "records"
          ]
        }
      }
    },
    {
      "follow": "page",
      "expect": {
        "/page/offset": 3,
        "/result/drugs/records/0/index": 3,
        "/result/drugs/records/0/medicinalproduct": "Synthetic position three"
      }
    },
    {
      "follow": "section",
      "expect": {
        "/result/unii/drug_index": 3,
        "/result/unii/records": [
          "Synthetic indexed identifier"
        ]
      }
    },
    {
      "run": [
        "get",
        "adverse-event",
        "100",
        "reactions",
        "--source",
        "faers",
        "--section-limit",
        "1"
      ],
      "expect": {
        "/page/returned": 0,
        "/page/total": 4,
        "/result/reactions": {
          "omits": [
            "records"
          ]
        }
      }
    },
    {
      "follow": "page",
      "expect": {
        "/page/offset": 1,
        "/result/reactions/records/0/index": 1,
        "/result/reactions/records/0/term/label": "Synthetic reaction one"
      }
    },
    {
      "follow": "page",
      "expect": {
        "/page/offset": 2,
        "/page/returned": 0,
        "/result/reactions": {
          "omits": [
            "records"
          ]
        }
      }
    },
    {
      "follow": "page",
      "expect": {
        "/page/offset": 3,
        "/result/reactions/records/0/index": 3,
        "/result/reactions/records/0/term/label": "Synthetic reaction three"
      }
    }
  ]
}

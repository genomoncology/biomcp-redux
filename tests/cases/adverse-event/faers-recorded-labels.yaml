{
  "feature": "adverse-event-get",
  "story": "A fatal myocarditis FAERS card labels the report's serious flag 1 or 2, seriousness 1 and the age unit with openFDA's own words, labels the undocumented 2 as not recorded, and shows the case event date openFDA carries in place of a narrative; an off-list drug role code is named as unmapped.",
  "live_check": "public",
  "replay": "adverse-event/faers-recorded-labels",
  "steps": [
    {
      "run": [
        "get",
        "adverse-event",
        "22814945"
      ],
      "expect": {
        "/status": "complete",
        "/result/header/serious": "2",
        "/result/serious_label": "The adverse event did not result in any of the above"
      }
    },
    {
      "run": [
        "get",
        "adverse-event",
        "27298481"
      ],
      "expect": {
        "/status": "complete",
        "/result/header/serious": "1",
        "/result/serious_label": "The adverse event resulted in death, a life threatening condition, hospitalization, disability, congenital anomaly, or other serious condition",
        "/result/seriousness/death": "1",
        "/result/seriousness/death_label": "The adverse event resulted in death",
        "/result/seriousness/lifethreatening": "2",
        "/result/seriousness/lifethreatening_label": "The report did not record that the adverse event resulted in a life threatening condition",
        "/result/seriousness/hospitalization": "2",
        "/result/seriousness/hospitalization_label": "The report did not record that the adverse event resulted in a hospitalization",
        "/result/seriousness/disabling_label": "The report did not record that the adverse event resulted in disability",
        "/result/seriousness/congenitalanomali_label": "The report did not record that the adverse event resulted in a congenital anomaly",
        "/result/seriousness/other_label": "The report did not record that the adverse event resulted in some other serious condition",
        "/result/patient/age/value": 76.0,
        "/result/patient/age/unit": "801",
        "/result/patient/age_unit_label": "Year",
        "/result/patient/sex_label": "Male",
        "/result/case_event_date": "CASE EVENT DATE: 20260810",
        "/result/available_sections": {
          "equals": [
            "drugs",
            "reactions"
          ]
        },
        "/result": {
          "omits": [
            "unmapped_codes"
          ]
        }
      }
    },
    {
      "run": [
        "get",
        "adverse-event",
        "22814945",
        "drugs"
      ],
      "expect": {
        "/status": "complete",
        "/result/drugs/records/1/role": "5",
        "/result/drugs/records/1/unmapped_codes": {
          "equals": [
            {
              "field": "patient.drug.drugcharacterization",
              "code": "5"
            }
          ]
        },
        "/result/drugs/records/1": {
          "omits": [
            "role_label"
          ]
        },
        "/result/drugs/records/0": {
          "omits": [
            "unmapped_codes"
          ]
        }
      }
    }
  ]
}

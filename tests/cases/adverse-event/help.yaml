{
  "feature": "adverse-event-search",
  "story": "Generated adverse-event help exposes native sources, filters, independent sections and two executable examples per command.",
  "live_check": "Help performs no source requests.",
  "steps": [
    {
      "run": [
        "help",
        "search",
        "adverse-event"
      ],
      "mcp": [
        "help",
        "search",
        "adverse-event"
      ],
      "expect": {
        "/result/commands": {
          "count": 1
        },
        "/result/commands/0/command": [
          "search",
          "adverse-event"
        ],
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "text",
            "--source",
            "--reaction",
            "--serious",
            "--received-from",
            "--received-to",
            "--limit",
            "--offset"
          ]
        },
        "": {
          "max_bytes": 1883
        },
        "/result/commands/0/arguments/6/choices": [
          "faers",
          "maude"
        ]
      },
      "max_bytes": 1884,
      "max_tokens": 471
    },
    {
      "run": [
        "help",
        "get",
        "adverse-event"
      ],
      "mcp": [
        "help",
        "get",
        "adverse-event"
      ],
      "expect": {
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/sections/*/word": [
          "drugs",
          "reactions",
          "unii",
          "rxcui",
          "product-ndc",
          "package-ndc",
          "spl-id",
          "spl-set-id",
          "application-number",
          "devices",
          "narrative"
        ],
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "id",
            "--source",
            "section",
            "--snapshot",
            "--drug-index",
            "--section-limit",
            "--section-offset"
          ]
        }
      },
      "max_bytes": 4000
    }
  ]
}

feature: disease-hpo-release
live_check: synthetic replay
story: A named HPO release keeps the same collection array on multi-row, single-row and exhausted pages through CLI and MCP.
replay: disease/hpo-release
steps:
  - run: &many [search, disease, --hpo-release, v2099-01-01, --phenotype, "HP:0001083",
     --phenotype, "HP:0000098", --phenotype, "HP:0001634", --limit, "2"]
    mcp: *many
    expect:
      /status: complete
      /result/items: {count: 2}
  - run: &one [search, disease, --hpo-release, v2099-01-01, --phenotype, "HP:0001083",
     --phenotype, "HP:0000098", --phenotype, "HP:0001634", --limit, "2", --offset, "1"]
    mcp: *one
    expect:
      /status: complete
      /result/items: {count: 1}
  - run: &end [search, disease, --hpo-release, v2099-01-01, --phenotype, "HP:0001083",
     --phenotype, "HP:0000098", --phenotype, "HP:0001634", --limit, "2", --offset, "2"]
    mcp: *end
    expect:
      /status: complete
      /page/total: 2
      /page/returned: 0
      /result/items: []

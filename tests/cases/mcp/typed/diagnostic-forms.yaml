{
  "live_check": "offline parser checks after one retained trial replay initializes the isolated case cache; no source requests",
  "feature": "mcp-parity",
  "story": "The search and get examples in the diagnostic tool's description and the argument names agents guess for them reach the same commands and queries.",
  "replay": "trial/condition",
  "config": {
    "mcp_tool_mode": "typed",
    "mcp_typed_output_schema": true
  },
  "steps": [
    {
      "run": [
        "search",
        "trial",
        "--condition",
        "melanoma"
      ],
      "expect": {
        "/status": "complete"
      }
    },
    {
      "mcp_call": {
        "name": "diagnostic",
        "arguments": {
          "action": "search",
          "search": {
            "query": "FoundationOne CDx",
            "source": "fda-pma"
          }
        }
      },
      "expect": {
        "/query/name": "FoundationOne CDx",
        "/query/source": "fda-pma",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "diagnostic",
        "arguments": {
          "action": "search",
          "search": {
            "name": "FoundationOne CDx",
            "source": "fda-pma"
          }
        }
      },
      "expect": {
        "/query/name": "FoundationOne CDx",
        "/query/source": "fda-pma",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "diagnostic",
        "arguments": {
          "action": "search",
          "search": {
            "keyword": "FoundationOne CDx",
            "source": "fda-pma"
          }
        }
      },
      "expect": {
        "/query/name": "FoundationOne CDx",
        "/query/source": "fda-pma",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "diagnostic",
        "arguments": {
          "action": "search",
          "search": {
            "keywords": [
              "FoundationOne",
              "CDx"
            ],
            "source": "fda-pma"
          }
        }
      },
      "expect": {
        "/query/name": "FoundationOne CDx",
        "/query/source": "fda-pma",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "diagnostic",
        "arguments": {
          "action": "get",
          "get": {
            "id": "P170019",
            "source": "fda-pma",
            "section": "summary"
          }
        }
      },
      "expect": {
        "/query/id": "P170019",
        "/query/source": "fda-pma",
        "/query/section": "summary",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "diagnostic",
        "arguments": {
          "action": "get",
          "get": {
            "source": "fda-pma",
            "section": "summary",
            "input": [
              "P170019"
            ]
          }
        }
      },
      "expect": {
        "/query/id": "P170019",
        "/query/source": "fda-pma",
        "/query/section": "summary",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "diagnostic",
        "arguments": {
          "action": "get",
          "get": {
            "source": "fda-pma",
            "section": "summary",
            "input": "P170019"
          }
        }
      },
      "expect": {
        "/query/id": "P170019",
        "/query/source": "fda-pma",
        "/query/section": "summary",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "diagnostic",
        "arguments": {
          "action": "get",
          "get": {
            "source": "fda-pma",
            "section": "summary",
            "id": [
              "P170019"
            ]
          }
        }
      },
      "expect": {
        "/query/id": "P170019",
        "/query/source": "fda-pma",
        "/query/section": "summary",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "diagnostic",
        "arguments": {
          "action": "get",
          "get": {
            "id": "P170019",
            "source": "fda-pma",
            "sections": [
              "summary"
            ]
          }
        }
      },
      "expect": {
        "/query/id": "P170019",
        "/query/source": "fda-pma",
        "/query/section": "summary",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "diagnostic",
        "arguments": {
          "action": "get",
          "get": {
            "source": "fda-pma",
            "sections": [
              "summary"
            ],
            "input": [
              "P170019"
            ]
          }
        }
      },
      "expect": {
        "/query/id": "P170019",
        "/query/source": "fda-pma",
        "/query/section": "summary",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    }
  ]
}

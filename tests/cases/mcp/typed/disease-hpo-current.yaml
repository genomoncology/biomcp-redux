feature: disease-hpo-release
story: Typed disease search can use the current HPO release and passes its exact tag to the next page.
replay: disease/hpo-release
config:
  mcp_tool_mode: typed
  mcp_typed_output_schema: true
steps:
  - mcp_call:
      name: disease
      arguments:
        action: search
        search:
          source: hpo
          phenotype: ["HP:0001083"]
    expect:
      /status: complete
      /result/release: v2099-02-01
  - mcp_call:
      name: disease
      arguments:
        action: search
        search:
          hpo_release: latest
          phenotype: ["HP:0001083", "HP:0000098", "HP:0001634"]
          limit: 1
    expect:
      /status: complete
      /result/release: v2099-02-01
      /next/0/arguments/search/hpo_release: v2099-02-01
  - follow: page
    expect:
      /page/total: 3
      /page/returned: 1
      /result/release: v2099-02-01
      /result/items/0/id: "OMIM:900007"
      /result/items/0/gene_links_missing: true
      /result/items/0: {omits: [gene_links]}

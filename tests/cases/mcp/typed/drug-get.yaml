        "arguments": {
          "action": "get",
          "get": {
            "id": "imatinib",
            "section": "approvals"
          }
        }
      },
      "expect": {
        "/query/query": "imatinib",
        "/query/source": "drugsfda",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },

{
  "live_check": "offline parser checks; no source requests",
  "feature": "mcp-parity",
  "story": "The variant tool's get example from its description passes the advertised schema and reaches its command, and the argument names agents guess reach the same query. No retained reply covers this example, so every step is an offline parser check.",
  "config": {
    "mcp_tool_mode": "typed",
    "mcp_typed_output_schema": true
  },
  "steps": [
    {
      "mcp_call": {
        "name": "variant",
        "arguments": {
          "action": "get",
          "get": {
            "id": "rs113488022"
          }
        }
      },
      "expect": {
        "/query/input": "rs113488022",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "variant",
        "arguments": {
          "action": "get",
          "get": {
            "input": [
              "rs113488022"
            ]
          }
        }
      },
      "expect": {
        "/query/input": "rs113488022",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "variant",
        "arguments": {
          "action": "get",
          "get": {
            "input": "rs113488022"
          }
        }
      },
      "expect": {
        "/query/input": "rs113488022",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "variant",
        "arguments": {
          "action": "get",
          "get": {
            "id": [
              "rs113488022"
            ]
          }
        }
      },
      "expect": {
        "/query/input": "rs113488022",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "variant",
        "arguments": {
          "action": "get",
          "get": {
            "id": "rs113488022",
            "section": "clinvar"
          }
        }
      },
      "expect": {
        "/query/input": "rs113488022",
        "/query/section": [
          "clinvar"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "variant",
        "arguments": {
          "action": "get",
          "get": {
            "input": [
              "rs113488022"
            ],
            "sections": [
              "clinvar"
            ]
          }
        }
      },
      "expect": {
        "/query/input": "rs113488022",
        "/query/section": [
          "clinvar"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    }
  ]
}

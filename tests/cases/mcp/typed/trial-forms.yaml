{
  "live_check": "offline parser checks after one retained trial replay initializes the isolated case cache; no source requests",
  "feature": "mcp-parity",
  "story": "The search and get examples in the trial tool's description and the argument names agents guess for them reach the same commands and queries.",
  "replay": "trial/condition",
  "config": {
    "mcp_tool_mode": "typed",
    "mcp_typed_output_schema": true
  },
  "steps": [
    {
      "run": [
        "search",
        "trial",
        "--condition",
        "melanoma"
      ],
      "expect": {
        "/status": "complete"
      }
    },
    {
      "mcp_call": {
        "name": "trial",
        "arguments": {
          "action": "search",
          "search": {
            "condition": "melanoma",
            "intervention": "pembrolizumab"
          }
        }
      },
      "expect": {
        "/query/condition": [
          "melanoma"
        ],
        "/query/intervention": [
          "pembrolizumab"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "trial",
        "arguments": {
          "action": "search",
          "search": {
            "condition": [
              "melanoma"
            ],
            "intervention": [
              "pembrolizumab"
            ]
          }
        }
      },
      "expect": {
        "/query/condition": [
          "melanoma"
        ],
        "/query/intervention": [
          "pembrolizumab"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "trial",
        "arguments": {
          "action": "get",
          "get": {
            "id": "NCT02578680"
          }
        }
      },
      "expect": {
        "/query/input": [
          "NCT02578680"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "trial",
        "arguments": {
          "action": "get",
          "get": {
            "input": [
              "NCT02578680"
            ]
          }
        }
      },
      "expect": {
        "/query/input": [
          "NCT02578680"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "trial",
        "arguments": {
          "action": "get",
          "get": {
            "input": "NCT02578680"
          }
        }
      },
      "expect": {
        "/query/input": [
          "NCT02578680"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "trial",
        "arguments": {
          "action": "get",
          "get": {
            "id": [
              "NCT02578680"
            ]
          }
        }
      },
      "expect": {
        "/query/input": [
          "NCT02578680"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "trial",
        "arguments": {
          "action": "get",
          "get": {
            "id": "NCT02578680",
            "section": "eligibility"
          }
        }
      },
      "expect": {
        "/query/input": [
          "NCT02578680"
        ],
        "/query/section": [
          "eligibility"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "trial",
        "arguments": {
          "action": "get",
          "get": {
            "input": [
              "NCT02578680"
            ],
            "sections": [
              "eligibility"
            ]
          }
        }
      },
      "expect": {
        "/query/input": [
          "NCT02578680"
        ],
        "/query/section": [
          "eligibility"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    }
  ]
}

{
  "live_check": "offline parser checks after one retained trial replay initializes the isolated case cache; no source requests",
  "feature": "mcp-parity",
  "story": "The search and get examples in the adverse_event tool's description and the argument names agents guess for them reach the same commands and queries. No retained reply covers the get example, so this offline check is its only proof.",
  "replay": "trial/condition",
  "config": {
    "mcp_tool_mode": "typed",
    "mcp_typed_output_schema": true
  },
  "steps": [
    {
      "run": [
        "search",
        "trial",
        "--condition",
        "melanoma"
      ],
      "expect": {
        "/status": "complete"
      }
    },
    {
      "mcp_call": {
        "name": "adverse_event",
        "arguments": {
          "action": "search",
          "search": {
            "query": "pembrolizumab"
          }
        }
      },
      "expect": {
        "/query/text": "pembrolizumab",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "adverse_event",
        "arguments": {
          "action": "search",
          "search": {
            "text": "pembrolizumab"
          }
        }
      },
      "expect": {
        "/query/text": "pembrolizumab",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "adverse_event",
        "arguments": {
          "action": "search",
          "search": {
            "keyword": "pembrolizumab"
          }
        }
      },
      "expect": {
        "/query/text": "pembrolizumab",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "adverse_event",
        "arguments": {
          "action": "search",
          "search": {
            "keywords": [
              "pembrolizumab"
            ]
          }
        }
      },
      "expect": {
        "/query/text": "pembrolizumab",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "adverse_event",
        "arguments": {
          "action": "get",
          "get": {
            "id": "27325180"
          }
        }
      },
      "expect": {
        "/query/id": "27325180",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "adverse_event",
        "arguments": {
          "action": "get",
          "get": {
            "input": [
              "27325180"
            ]
          }
        }
      },
      "expect": {
        "/query/id": "27325180",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "adverse_event",
        "arguments": {
          "action": "get",
          "get": {
            "input": "27325180"
          }
        }
      },
      "expect": {
        "/query/id": "27325180",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "adverse_event",
        "arguments": {
          "action": "get",
          "get": {
            "id": [
              "27325180"
            ]
          }
        }
      },
      "expect": {
        "/query/id": "27325180",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "adverse_event",
        "arguments": {
          "action": "get",
          "get": {
            "id": "27325180",
            "section": "reactions"
          }
        }
      },
      "expect": {
        "/query/id": "27325180",
        "/query/section": "reactions",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "adverse_event",
        "arguments": {
          "action": "get",
          "get": {
            "input": [
              "27325180"
            ],
            "sections": [
              "reactions"
            ]
          }
        }
      },
      "expect": {
        "/query/id": "27325180",
        "/query/section": "reactions",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    }
  ]
}

{
  "live_check": "offline parser checks after one retained trial replay initializes the isolated case cache; no source requests",
  "feature": "mcp-parity",
  "story": "The search and get examples in the article tool's description and the argument names agents guess for them reach the same commands and queries.",
  "replay": "trial/condition",
  "config": {
    "mcp_tool_mode": "typed",
    "mcp_typed_output_schema": true
  },
  "steps": [
    {
      "run": [
        "search",
        "trial",
        "--condition",
        "melanoma"
      ],
      "expect": {
        "/status": "complete"
      }
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "search",
          "search": {
            "query": "AKT1 E17K"
          }
        }
      },
      "expect": {
        "/query/text": "AKT1 E17K",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "search",
          "search": {
            "text": "AKT1 E17K"
          }
        }
      },
      "expect": {
        "/query/text": "AKT1 E17K",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "search",
          "search": {
            "keyword": "AKT1 E17K"
          }
        }
      },
      "expect": {
        "/query/text": "AKT1 E17K",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "search",
          "search": {
            "keywords": [
              "AKT1",
              "E17K"
            ]
          }
        }
      },
      "expect": {
        "/query/text": "AKT1 E17K",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "get",
          "get": {
            "id": "33123537"
          }
        }
      },
      "expect": {
        "/query/input": [
          "33123537"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "get",
          "get": {
            "input": [
              "33123537"
            ]
          }
        }
      },
      "expect": {
        "/query/input": [
          "33123537"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "get",
          "get": {
            "input": "33123537"
          }
        }
      },
      "expect": {
        "/query/input": [
          "33123537"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "get",
          "get": {
            "id": [
              "33123537"
            ]
          }
        }
      },
      "expect": {
        "/query/input": [
          "33123537"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "get",
          "get": {
            "id": "33123537",
            "section": "citations"
          }
        }
      },
      "expect": {
        "/query/input": [
          "33123537"
        ],
        "/query/section": [
          "citations"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "get",
          "get": {
            "input": [
              "33123537"
            ],
            "sections": [
              "citations"
            ]
          }
        }
      },
      "expect": {
        "/query/input": [
          "33123537"
        ],
        "/query/section": [
          "citations"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    }
  ]
}

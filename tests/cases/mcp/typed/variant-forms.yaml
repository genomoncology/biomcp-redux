{
  "live_check": "offline parser checks after one retained trial replay initializes the isolated case cache; no source requests",
  "feature": "mcp-parity",
  "story": "The search and get examples in the variant tool's description and the argument names agents guess for them reach the same commands and queries. No retained reply covers the search or get example, so this offline check is its only proof.",
  "replay": "trial/condition",
  "config": {
    "mcp_tool_mode": "typed",
    "mcp_typed_output_schema": true
  },
  "steps": [
    {
      "run": [
        "search",
        "trial",
        "--condition",
        "melanoma"
      ],
      "expect": {
        "/status": "complete"
      }
    },
    {
      "mcp_call": {
        "name": "variant",
        "arguments": {
          "action": "search",
          "search": {
            "gene": "BRAF",
            "protein": "V600E"
          }
        }
      },
      "expect": {
        "/query/gene": "BRAF",
        "/query/protein": "V600E",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "variant",
        "arguments": {
          "action": "get",
          "get": {
            "id": "rs113488022"
          }
        }
      },
      "expect": {
        "/query/input": "rs113488022",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "variant",
        "arguments": {
          "action": "get",
          "get": {
            "input": [
              "rs113488022"
            ]
          }
        }
      },
      "expect": {
        "/query/input": "rs113488022",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "variant",
        "arguments": {
          "action": "get",
          "get": {
            "input": "rs113488022"
          }
        }
      },
      "expect": {
        "/query/input": "rs113488022",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "variant",
        "arguments": {
          "action": "get",
          "get": {
            "id": [
              "rs113488022"
            ]
          }
        }
      },
      "expect": {
        "/query/input": "rs113488022",
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "variant",
        "arguments": {
          "action": "get",
          "get": {
            "id": "rs113488022",
            "section": "clinvar"
          }
        }
      },
      "expect": {
        "/query/input": "rs113488022",
        "/query/section": [
          "clinvar"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    },
    {
      "mcp_call": {
        "name": "variant",
        "arguments": {
          "action": "get",
          "get": {
            "input": [
              "rs113488022"
            ],
            "sections": [
              "clinvar"
            ]
          }
        }
      },
      "expect": {
        "/query/input": "rs113488022",
        "/query/section": [
          "clinvar"
        ],
        "/status": "failed"
      },
      "offline": true,
      "is_error": true
    }
  ]
}

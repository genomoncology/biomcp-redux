live_check: local-only case
feature: mcp
story: The schema command and typed usage results agree through MCP and CLI
steps:
  - run: [schema, biodata.source/1]
    mcp: [schema, biodata.source/1]
    max_bytes: 4096
    expect:
      /$id: biodata.source/1
  - run: []
    mcp: []
    exit: 2
    is_error: true
    expect:
      /status: usage
  - mcp: [serve]
    is_error: true
    expect:
      /status: usage

{
  "feature": "variant-help",
  "live_check": "local-only fixed migration guidance",
  "story": "Changed variant spellings name their explicit replacement before any source access.",
  "steps": [
    {
      "run": [
        "variant",
        "structure",
        "rs113488022"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "deferred; use: get gene <SYMBOL> protein"
      }
    },
    {
      "run": [
        "variant",
        "oncokb",
        "rs113488022"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "use: get variant <ID> oncokb --build <GRCh37|GRCh38> --tumor-type <TEXT>; requires your oncokb key"
      }
    },
    {
      "run": [
        "variant",
        "erepo",
        "CA000434"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "use: variant assertions <CAid> --source erepo; select --assertion <PCERid> --version <VERSION> for details; no gene-wide fallback"
      }
    },
    {
      "run": [
        "variant",
        "normalize",
        "car",
        "NM_004333.4:c.1799T>A"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "use: variant normalize --source <car|mutalyzer|variantvalidator|all> --hgvs <TEXT>; VariantValidator and all require --build"
      }
    },
    {
      "run": [
        "get",
        "variant",
        "rs113488022",
        "--assembly",
        "GRCh37"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "renamed; use: --build"
      }
    },
    {
      "run": [
        "search",
        "variant",
        "--gene",
        "BRAF",
        "--hgvsp",
        "V600E"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "renamed; use: --protein with --gene"
      }
    },
    {
      "run": [
        "get",
        "variant",
        "rs113488022",
        "predictions"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "renamed; use: get variant <ID> predict"
      }
    },
    {
      "run": [
        "get",
        "variant",
        "CA123643",
        "population-details"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "use: variant population <ID> --detail"
      }
    },
    {
      "run": [
        "get",
        "variant",
        "CA123643",
        "cbioportal"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "use: variant recurrence <ID> --source cbioportal --gene <SYMBOL> --study <ID> --profile <ID> --sample-set <ID>; no default cohort"
      }
    },
    {
      "run": [
        "get",
        "variant",
        "rs113488022",
        "cgi"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "deferred; no proved current CGI section"
      }
    },
    {
      "run": [
        "variant",
        "cspec",
        "rs113488022"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "deferred until a harvested question requires variant cspec"
      }
    },
    {
      "run": [
        "variant",
        "normalize",
        "--source",
        "car",
        "--input",
        "NM_004333.4:c.1799T>A"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "use: variant normalize --source <car|mutalyzer|variantvalidator|all> --hgvs <TEXT>; VariantValidator and all require --build"
      }
    }
  ]
}

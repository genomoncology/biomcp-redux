{
  "feature": "variant-identity",
  "replay": "variant/id-forms",
  "live_check": "recorded",
  "story": "The complete VCF reference, including the trimmed anchor, must match the selected source assembly before an answer.",
  "steps": [
    {
      "run": [
        "get",
        "variant",
        "13-32315508-GT-G"
      ],
      "exit": 1,
      "expect": {
        "/result/resolution": "rejected",
        "/result/rejection": "IncorrectReferenceAllele: expected reference AG",
        "/result/candidates": {
          "count": 0
        }
      }
    },
    {
      "run": [
        "get",
        "variant",
        "7-117559590-GTCT-G"
      ],
      "exit": 1,
      "expect": {
        "/result/resolution": "rejected",
        "/result/rejection": "IncorrectReferenceAllele: expected reference ATCT",
        "/result/candidates": {
          "count": 0
        }
      }
    },
    {
      "run": [
        "get",
        "variant",
        "7-117559590-ATCT-A",
        "--build",
        "GRCh37"
      ],
      "exit": 1,
      "expect": {
        "/result/resolution": "rejected",
        "/result/rejection": {
          "includes_all_of": [
            "IncorrectReferenceAllele: expected reference"
          ]
        }
      }
    }
  ]
}

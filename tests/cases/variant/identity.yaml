{
  "feature": "variant-identity",
  "live_check": "synthetic",
  "story": "Published variant identifiers retain identity and source policy before lookup",
  "steps": [
    {
      "run": [
        "get",
        "variant",
        "rs113488022",
        "--limit",
        "0"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/4",
        "/error/message": "value not accepted: give error.option a value valid_values accepts",
        "/error/option": "--limit",
        "/next/0/args": [
          "help",
          "get",
          "variant"
        ],
        "/error/valid_values/0": "integer >= 1 <= 50"
      }
    },
    {
      "run": [
        "get",
        "variant",
        "rs113488022",
        "--offset",
        "-1"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/4",
        "/error/message": "value not accepted: give error.option a value valid_values accepts",
        "/error/option": "--offset",
        "/next/0/args": [
          "help",
          "get",
          "variant"
        ],
        "/error/valid_values/0": "integer >= 0"
      }
    }
  ]
}

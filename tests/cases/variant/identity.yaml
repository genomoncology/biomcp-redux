{
  "feature": "variant-identity",
  "live_check": "synthetic",
  "story": "Published variant identifiers retain identity and source policy before lookup",
  "steps": [
    {
      "run": [
        "get",
        "variant",
        "rs113488022",
        "--disable-sources",
        "myvariant"
      ],
      "mcp": [
        "get",
        "variant",
        "rs113488022",
        "--disable-sources",
        "myvariant"
      ],
      "expect": {
        "/schema": "biomcp.variant-card/8",
        "/result/resolution": "unavailable",
        "/sources/0/source": "myvariant",
        "/sources/0/reason": "disabled"
      },
      "exit": 4,
      "is_error": true
    },
    {
      "run": [
        "get",
        "variant",
        "BRAF V600E"
      ],
      "mcp": [
        "get",
        "variant",
        "BRAF V600E"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/1",
        "/error/message": "get variant needs an rsID, CAid, ClinVar Variation ID or reference-qualified HGVS; chromosome notation needs --build; use search variant --gene BRAF --protein V600E for gene/protein shorthand"
      }
    },
    {
      "run": [
        "get",
        "variant",
        "BRAF"
      ],
      "mcp": [
        "get",
        "variant",
        "BRAF"

{
  "feature": "variant-identity",
  "live_check": "synthetic",
  "story": "Published variant identifiers retain identity and source policy before lookup",
  "steps": [
    {
      "run": [
        "get",
        "variant",
        "rs113488022",
        "--limit",
        "0"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/4",
        "/error/message": "get variant needs an rsID, CAid, ClinVar Variation ID or reference-qualified HGVS; chromosome notation needs --build; use search variant --gene BRAF --protein V600E or search variant --gene PTEN --coding c.333G>T for gene shorthand"
      }
    },
    {
      "run": [
        "get",
        "variant",
        "rs113488022",
        "--offset",
        "-1"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/4",
        "/error/message": "get variant needs an rsID, CAid, ClinVar Variation ID or reference-qualified HGVS; chromosome notation needs --build; use search variant --gene BRAF --protein V600E or search variant --gene PTEN --coding c.333G>T for gene shorthand"
      }
    }
  ]
}

{
  "feature": "variant-population",
  "live_check": "synthetic policy refusal without provider requests",
  "story": "Disabled named sections skip identity resolution before testing source join fields",
  "steps": [
    {
      "run": [
        "get",
        "variant",
        "CA123643",
        "population",
        "--disable-sources",
        "gnomad"
      ],
      "expect": {
        "/result/resolution": "unresolved",
        "/result/candidates/0/sections/population/state": "skipped",
        "/result/candidates/0/sections/population/reason": "disabled",
        "/sources/0/source": "gnomad",
        "/sources/0/reason": "disabled"
      },
      "max_bytes": 567
    },
    {
      "run": [
        "get",
        "variant",
        "CA123643",
        "gwas",
        "--disable-sources",
        "gwas"
      ],
      "expect": {
        "/result/resolution": "unresolved",
        "/result/candidates/0/sections/gwas/state": "skipped",
        "/result/candidates/0/sections/gwas/reason": "disabled",
        "/sources/0/source": "gwas",
        "/sources/0/reason": "disabled"
      },
      "max_bytes": 544
    }
  ]
}

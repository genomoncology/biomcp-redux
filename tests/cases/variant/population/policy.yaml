{
  "feature": "variant-population",
  "live_check": "synthetic",
  "story": "Disabled population is refused before identity resolution through CLI and MCP",
  "steps": [
    {
      "run": [
        "variant",
        "population",
        "CA123643",
        "--detail",
        "--disable-sources",
        "gnomad"
      ],
      "mcp": [
        "variant",
        "population",
        "CA123643",
        "--detail",
        "--disable-sources",
        "gnomad"
      ],
      "exit": 4,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.variant-population/4",
        "/status": "failed",
        "/result/population/state": "skipped",
        "/result/population/reason": "disabled"
      },
      "max_bytes": 306
    }
  ]
}

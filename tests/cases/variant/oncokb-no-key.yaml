{
  "feature": "variant-oncokb",
  "live_check": "local-only; a keyless OncoKB section stops before any source request",
  "replay": "variant/id-forms",
  "story": "A variant with an OncoKB section requested and no key gives a partial reply that names the skipped section and points at the key help, with or without a tumor type",
  "steps": [
    {
      "run": [
        "get",
        "variant",
        "CA123643",
        "oncokb"
      ],
      "exit": 0,
      "expect": {
        "/status": "partial",
        "/incomplete/0": {
          "at": "/result/candidates/0/sections/oncokb",
          "source": "oncokb",
          "reason": "no-key"
        },
        "/result/candidates/0/sections/oncokb/state": "skipped",
        "/result/candidates/0/sections/oncokb/reason": "no-key",
        "/sources": {
          "includes": {
            "source": "oncokb",
            "state": "skipped",
            "reason": "no-key",
            "use": "licensed"
          }
        },
        "/next/*/args": {
          "includes": [
            "help",
            "key",
            "oncokb"
          ]
        }
      }
    },
    {
      "run": [
        "get",
        "variant",
        "clinvar:13961",
        "oncokb",
        "--tumor-type",
        "Melanoma"
      ],
      "offline": true,
      "exit": 0,
      "expect": {
        "/status": "partial",
        "/result/candidates/0/sections/oncokb/state": "skipped",
        "/result/candidates/0/sections/oncokb/reason": "no-key",
        "/next/*/args": {
          "includes": [
            "help",
            "key",
            "oncokb"
          ]
        }
      }
    }
  ]
}

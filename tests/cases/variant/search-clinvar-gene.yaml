feature: variant-search
story: ClinVar gene pages preserve the native total and list a copy-number loss with a VCV get step
replay: variant/search/clinvar-gene
config: {mcp_tool_mode: typed}
verified: Recorded ClinVar ESearch, ESummary and EFetch replies on 2026-11-28.
steps:
  - run: [search, variant, --gene, DMD, --source, clinvar, --limit, "10"]
    expect:
      /status: complete
      /sources/0/source: clinvar
      /page/total: 12246
      /page/returned: 10
      /page/truncated: true
      /result/items/7/label: "GRCh37/hg19 Xp21.1(chrX:31893305-31893490)x0"
      /result/items/7/identity: {omits: [representations]}
      /result/items/7/identity/ids/1: VCV005040764
      /result/items/7/record/id: VCV005040764
      /next/7/args: [get, variant, VCV005040764, clinvar]
  - follow: page
    expect:
      /status: complete
      /page/offset: 10
      /page/total: 12246
      /result/items/0/record/id: VCV005040013
  - run: [search, variant, --gene, DMD, --source, clinvar, --classification, pathogenic, --limit, "3"]
    expect:
      /status: complete
      /page/total: 3068
      /page/returned: 3
      /result/items/0/record/id: VCV005043371
  - mcp_call:
      name: variant
      arguments:
        action: search
        search:
          gene: DMD
          source: clinvar
          classification: pathogenic
          review_status: "criteria provided, single submitter"
          limit: 3
    expect:
      /status: complete
      /page/total: 2220
      /result/items/0/record/id: VCV005043104
  - run: [get, variant, VCV005040764, clinvar]
    expect:
      /status: complete
      /sources/0/source: clinvar
      /result/candidates/0/sections/clinvar/data/assertions/0/record: VCV005040764

        "/result/assertions/40/unmapped/attribution/record": "SCV000484957",
        "/result/assertions/40/submitter": "GeneReviews",
        "/result/next/kind": "scv",
        "/result/next/offset": 50
      }
    },
    {
      "run": [
        "variant",

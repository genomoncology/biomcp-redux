{
  "feature": "variant-identity",
  "live_check": "synthetic",
  "story": "Parenthesized reference inputs preserve checked references and refuse malformed inner labels before lookup",
  "steps": [
    {
      "run": [
        "get",
        "variant",
        "NM_004333.4(BRAF):c.1799T>A",
        "--disable-sources",
        "car,myvariant"
      ],
      "mcp": [
        "get",
        "variant",
        "NM_004333.4(BRAF):c.1799T>A",
        "--disable-sources",
        "car,myvariant"
      ],
      "exit": 4,
      "is_error": true,
      "expect": {
        "/status": "failed",
        "/result/resolution": "unavailable",
        "/query/input": "NM_004333.4(BRAF):c.1799T>A",
        "/sources/0/source": "car",
        "/sources/0/reason": "disabled"
      }
    },
    {
      "run": [
        "get",
        "variant",
        "NC_000007.14(NM_004333.4):g.140753336A>T",
        "--disable-sources",
        "car,myvariant"
      ],
      "mcp": [
        "get",
        "variant",
        "NC_000007.14(NM_004333.4):g.140753336A>T",
        "--disable-sources",
        "car,myvariant"
      ],
      "exit": 4,
      "is_error": true,
      "expect": {
        "/status": "failed",
        "/result/resolution": "unavailable",
        "/query/input": "NC_000007.14(NM_004333.4):g.140753336A>T",
        "/sources/0/source": "car",
        "/sources/0/reason": "disabled"
      }
    },
    {
      "run": [
        "get",
        "variant",
        "NM_004333.4(BRAF:c.1799T>A",
        "--disable-sources",
        "car,myvariant"
      ],
      "mcp": [
        "get",
        "variant",
        "NM_004333.4(BRAF:c.1799T>A",
        "--disable-sources",
        "car,myvariant"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/4"
      }
    },
    {
      "run": [
        "get",
        "variant",
        "NM_004333.4(@BRAF):c.1799T>A",
        "--disable-sources",
        "car,myvariant"
      ],
      "mcp": [
        "get",
        "variant",
        "NM_004333.4(@BRAF):c.1799T>A",
        "--disable-sources",
        "car,myvariant"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/4"
      }
    }
  ]
}

{
  "feature": "variant-identity",
  "live_check": "synthetic projection of native identity facts",
  "replay": "variant/search/protein-selector",
  "story": "Explicit GRCh37 gene and protein lookup returns each candidate for substitutions that can span two bases.",
  "steps": [
    {
      "run": [
        "get",
        "variant",
        "BRAF V600K",
        "--build",
        "GRCh37"
      ],
      "expect": {
        "/status": "complete",
        "/result/resolution": "candidates",
        "/result/candidates/*/record/id": {
          "equals": [
            "chr7:g.140453136_140453137delinsTT"
          ]
        },
        "/page/total": 1
      }
    },
    {
      "run": [
        "get",
        "variant",
        "BRAF V600R",
        "--build",
        "GRCh37"
      ],
      "expect": {
        "/status": "complete",
        "/result/resolution": "candidates",
        "/result/candidates/*/record/id": {
          "equals": [
            "chr7:g.140453136_140453137delinsCT",
            "chr7:g.140453136_140453137delinsCG"
          ]
        },
        "/page/total": 2
      }
    },
    {
      "run": [
        "get",
        "variant",
        "KRAS G12F",
        "--build",
        "GRCh37"
      ],
      "expect": {
        "/status": "complete",

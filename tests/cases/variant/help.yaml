{
  "feature": "variant-help",
  "live_check": "local-only generated command help",
  "story": "Variant help names accepted identifiers, explicit search selectors and bounded source drill-downs without clinical interpretation.",
  "steps": [
    {
      "run": [
        "help",
        "get",
        "variant"
      ],
      "mcp": [
        "help",
        "get",
        "variant"
      ],

{
  "feature": "article-search",
  "story": "Semantic Scholar rejects unsupported filters before asking any source",
  "replay": "article/fold/synthetic-fold",
  "steps": [
    {
      "run": [
        "search",
        "article",
        "AKT1",
        "--source",
        "pubmed,semantic-scholar",
        "--author",
        "Carpten"
      ],
      "mcp": [
        "search",
        "article",
        "AKT1",
        "--source",
        "pubmed,semantic-scholar",
        "--author",
        "Carpten"
      ],
      "exit": 2,
      "max_bytes": 250,
      "expect": {
        "/error/code": "usage.unsupported_filter",
        "/error/source": "semantic-scholar",
        "/error/option": "--author"
      },
      "is_error": true
    },
    {
      "run": [
        "search",
        "article",
        "EGFR",
        "--source",
        "semantic-scholar",
        "--journal",
        "Nature"
      ],
      "mcp": [
        "search",
        "article",
        "EGFR",
        "--source",
        "semantic-scholar",
        "--journal",
        "Nature"
      ],
      "exit": 2,
      "max_bytes": 250,
      "expect": {
        "/error/code": "usage.unsupported_filter",
        "/error/source": "semantic-scholar",
        "/error/option": "--journal"
      },
      "is_error": true
    },
    {
      "run": [
        "search",
        "article",
        "EGFR",
        "--source",
        "semantic-scholar",
        "--type",
        "trial"
      ],
      "mcp": [
        "search",
        "article",
        "EGFR",
        "--source",
        "semantic-scholar",
        "--type",
        "trial"
      ],
      "exit": 2,
      "max_bytes": 250,
      "expect": {
        "/error/code": "usage.unsupported_filter",
        "/error/source": "semantic-scholar",
        "/error/option": "--type"
      },
      "is_error": true
    },
    {
      "run": [
        "search",
        "article",
        "EGFR",
        "--source",
        "semantic-scholar",
        "--sort",
        "date"
      ],
      "mcp": [
        "search",
        "article",
        "EGFR",
        "--source",
        "semantic-scholar",
        "--sort",
        "date"
      ],
      "exit": 2,
      "max_bytes": 250,
      "expect": {
        "/error/code": "usage.unsupported_filter",
        "/error/source": "semantic-scholar",
        "/error/option": "--sort date"
      },
      "is_error": true
    }
  ]
}

{
  "feature": "article-citations",
  "story": "Recorded default AKT1 search keeps the review paper on its first page; its citation strategy finds the original paper first.",
  "replay": "article/citations/live",
  "steps": [
    {
      "run": [
        "search",
        "article",
        "AKT1 E17K"
      ],
      "expect": {
        "/result/items/*/pmid": {
          "includes": "33123537"
        },
        "/next/2/args": [
          "search",
          "article",
          "AKT1 E17K",
          "--sort",
          "citations"
        ]
      }
    },
    {
      "follow": "sort",
      "expect": {
        "/result/items/0/pmid": "17611497",
        "/query/sort": "citations",
        "/result/items/*/cited_by": {
          "nonincreasing": true
        }
      }
    }
  ]
}

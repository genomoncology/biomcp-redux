{
  "feature": "article-citations",
  "story": "Synthetic graph edges deduplicate before counts and retain direction in warm snapshot identities.",
  "replay": "article/citations/synthetic-edges",
  "steps": [
    {
      "run": [
        "article",
        "citations",
        "1111",
        "--limit",
        "1"
      ],
      "expect": {
        "/page/total": 2,
        "/result/items/0/pmid": "3333"
      }
    },
    {
      "follow": "page",
      "expect": {
        "/result/items/0/pmid": "2222",
        "/page/offset": 1
      }
    },
    {
      "run": [
        "article",
        "references",
        "1111"
      ],
      "expect": {
        "/page/total": 1,
        "/result/items/0/pmid": "4444",
        "/result/items/0/cited_by": 0
      }
    },
    {
      "run": [
        "article",
        "references",
        "1111",
        "--pool",
        "missing"
      ],
      "expect": {
        "/error/code": "pool.expired"
      },
      "exit": 3
    }
  ]
}

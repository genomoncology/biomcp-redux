{
  "feature": "article-semantic-sections",
  "story": "iCite keeps its PMID contract and graph selectors reject invalid source and page bounds before a request.",
  "steps": [
    {
      "run": [
        "article",
        "references",
        "PMC7573235"
      ],
      "expect": {
        "/error/code": "usage.arguments"
      },
      "exit": 2,
      "is_error": true
    },
    {
      "run": [
        "article",
        "citations",
        "10.1038/nature05933"
      ],
      "expect": {
        "/error/code": "usage.arguments"
      },
      "exit": 2,
      "is_error": true
    },
    {
      "run": [
        "article",
        "citations",
        "33123537",
        "--source",
        "bad"
      ],
      "expect": {
        "/error/code": "usage.arguments"
      },
      "exit": 2,
      "is_error": true
    },
    {
      "run": [
        "article",
        "references",
        "33123537",
        "--source",
        "semantic-scholar",
        "--limit",
        "0"
      ],
      "expect": {
        "/error/code": "usage.arguments"
      },
      "exit": 2,
      "is_error": true
    },
    {
      "run": [
        "article",
        "references",
        "33123537",
        "--source",
        "semantic-scholar",
        "--limit",
        "51"
      ],
      "expect": {
        "/error/code": "usage.arguments"
      },
      "exit": 2,
      "is_error": true
    },
    {
      "run": [
        "article",
        "references",
        "PPR1295425",
        "--source",
        "semantic-scholar"
      ],
      "expect": {
        "/error/code": "usage.arguments"
      },
      "exit": 2,
      "is_error": true
    }
  ]
}

{
  "feature": "article-search",
  "story": "PubMed journal fields keep the matched journal search order.",
  "replay": "article/filters/journal",
  "steps": [
    {
      "run": [
        "search",
        "article",
        "AKT1 E17K",
        "--journal",
        "Nature"
      ],
      "max_bytes": 1217,
      "max_tokens": 305,
      "expect": {
        "/status": "complete",
        "/sources/0/term": "AKT1 E17K AND Nature[ta]",
        "/result/items/*/pmid": {
          "equals": [
            "39506119",
            "17611497"
          ]
        }
      }
    }
  ]
}

{
  "feature": "article-search",
  "story": "Native guideline tags return the ESMO practice guideline.",
  "replay": "article/filters/guideline",
  "steps": [
    {
      "run": [
        "search",
        "article",
        "next-generation sequencing advanced cancer ESMO",
        "--type",
        "guideline"
      ],
      "max_bytes": 1203,
      "max_tokens": 302,
      "expect": {
        "/status": "complete",
        "/sources/0/term": "next-generation sequencing advanced cancer ESMO AND (guideline[pt] OR \"practice guideline\"[pt])",
        "/result/items/0/pmid": "38834388",
        "/result/items/*/header/types": {
          "equals": [
            [
              "practice_guideline"
            ]
          ]
        }
      }
    }
  ]
}

{
  "live_check": "local usage case",
  "feature": "article-filters",
  "story": "Unsupported access filters fail before resolving genes or sources",
  "steps": [
    {
      "run": [
        "search",
        "article",
        "--variant",
        "rs121913529",
        "--source",
        "litvar",
        "--open-access"
      ],
      "exit": 2,
      "is_error": true,
      "max_bytes": 400,
      "expect": {
        "/error/code": "usage.unsupported_filter",
        "/error/source": "litvar",
        "/error/option": "--open-access"
      }
    },
    {
      "run": [
        "search",
        "article",
        "--variant",
        "rs121913529",
        "--source",
        "litvar",
        "--no-preprints"

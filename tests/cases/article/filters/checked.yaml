live_check: local-only or offline-only case
feature: article-filters
story: Article filters preserve checked date precision and reject reversed ranges before requests.
replay: article/search/live
steps:
  - run: [search, article, --since, '2024-02', --until, '2024', --author, Carpten, --journal, Nature, --type, trial, --sort, date, --pool, unknown]
    exit: 3
    expect:
      /error/code: pool.expired
      /next/0/args:
        includes_all_of: ['--since', '2024-02', '--until', '2024', '--author', Carpten, '--journal', Nature, '--type', trial, '--sort', date]
  - run: [search, article, --since, '2025', --until, '2024-12-31']
    exit: 2
    expect:
      /error/code: usage.arguments
  - run: [search, article, --since, '2024-02-30']
    exit: 2
    expect:
      /error/code: usage.arguments

{
  "feature": "article-preprints",
  "live_check": "synthetic response case",
  "story": "Disabling Europe PMC prevents preprint card and reader requests before replay or cache",
  "replay": "article/preprint/live",
  "config": {
    "disable_sources": [
      "europepmc"
    ]
  },
  "steps": [
    {
      "run": [
        "get",
        "article",
        "PPR1295425",
        "all"
      ],
      "exit": 4,
      "expect": {
        "/status": "failed",
        "/sources/0/state": "skipped",
        "/sources/0/reason": "disabled"
      }
    },
    {
      "run": [
        "article",
        "text",
        "PPR1295425",
        "--part",
        "1"
      ],
      "exit": 4,
      "is_error": true,
      "expect": {
        "/status": "failed",
        "/sources/0/state": "skipped",
        "/sources/0/reason": "disabled",
        "/result/content/state": "skipped",
        "/result/content/source": "europepmc",
        "/result/content/reason": "disabled"
      }
    }
  ]
}

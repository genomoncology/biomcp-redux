{
  "feature": "article-preprints",
  "live_check": "synthetic response case",
  "story": "Malformed source attributes are rejected before caching",
  "replay": "article/preprint/synthetic-attribute",
  "steps": [
    {
      "run": [
        "get",
        "article",
        "PPR1064174"
      ],
      "expect": {
        "/status": "failed",
        "/result/items/0/status": "failed",
        "/sources/0/reason": "bad-reply",
        "/next/*/kind": {
          "includes": "fresh"
        }
      },
      "exit": 4
    },
    {
      "run": [
        "get",
        "article",
        "PPR1064174"
      ],
      "offline": true,
      "expect": {
        "/status": "failed",
        "/sources/0/reason": "offline",
        "/next/*/kind": {
          "includes": "fresh"
        }
      },
      "exit": 4
    }
  ]
}

{
  "feature": "article-preprints",
  "live_check": "public",
  "story": "Europe PMC 500 preserves the preprint card and offers a fresh fulltext step",
  "replay": "article/preprint/live",
  "steps": [
    {
      "run": [
        "get",
        "article",
        "PPR1064174",
        "fulltext"
      ],
      "expect": {
        "/status": "partial",
        "/result/items/0/sections/fulltext/state": "unavailable",
        "/result/items/0/sections/fulltext/reason": "unavailable",
        "/next/*/kind": {
          "includes": "fresh"
        }
      },
      "max_bytes": 4100
    },
    {
      "run": [
        "article",
        "text",
        "PPR1064174",
        "--part",
        "1"
      ],
      "exit": 4,
      "expect": {
        "/status": "failed",
        "/result/content/state": "unavailable",
        "/result/content/source": "europepmc",
        "/result/content/reason": "unavailable",
        "/next/0/args": [
          "article",
          "text",
          "PPR1064174",
          "--part",
          "1",
          "--fresh"
        ]
      },
      "is_error": true
    }
  ],
  "verified": "2026-10-24 actual command captured three source HTTP500 responses; these do not prove that the article is not open."
}

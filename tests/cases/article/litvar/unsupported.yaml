{
  "live_check": "local usage case",
  "feature": "article-litvar",
  "story": "LitVar rejects unsupported filters before any source request",
  "steps": [
    {
      "run": [
        "search",
        "article",
        "words",
        "--gene",
        "KRAS",
        "--variant",
        "G12C",
        "--source",
        "litvar"
      ],
      "exit": 2,
      "max_bytes": 400,
      "expect": {
        "/error/code": "usage.unsupported_filter",
        "/error/source": "litvar",
        "/error/option": "TEXT"
      },
      "is_error": true
    },
    {
      "run": [
        "search",
        "article",
        "--gene",
        "KRAS",
        "--variant",
        "G12C",
        "--source",
        "litvar",
        "--disease",
        "cancer"
      ],
      "exit": 2,
      "max_bytes": 400,
      "expect": {
        "/error/code": "usage.unsupported_filter",
        "/error/source": "litvar",
        "/error/option": "--disease"
      },
      "is_error": true
    },
    {
      "run": [
        "search",

live_check: synthetic response case
feature: article-search
story: A checked missing header stays warm and a fresh retry fills only its hole
replay: article/search/synthetic-retry
steps:
  - run: [search, article, AKT1 E17K, --limit, "2"]
    expect:
      /status: partial
      /result/items/*/pmid: ["33377972", "33123537"]
      /result/items/0: {equals: {key: {namespace: pubmed, id: "33377972"}, pmid: "33377972"}}
      /result/items/1/header/pmid: "33123537"
  - run: [search, article, AKT1 E17K, --limit, "2"]
    offline: true
    expect:
      /status: partial
      /result/items/0: {equals: {key: {namespace: pubmed, id: "33377972"}, pmid: "33377972"}}
      /result/items/1/header/pmid: "33123537"
  - follow: fresh
    expect:
      /status: complete
      /result/items/*/header/pmid: ["33377972", "33123537"]
  - run: [search, article, AKT1 E17K, --limit, "2"]
    offline: true
    expect:
      /status: complete
      /result/items/*/header/pmid: ["33377972", "33123537"]

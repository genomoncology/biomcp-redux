{
  "feature": "article-search",
  "story": "Synthetic Europe PMC 500 retains every public PubMed floor identity",
  "replay": "article/fold/synthetic-epmc-500",
  "steps": [
    {
      "run": [
        "search",
        "article",
        "AKT1 E17K",
        "--source",
        "pubmed,europepmc"
      ],
      "walk": {
        "items": "/result/items",
        "max_pages": 32
      },
      "max_bytes": 5228,
      "max_tokens": 1307,
      "expect": {
        "/status": "partial",
        "/sources/1/source": "europepmc",
        "/sources/1/state": "failed",
        "/sources/1/reason": "unavailable",
        "/result/items/*/pmid": {
          "equals_file": "akt1-floor.json",
          "unique": true
        },
        "/next/*/kind": {
          "includes": "fresh"
        }
      }
    },
    {
      "run": [
        "search",
        "article",
        "AKT1 E17K",
        "--source",
        "pubmed,europepmc"
      ],
      "offline": true,
      "max_bytes": 5228,
      "expect": {
        "/status": "partial",
        "/page/total": 192
      }
    }
  ]
}

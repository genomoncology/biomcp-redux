{
  "feature": "article-search",
  "story": "Synthetic Europe PMC cut preserves the answering source and offline paging",
  "replay": "article/fold/synthetic-epmc-cut",
  "steps": [
    {
      "run": [
        "search",
        "article",
        "AKT1 E17K",
        "--source",
        "pubmed,europepmc"
      ],
      "walk": {
        "items": "/result/items",
        "max_pages": 32
      },
      "max_bytes": 5228,
      "max_tokens": 1307,
      "expect": {
        "/status": "partial",
        "/sources/1/source": "europepmc",
        "/sources/1/state": "failed",
        "/sources/1/reason": "bad_reply",
        "/result/items/*/pmid": {
          "equals": [
            "1111",
            "2222",
            "3333"
          ],
          "unique": true
        },
        "/next/*/kind": {
          "includes": "fresh"
        }
      }
    },
    {
      "run": [
        "search",
        "article",
        "AKT1 E17K",
        "--source",
        "pubmed,europepmc"
      ],
      "offline": true,
      "max_bytes": 5228,
      "expect": {
        "/status": "partial",
        "/page/total": 3
      }
    }
  ]
}

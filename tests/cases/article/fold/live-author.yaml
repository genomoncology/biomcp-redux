{
  "live_check": "public",
  "feature": "article-fold",
  "story": "A real author filter returns the actual Europe PMC depth below its requested window",
  "replay": "article/fold/live",
  "verified": "The maximum page is 4816 bytes; ceil(actual * 1.15) is 5539 bytes. No exact 0.9 JSON baseline is recorded for this author and source combination.",
  "steps": [
    {
      "run": [
        "search",
        "article",
        "--author",
        "Carpten",
        "--source",
        "pubmed,europepmc",
        "AKT1"
      ],
      "max_bytes": 5539,
      "expect": {
        "/status": "complete",
        "/page/total": 12,
        "/page/truncated": false,
        "/sources/0/term": "AKT1 AND Carpten[au]",
        "/sources/1/term": "AKT1 AND AUTH:Carpten",
        "/sources/1/count": 12,
        "/sources/1/fetched": 12
      }
    },
    {
      "run": [
        "search",
        "article",
        "--author",
        "Carpten",
        "--source",
        "pubmed,europepmc",
        "AKT1"
      ],
      "walk": {
        "items": "/result/items",
        "max_pages": 4
      },
      "max_bytes": 5539,
      "expect": {
        "/result/items/*/key": {
          "equals_file": "live-author-keys.json",
          "unique": true
        },
        "/result/items/*/found_by": {
          "equals_file": "live-author-found-by.json"
        }
      }
    }
  ]
}

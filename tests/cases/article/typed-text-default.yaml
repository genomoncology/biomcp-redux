{
  "feature": "article-get",
  "live_check": "Synthetic article body and abstract replays with local argument validation.",
  "story": "A bare PMID opens the first available body part or returns the abstract and not-open state. Invalid explicit parts keep numeric guidance.",
  "replay": "article/fulltext/part-range",
  "config": {
    "mcp_tool_mode": "typed",
    "mcp_typed_output_schema": true
  },
  "steps": [
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "text",
          "text": {
            "input": "28944238"
          }
        }
      },
      "expect": {
        "/status": "complete",
        "/result/pmcid": "PMC5606870",
        "/result/content/data/part": 1,
        "/result/content/data/markdown": "## First section\n\nFirst body paragraph."
      }
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "text",
          "text": {
            "input": "39214094"
          }
        }
      },
      "expect": {
        "/status": "complete",
        "/result/items/0/answer/card/title": "Synthetic readable record.",
        "/result/items/0/answer/card/abstract_parts": {
          "count": 1
        },
        "/result/items/0/sections/fulltext/reason": "not-open"
      }
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "text",
          "text": {
            "input": "33123537",
            "part": "abstract"
          }
        }
      },
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--part",
        "/error/valid_values": [
          "integer >= 1"
        ]
      }
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "text",
          "text": {
            "input": "33123537",
            "part": 1.5
          }
        }
      },
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--part",
        "/error/valid_values": [
          "integer >= 1"
        ]
      }
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "text",
          "text": {
            "input": "33123537",
            "part": -1
          }
        }
      },
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--part",
        "/error/valid_values": [
          "integer >= 1"
        ]
      }
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "text",
          "text": {
            "input": "33123537",
            "part": 0
          }
        }
      },
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--part",
        "/error/valid_values": [
          "integer >= 1"
        ]
      }
    },
    {
      "mcp_call": {
        "name": "article",
        "arguments": {
          "action": "get",
          "get": {
            "input": [
              "28944238"
            ]
          }
        }
      },
      "expect": {
        "/status": "complete",
        "/result/items/0/answer/card/abstract_parts": {
          "count": 1
        }
      }
    }
  ]
}

{
  "feature": "article-named-search",
  "live_check": "local usage case",
  "story": "Named sentence and entity search refuse unsupported filters before any source request",
  "steps": [
    {
      "run": [
        "search",
        "article",
        "AKT1",
        "--source",
        "litsense",
        "--author",
        "Carpten"
      ],
      "exit": 2,
      "is_error": true,
      "max_bytes": 400,
      "expect": {
        "/error/code": "usage.unsupported_filter",
        "/error/source": "litsense",
        "/error/option": "--author"
      }
    },
    {
      "run": [
        "search",
        "article",
        "AKT1",
        "--source",
        "litsense",
        "--journal",
        "Nature"
      ],
      "exit": 2,
      "is_error": true,
      "max_bytes": 400,
      "expect": {
        "/error/code": "usage.unsupported_filter",
        "/error/source": "litsense",
        "/error/option": "--journal"
      }
    },
    {
      "run": [
        "search",
        "article",
        "AKT1",
        "--source",
        "litsense",
        "--since",
        "2020"
      ],
      "exit": 2,
      "is_error": true,
      "max_bytes": 400,
      "expect": {
        "/error/code": "usage.unsupported_filter",
        "/error/source": "litsense",
        "/error/option": "--since"
      }
    },
    {
      "run": [
        "search",
        "article",
        "AKT1",
        "--source",
        "litsense",
        "--until",
        "2024"
      ],
      "exit": 2,
      "is_error": true,
      "max_bytes": 400,
      "expect": {
        "/error/code": "usage.unsupported_filter",
        "/error/source": "litsense",
        "/error/option": "--until"
      }
    },
    {
      "run": [
        "search",
        "article",
        "AKT1",
        "--source",
        "litsense",
        "--type",
        "review"
      ],
      "exit": 2,
      "is_error": true,
      "max_bytes": 400,
      "expect": {
        "/error/code": "usage.unsupported_filter",
        "/error/source": "litsense",
        "/error/option": "--type"
      }
    },
    {
      "run": [
        "search",
        "article",
        "AKT1",
        "--source",

{
  "live_check": "synthetic",
  "feature": "article-pdf",
  "story": "Preserve the article card when the publisher download fails.",
  "replay": "article/pdf/timeout",
  "steps": [
    {
      "run": [
        "get",
        "article",
        "41351423",
        "pdf"
      ],
      "expect": {

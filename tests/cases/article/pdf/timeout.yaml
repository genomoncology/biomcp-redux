    {
      "run": [
        "get",
        "article",
        "41351423",
        "pdf"
      ],
      "offline": true,
      "expect": {
        "/result/items/0/answer/resolution": "resolved",
        "/result/items/0/sections/pdf/reason": "offline"
      }
    }
  ]
}

{
  "feature": "trial-nci",
  "live_check": "synthetic",
  "story": "Exact NCI organization matching preserves source order, duplicate count and source status.",
  "replay": "trial/nci/facility/synthetic-matches",
  "config": {
    "keys": {
      "nci_api_key": "synthetic-nci-replay"
    }
  },
  "steps": [
    {
      "run": [
        "search",
        "trial",
        "--source",
        "nci",
        "--facility",
        "Dana-Farber Cancer Institute",
        "--limit",
        "1"
      ],
      "mcp": [
        "search",
        "trial",
        "--source",
        "nci",
        "--facility",
        "Dana-Farber Cancer Institute",
        "--limit",
        "1"
      ],
      "expect": {
        "/page/total": 3,
        "/result/items/0/nct_id": "NCT02296125",
        "/result/items/0/matching_sites": 2,
        "/result/items/0/matched_site/org_name": "dana-farber cancer institute",
        "/result/items/0/matched_site/org_city": "Boston",
        "/result/items/0/matched_site/org_state_or_province": "MA",
        "/result/items/0/matched_site/recruitment_status": "CLOSED TO ACCRUAL"
      },
      "max_bytes": 2600
    },
    {
      "run": [
        "search",
        "trial",
        "--source",
        "nci",
        "--facility",
        "Dana-Farber Cancer Institute",
        "--lat",
        "42.3",
        "--lon",
        "-71.1",
        "--distance",
        "10mi"
      ],
      "mcp": [
        "search",
        "trial",
        "--source",
        "nci",
        "--facility",
        "Dana-Farber Cancer Institute",
        "--lat",
        "42.3",
        "--lon",
        "-71.1",
        "--distance",
        "10mi"
      ],
      "exit": 2,
      "is_error": true,
      "offline": true,
      "expect": {
        "/error/message": "the registry cannot bind --facility and radius to one site; choose one filter"
      }
    }
  ]
}

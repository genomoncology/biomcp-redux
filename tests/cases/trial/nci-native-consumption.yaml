{
  "feature": "trial-nci",
  "live_check": "synthetic native pagination and refusal controls; no live call",
  "story": "NCI pages advance past every received trial, including refused records, so no trial repeats and a page of refused trials still reaches the rest; admitted counts and source positions stay distinct.",
  "replay": "trial/nci/native-consumption",
  "config": {
    "keys": {
      "nci_api_key": "synthetic-nci-replay"
    }
  },
  "steps": [
    {
      "run": [
        "search",
        "trial",
        "--source",
        "nci",
        "--condition-id",
        "NCIT:C3224",
        "--limit",
        "2"
      ],
      "expect": {
        "/status": "partial",
        "/result/items/*/nct_id": [
          "NCT09100002"
        ],
        "/problems/*/field": [
          "identity"
        ],
        "/sources/0/retrieved_count": 1,
        "/page/offset": 0,
        "/page/returned": 1,
        "/page/total": 8
      }
    },
    {
      "follow": "page",
      "expect": {
        "/status": "complete",
        "/result/items/*/nct_id": [
          "NCT09100003",
          "NCT09100004"
        ],
        "/page/offset": 2,
        "/page/returned": 2,
        "/page/total": 8
      }
    },
    {
      "follow": "page",
      "expect": {
        "/status": "partial",
        "/result/items": [],
        "/page/offset": 4,
        "/page/returned": 0,
        "/page/total": 8
      }
    },
    {
      "follow": "page",
      "expect": {
        "/status": "complete",
        "/result/items/*/nct_id": [
          "NCT09100007",
          "NCT09100008"
        ],
        "/page/offset": 6,
        "/page/returned": 2,
        "/page/total": 8,
        "": {
          "omits": [
            "next"
          ]
        }
      }
    }
  ]
}

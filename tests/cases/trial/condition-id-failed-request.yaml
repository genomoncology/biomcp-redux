{
  "feature": "trial-search",
  "live_check": "synthetic failure only",
  "story": "A rejected NCI request retains the exact attempted condition filter and excludes credentials.",
  "replay": "trial/condition-id-failed",
  "config": {
    "keys": {
      "nci_api_key": "synthetic-condition-failure-key"
    }
  },
  "steps": [
    {
      "run": [
        "search",
        "trial",
        "--source",
        "nci",
        "--condition-id",
        "NCIT:C3224",
        "--limit",
        "1"
      ],
      "mcp": [
        "search",
        "trial",
        "--source",
        "nci",
        "--condition-id",
        "NCIT:C3224",
        "--limit",
        "1"
      ],
      "exit": 4,
      "is_error": true,
      "expect": {
        "/status": "failed",
        "/sources/0/source": "nci",
        "/sources/0/reason": "rejected",
        "/result/condition_resolution/selected_ncit": "NCIT:C3224"
      },
      "max_bytes": 893
    }
  ]
}

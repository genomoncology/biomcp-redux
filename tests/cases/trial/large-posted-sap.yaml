{
  "feature": "trial-publications",
  "story": "A caller can find phrases and read parts of a large posted plan, continue into later pages, and save the original PDF when a page exceeds the reader's safety limit.",
  "replay": "trial/large-posted-sap",
  "config": {
    "mcp_tool_mode": "typed",
    "mcp_typed_output_schema": true
  },
  "steps": [
    {
      "run": ["trial", "document", "NCT05104866", "SAP_001.pdf", "--find", "race"],
      "expect": {
        "/result/content/data/text/pages": 335,
        "/result/content/data/hits/0/page": 36,
        "/result/content/data/hits/0/text": "Baseline race was tabulated.",
        "/sources/0/notices/0/message": "This call covers PDF pages 1–100 of 335.",
        "/next/0/kind": "page"
      }
    },
    {
      "follow": "page",
      "expect": {
        "/query/page_start": 101,
        "/result/content/data/hits/0/page": 146,
        "/result/content/data/hits/0/text": "Race subgroup results were reported."
      }
    },
    {
      "follow": "page",
      "expect": {
        "/query/page_start": 201,
        "/result/content/data": {"omits": ["hits"]},
        "/result/content/data/text/state": "no-text",
        "/next/0/kind": "page"
      }
    },
    {
      "mcp_call": {
        "name": "trial",
        "arguments": {
          "action": "document",
          "document": {"id": "NCT05104866", "file": "SAP_001.pdf", "find": "race"}
        }
      },
      "expect": {
        "/result/content/data/hits/0/page": 36,
        "/result/content/data/hits/0/text": "Baseline race was tabulated."
      }
    },
    {
      "follow": "page",
      "expect": {
        "/query/page_start": 101,
        "/result/content/data/hits/0/page": 146
      }
    },
    {
      "run": ["trial", "document", "NCT05104866", "SAP_001.pdf", "--section-offset", "0"],
      "expect": {
        "/result/content/data/text/pages": 335,
        "/result/content/data/text/state": "text",
        "/result/content/data/text/text": "Statistical analysis plan\nBaseline race was tabulated.\n",
        "/page/returned": 1,
        "/next/0/kind": "page"
      }
    },
    {
      "run": ["trial", "document", "NCT05104866", "SAP_001.pdf", "--page-start", "301"],
      "expect": {
        "/status": "partial",
        "/result/content/data/text/pages": 335,
        "/result/content/data/text/state": "too-large",
        "/sources/0/notices/0/message": "The selected pages exceed the expanded-content limit.",
        "/next/0/kind": "configure",
        "/next/0/args": ["trial", "document", "NCT05104866", "SAP_001.pdf", "--save", "SAP_001.pdf"]
      }
    },
    {
      "follow": "configure",
      "expect": {
        "/status": "complete",
        "/result/file/data/sha256": "cfc3f5dadc3c66c73d458e58e4271336a87131643c8738eff3f0ffb44af7bef1"
      }
    },
    {
      "run": ["trial", "document", "NCT05104866", "SAP_001.pdf", "--page-start", "147", "--find", "events"],
      "expect": {
        "/status": "complete",
        "/result/content/data/hits/0/page": 147,
        "/result/content/data/hits/0/text": "No events were observed."
      }
    },
    {
      "run": ["trial", "document", "NCT05104866", "SAP_001.pdf", "--page-start", "147", "--section-offset", "0"],
      "expect": {
        "/result/content/data/text/text": "No events were observed.\n"
      }
    },
    {
      "mcp": ["trial", "document", "NCT05104866", "SAP_001.pdf", "--page-start", "301"],
      "http": true,
      "expect": {
        "/status": "partial",
        "/result/content/data/text/pages": 335,
        "/sources/0/notices/1/message": "Save the original PDF in the CLI with `biomcp trial document --save=SAP_001.pdf -- NCT05104866 SAP_001.pdf`."
      }
    }
  ]
}

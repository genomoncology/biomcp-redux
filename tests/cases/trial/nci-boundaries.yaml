{
  "feature": "trial-nci",
  "live_check": "synthetic",
  "story": "NCI requires explicit disease identity and a user key without registry fallback.",
  "steps": [
    {
      "run": [
        "search",
        "trial",
        "--source",
        "nci",
        "--condition",
        "C3224"
      ],
      "exit": 4,
      "is_error": true,
      "offline": false,
      "expect": {
        "/sources/0/source": "nci",
        "/sources/0/state": "skipped",
        "/sources/0/reason": "no-key",
        "/next/0/args": [
          "help",
          "key",
          "nci"
        ]
      }
    },
    {
      "run": [
        "search",
        "trial",
        "--source",
        "nci",
        "--condition",
        "melanoma"
      ],
      "exit": 2,
      "offline": true,
      "expect": {
        "/error/message": "NCI disease filters require an NCIt identifier such as C3224; use --keyword for free text"
      }
    },
    {
      "run": [
        "search",
        "trial",
        "--source",
        "nci",
        "--status",
        "RECRUITING"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments"
      },
      "offline": true
    },
    {
      "run": [
        "search",
        "trial",
        "--source",
        "nci",
        "--gene",
        "BRAF"
      ],
      "exit": 2,
      "is_error": true,
      "offline": true,
      "expect": {
        "/error/code": "usage.unsupported_filter",
        "/error/source": "nci",
        "/error/option": "--gene"
      }
    },
    {
      "run": [
        "search",
        "trial",
        "--source",
        "nci",
        "--keyword",
        "melanoma",
        "--keyword",
        "lung cancer"
      ],
      "exit": 2,
      "is_error": true,
      "offline": true,
      "expect": {
        "/error/code": "usage.unsupported_filter",
        "/error/source": "nci",
        "/error/option": "--keyword"
      }
    },
    {
      "run": [
        "search",
        "trial",
        "--source",
        "nci",
        "--phase",
        "2"
      ],
      "exit": 2,
      "is_error": true,
      "offline": false,
      "expect": {
        "/error/code": "usage.arguments"
      }
    },
    {
      "run": [
        "search",
        "trial",
        "--source",
        "nci",
        "--phase",
        "V"
      ],
      "exit": 2,
      "is_error": true,
      "offline": false,
      "expect": {
        "/error/code": "usage.arguments"
      }
    },
    {
      "run": [
        "search",
        "trial",
        "--source",
        "nci",
        "--status",
        "open"
      ],
      "exit": 2,
      "is_error": true,
      "offline": false,
      "expect": {
        "/error/code": "usage.arguments"
      }
    },
    {
      "run": [
        "search",
        "trial",
        "--source",
        "ctgov",
        "--phase",
        "II"
      ],
      "exit": 2,
      "is_error": true,
      "offline": false,
      "expect": {
        "/error/code": "usage.arguments"
      }
    },
    {
      "run": [
        "search",
        "trial",
        "--source",
        "ctgov",
        "--status",
        "Active"
      ],
      "exit": 2,
      "is_error": true,
      "offline": false,
      "expect": {
        "/error/code": "usage.arguments"
      }
    }
  ]
}

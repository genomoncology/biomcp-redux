{
  "feature": "trial-search",
  "live_check": "synthetic",
  "story": "Exact condition identity validates conflicting selectors and skips a keyless NCI request before any resolver or trial access.",
  "steps": [
    {
      "run": [
        "search",
        "trial",
        "--condition-id",
        "MONDO:0005105",
        "--source",
        "nci"
      ],
      "mcp": [
        "search",
        "trial",
        "--condition-id",
        "MONDO:0005105",
        "--source",
        "nci"
      ],
      "exit": 4,
      "offline": false,
      "expect": {
        "/sources/0/source": "nci",
        "/sources/0/reason": "no-key"
      },
      "max_bytes": 900,
      "is_error": true
    },
    {
      "run": [
        "search",
        "trial",
        "--condition-id",
        "MONDO:0005105",
        "--condition",
        "literal"
      ],
      "mcp": [
        "search",
        "trial",
        "--condition-id",
        "MONDO:0005105",
        "--condition",
        "literal"
      ],
      "exit": 2,
      "is_error": true,
      "offline": true,
      "expect": {
        "/status": "usage"
      },
      "max_bytes": 350
    },
    {
      "run": [
        "search",
        "trial",
        "--condition-id",
        "MONDO:0005105",
        "--source",
        "nci",
        "--keyword",
        "literal"
      ],
      "mcp": [
        "search",
        "trial",
        "--condition-id",
        "MONDO:0005105",
        "--source",
        "nci",
        "--keyword",
        "literal"
      ],
      "exit": 2,
      "is_error": true,
      "offline": true,
      "expect": {
        "/status": "usage"
      },
      "max_bytes": 350
    }
  ]
}

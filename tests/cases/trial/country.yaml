{
  "feature": "trial-search",
  "live_check": "bounded public ClinicalTrials.gov country capture; retained bodies for request-mapping stubs",
  "story": "Country filters reach the source and echo exact labels; one recorded US trial lists a US site. OR, NCI mapping and refusal boundaries share this case.",
  "steps": [
    {
      "run": [
        "search",
        "trial",
        "--country",
        "Atlantis"
      ],
      "mcp": [
        "search",
        "trial",
        "--country",
        "Atlantis"
      ],
      "exit": 2,
      "offline": true,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--country"
      },
      "max_bytes": 5000
    },
    {
      "run": [
        "search",
        "trial",
        "--id",
        "NCT03734029",
        "--limit",
        "1",
        "--country",
        "United States"
      ],
      "mcp": [
        "search",
        "trial",
        "--id",
        "NCT03734029",
        "--limit",
        "1",
        "--country",
        "United States"
      ],
      "expect": {
        "/status": "complete",
        "/page/total": 1,
        "/query/country": [
          "United States"
        ],
        "/result/items/*/nct_id": {
          "equals": [
            "NCT03734029"
          ]
        }
      },
      "max_bytes": 5000
    },
    {
      "run": [
        "get",
        "trial",
        "NCT03734029",
        "locations",
        "--limit",
        "1"
      ],
      "mcp": [
        "get",
        "trial",
        "NCT03734029",
        "locations",
        "--limit",
        "1"
      ],
      "expect": {
        "/status": "complete",
        "/result/items/0/input": "NCT03734029",
        "/result/items/0/sections/locations/data/items/0/country": "United States"
      },
      "max_bytes": 5000
    },
    {
      "run": [
        "search",
        "trial",
        "--id",
        "NCT03734029",
        "--limit",
        "1",
        "--country",
        "United States",
        "--country",
        "Canada"
      ],
      "mcp": [
        "search",
        "trial",
        "--id",
        "NCT03734029",
        "--limit",
        "1",
        "--country",
        "United States",
        "--country",
        "Canada"
      ],
      "expect": {
        "/status": "complete",
        "/query/country": [
          "United States",
          "Canada"
        ],
        "/result/items/*/nct_id": {
          "equals": [
            "NCT03734029"
          ]
        }
      },
      "max_bytes": 5000
    },
    {
      "run": [
        "search",
        "trial",
        "--source",
        "nci",
        "--country",
        "United States",
        "--country",
        "Canada",
        "--limit",
        "1"
      ],
      "mcp": [
        "search",
        "trial",
        "--source",
        "nci",
        "--country",
        "United States",
        "--country",
        "Canada",
        "--limit",
        "1"
      ],
      "expect": {
        "/status": "complete",
        "/query/country": [
          "United States",
          "Canada"
        ],
        "/result/request/2/name": "sites.org_country",
        "/result/request/2/value": "United States",
        "/result/request/3/name": "sites.org_country",
        "/result/request/3/value": "Canada"
      },
      "max_bytes": 5000
    },
    {
      "run": [
        "search",
        "trial",
        "--id",
        "NCT03734029",
        "--limit",
        "1",
        "--country",
        "Afghanistan"
      ],
      "mcp": [
        "search",
        "trial",
        "--id",
        "NCT03734029",
        "--limit",
        "1",
        "--country",
        "Afghanistan"
      ],
      "expect": {
        "/status": "failed",
        "/sources/0/reason": "bad-reply"
      },
      "exit": 4,
      "max_bytes": 5000
    },
    {
      "run": [
        "search",
        "trial",
        "--country",
        "Bonaire, Saint Eustatius and Saba "
      ],
      "mcp": [
        "search",
        "trial",
        "--country",
        "Bonaire, Saint Eustatius and Saba "
      ],
      "offline": true,
      "exit": 1,
      "expect": {
        "/status": "unavailable",
        "/query/country": [
          "Bonaire, Saint Eustatius and Saba "
        ],
        "/sources/0/reason": "offline"
      },
      "max_bytes": 5000
    },
    {
      "run": [
        "search",
        "trial",
        "--country",
        "Bonaire, Saint Eustatius and Saba"
      ],
      "mcp": [
        "search",
        "trial",
        "--country",
        "Bonaire, Saint Eustatius and Saba"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--country"
      },
      "max_bytes": 5000
    }
  ],
  "replay": "trial/country",
  "config": {
    "keys": {
      "nci_api_key": "synthetic-nci-replay"
    }
  }
}

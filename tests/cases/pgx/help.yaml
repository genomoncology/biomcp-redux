{
  "feature": "cpic-pgx",
  "story": "Generated PGx help exposes typed selectors and independent section arguments.",
  "steps": [
    {
      "run": [
        "help",
        "search",
        "pgx"
      ],
      "mcp": [
        "help",
        "search",
        "pgx"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/command": [
          "search",
          "pgx"
        ]
      },
      "max_bytes": 1033,
      "max_tokens": 258
    },
    {
      "run": [
        "help",
        "get",
        "pgx"
      ],
      "mcp": [
        "help",
        "get",
        "pgx"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/command": [
          "get",
          "pgx"
        ]
      },
      "max_bytes": 2029,
      "max_tokens": 507
    }
  ]
}

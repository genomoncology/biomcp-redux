{
  "feature": "cpic-pgx",
  "story": "CPIC is disabled before each typed command reaches cached or recorded replies.",
  "live_check": "synthetic source policy",
  "steps": [
    {
      "run": [
        "search",
        "pgx",
        "--gene",
        "DPYD",
        "--source",
        "cpic",
        "--disable-sources",
        "cpic"

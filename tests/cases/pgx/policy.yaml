{
  "feature": "cpic-pgx",
  "story": "A caller disables CPIC before every PGx command can restore replay or contact the source.",
  "live_check": "synthetic policy",
  "steps": [
    {
      "run": [
        "search",
        "pgx",
        "--gene",
        "DPYD",
        "--source",
        "cpic",
        "--disable-sources",
        "cpic"
      ],
      "mcp": [
        "search",
        "pgx",
        "--gene",
        "DPYD",
        "--source",
        "cpic",
        "--disable-sources",
        "cpic"
      ],
      "expect": {
        "/schema": "biomcp.pgx_page/1",
        "/status": "failed",
        "/query/source": "cpic",
        "/sources/0/state": "skipped",
        "/sources/0/reason": "disabled"
      },
      "exit": 4,
      "is_error": true,
      "max_bytes": 1500,
      "max_tokens": 375
    },

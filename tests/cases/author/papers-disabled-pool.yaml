{
  "feature": "author-papers",
  "story": "Disabled Semantic Scholar refuses warm papers snapshots and explicit continuations",
  "live_check": "synthetic control",
  "replay": "author/papers",
  "steps": [
    {
      "run": [
        "author",
        "papers",
        "semantic-scholar:123"
      ],
      "mcp": [
        "author",
        "papers",
        "semantic-scholar:123"
      ],
      "expect": {
        "/status": "complete"
      },
      "max_bytes": 864,
      "max_tokens": 216,
      "full_output_bytes": true
    },
    {
      "follow": "page",
      "expect": {
        "/status": "complete"
      },
      "full_output_bytes": true,
      "max_bytes": 678,
      "max_tokens": 170
    },
    {
      "run": [
        "author",
        "papers",
        "semantic-scholar:123",
        "--disable-sources",
        "semantic-scholar"
      ],
      "mcp": [
        "author",
        "papers",
        "semantic-scholar:123",
        "--disable-sources",
        "semantic-scholar"
      ],
      "is_error": true,
      "exit": 4,
      "expect": {
        "/status": "failed",
        "/sources/0/source": "semantic-scholar",
        "/sources/0/state": "skipped",
        "/sources/0/reason": "disabled"
      },
      "full_output_bytes": true,
      "max_bytes": 700,
      "max_tokens": 175
    },
    {

{
  "feature": "author-search",
  "live_check": "synthetic control",
  "story": "Names and topics find citation authors and papers with noncommercial sources and ORCID disabled; same-named people remain unresolved independent assertions.",
  "replay": "author/literature",
  "steps": [
    {
      "run": [
        "search",
        "author",
        "Morgan Lee",
        "--disable-sources",
        "noncommercial,orcid"
      ],
      "expect": {
        "/status": "complete",
        "/sources/*/source": {
          "includes_all_of": [

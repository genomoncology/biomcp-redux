          "10002",
          "10001"
        ],
        "/result/literature/papers/0/authors": [
          "Lee M",
          "Patel R"
        ],
        "/result/literature/papers/1/authors": [
          "Lee M",
          "Garcia S"
        ],
        "/result/literature/identity_resolution": {
          "contains": "Unresolved"
        }
      },
      "max_bytes": 6000
    },
    {

{
  "feature": "author-search",
  "story": "Author help describes exact provider identity and unavailable topic rank",
  "live_check": "synthetic control",
  "steps": [
    {
      "run": [
        "help",
        "search",
        "author"
      ],
      "mcp": [
        "help",
        "search",
        "author"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "query",
            "--source",
            "--limit",
            "--offset",
            "--pool"
          ]
        }
      },
      "full_output_bytes": true,
      "max_bytes": 1261,
      "max_tokens": 316
    },
    {
      "run": [
        "help",
        "get",
        "author"
      ],
      "mcp": [
        "help",
        "get",
        "author"
      ],

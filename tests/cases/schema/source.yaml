live_check: local-only case
feature: schema
covers: [schema]
story: A caller inspects the source identifier schema
steps:
  - run: [schema, biodata.source/1]
    max_bytes: 4096
    max_tokens: 1024
    expect:
      /$id: biodata.source/1
      /type: string
      /enum/0: hgnc
      /enum:
        includes: pubmed
        rank_of: {hgnc: 1}
        # Historical enum comparison: 302 bytes / 76 estimated tokens.
        # Drug source comparison: 422 bytes / 106 estimated tokens.
        # Ten disease identities approved by the slice: 503 bytes / 126 tokens.
        # The slice policy permits this source list alone measured size plus 15%.
        max_bytes: 579
        max_tokens: 145
      /enum/*: {includes: gnomad}
  - run: [schema, biodata.problem/1]
    expect:
      /$id: biodata.problem/1
      /properties/field:
        equals: {description: The biodata field name., type: string}
      /properties/record/anyOf/*:
        includes: {type: 'null'}
        count: 2
      /properties/record/anyOf/0:
        equals: {$ref: '#/$defs/Text'}

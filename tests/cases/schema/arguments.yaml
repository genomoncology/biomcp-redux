live_check: local-only case
feature: schema-discovery
story: Invalid schema requests return the fixed usage envelope
steps:
  - run: [schema, SENSITIVE-usage-probe-37f4]
    exit: 2
    max_bytes: 160
    expect:
      '':
        equals:
          schema: biomcp.error/3
          status: usage
          error:
            code: usage.schema
            message: use biomcp schema to list known artifact IDs
  - run: [schema, biomcp.source/1, extra]
    exit: 2
    max_bytes: 160
    expect:
      '':
        equals:
          schema: biomcp.error/3
          status: usage
          error:
            code: usage.schema
            message: use biomcp schema to list known artifact IDs

{
  "feature": "schema-discovery",
  "live_check": "local-only generated help; no source requests",
  "story": "Section help lists only the options that section takes: help on the drug markets section offers the name alone, with no --source and no approvals options, and leads with an example that reads markets; help on the variant clinvar and population sections offers no CIViC options, which only the civic section (or all) takes.",
  "steps": [
    {
      "run": [
        "help",
        "get",
        "drug",
        "markets"
      ],

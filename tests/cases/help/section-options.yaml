        "/result/commands/0/sections/*/word": [
          "markets"
        ],
        "/result/commands/0/arguments/*/name": [
          "input",
          "section"
        ],
        "/result/commands/0/examples": [
          [
            "get",
            "drug",
            "dolutegravir",
            "markets"
          ]
        ],
        "/result/commands/0/description": "get drug markets. Sources: drugsfda, ema, who-pq.\nListed choices accept any letter case; replies use their listed spelling."

{
  "live_check": "synthetic control",
  "feature": "protein-search",
  "story": "A disabled protein search reports a failed source with its terms instead of an empty success",
  "steps": [
    {
      "run": [
        "--disable-sources",
        "uniprot",
        "search",
        "protein",
        "--gene",
        "BRAF"
      ],
      "exit": 4,
      "expect": {
        "/status": "failed",
        "/sources/0/source": "uniprot",
        "/sources/0/state": "skipped"
      },
      "max_bytes": 340
    }
  ]
}

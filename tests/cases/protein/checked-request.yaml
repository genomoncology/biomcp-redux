{
  "live_check": "synthetic input boundaries",
  "feature": "protein-search",
  "story": "Protein input and retained-pool boundaries fail before source requests",
  "steps": [
    {
      "run": [
        "search",
        "protein"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/4"
      },
      "max_bytes": 195
    },
    {
      "run": [
        "search",
        "protein",
        "EGFR",
        "--gene",
        "BRAF"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/4"
      },
      "max_bytes": 195
    },
    {
      "run": [
        "search",
        "protein",
        "EGFR",
        "--limit",
        "0"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/4"
      },
      "max_bytes": 166
    },
    {
      "run": [
        "search",
        "protein",
        "EGFR",
        "--limit",
        "26"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/4"
      },
      "max_bytes": 166
    },
    {
      "run": [
        "search",
        "protein",
        "EGFR",
        "--offset",
        "-1"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/4"
      },
      "max_bytes": 166
    },
    {
      "run": [
        "search",
        "protein",
        "EGFR",
        "--include-unreviewed"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/4"
      },
      "max_bytes": 203
    },
    {
      "run": [
        "get",
        "protein"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/4"
      },
      "max_bytes": 166
    },
    {
      "run": [
        "search",
        "protein",
        "EGFR",
        "--pool",
        "unknown"
      ],
      "exit": 3,
      "is_error": true,
      "expect": {
        "/error/code": "pool.expired",
        "/next/0/kind": "restart"
      },
      "max_bytes": 216
    },
    {
      "run": [
        "search",
        "protein",
        "EGFR",
        "--offset",
        "1"
      ],
      "exit": 3,
      "is_error": true,
      "expect": {
        "/error/code": "pool.expired",
        "/next/0/kind": "restart"
      },
      "max_bytes": 216
    }
  ]
}

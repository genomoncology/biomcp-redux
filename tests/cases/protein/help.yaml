{
  "feature": "protein-docs-accounting",
  "story": "Every protein command exposes its source sections, selectors, scope and two parsed case examples.",
  "steps": [
    {
      "run": [
        "help",
        "search",
        "protein"
      ],
      "mcp": [
        "help",
        "search",
        "protein"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/command": [
          "search",
          "protein"
        ],
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "query",
            "--gene",
            "--reviewed",
            "--limit",
            "--offset",
            "--pool"
          ]
        }
      },
      "max_bytes": 1463
    },
    {
      "run": [
        "help",
        "get",
        "protein"
      ],
      "mcp": [
        "help",
        "get",
        "protein"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/command": [
          "get",
          "protein"
        ],
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "input",
            "--section",
            "--section-limit"
          ]
        },
        "/result/commands/0/sections/*/word": {
          "includes_all_of": [
            "features",
            "domains",
            "isoforms",
            "complexes",
            "structures",
            "function",
            "sequence",
            "all"
          ]
        },
        "/result/commands/0/section_rule": "Select native sections or all bounded first pages; function keeps one whole text record."
      },
      "max_bytes": 2206
    },

{
  "feature": "trial-get",
  "story": "Every published ClinicalTrials.gov status, phase, study type and intervention type survives its mapper.",
  "live_check": "Offline pinned source reach check.",
  "replay": "reach/ctgov",
  "steps": [
    {
      "run": [
        "get",
        "trial",
        "NCT09999000",
        "arms",
        "--limit",
        "20"
      ],
      "expect": {
        "/status": "complete",
        "/result/items/0/card/status": "ACTIVE_NOT_RECRUITING",
        "/result/items/0/card/study_type": "EXPANDED_ACCESS",
        "/result/items/0/card/phases": [
          "NA",
          "EARLY_PHASE1",
          "PHASE1",
          "PHASE2",
          "PHASE3",
          "PHASE4"
        ],
        "/result/items/0/sections/arms/data/items/*/data/kind": [
          "BEHAVIORAL",
          "BIOLOGICAL",
          "COMBINATION_PRODUCT",
          "DEVICE",
          "DIAGNOSTIC_TEST",
          "DIETARY_SUPPLEMENT",
          "DRUG",
          "GENETIC",
          "PROCEDURE",
          "RADIATION",
          "OTHER"
        ]
      }
    },
    {
      "run": [
        "get",
        "trial",
        "NCT09999001"
      ],
      "expect": {

{
  "feature": "study-catalog",
  "story": "Study help exposes bounded metadata commands, parsed examples and calculation boundaries.",
  "steps": [
    {
      "run": [
        "help",
        "search",
        "study"
      ],
      "mcp": [
        "help",
        "search",
        "study"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/command": [
          "search",
          "study"
        ],
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/sections/*/word": [],
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "--cancer-type",
            "--limit",
            "--offset",
            "--pool"
          ]
        },
        "/result/commands/0/description": {
          "regex": "No frequency, denominator, survival or comparison is calculated. Source counts keep their native names."
        }
      }
    },
    {
      "run": [
        "help",
        "get",
        "study"
      ],
      "mcp": [
        "help",
        "get",
        "study"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/command": [
          "get",
          "study"
        ],
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/sections/*/word": [
          "profiles",
          "sample-lists",
          "files",
          "all"
        ],
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "--section-limit",
            "--section-offset"
          ]
        },
        "/result/commands/0/description": {
          "regex": "No frequency, denominator, survival or comparison is calculated. Source counts keep their native names."
        }
      }
    },
    {
      "run": [
        "help",
        "sync",
        "cbioportal-studies"
      ],
      "mcp": [
        "help",
        "sync",
        "cbioportal-studies"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/command": [
          "sync",
          "cbioportal-studies"
        ],
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/sections/*/word": []
      }
    }
  ]
}

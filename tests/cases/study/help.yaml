          "search",
          "study"
        ],
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "--cancer-type",
            "--limit",
            "--offset",
            "--pool"
          ]
        },
        "/result/commands/0/description": "Literal stored metadata search; text is never parsed as a query language. No frequency, denominator, survival or comparison is calculated. Source counts keep their native names.",

{
  "live_check": "FDA public native API replies captured 2026-11-04; reuses the diagnostic/device-approvals recording",
  "feature": "runnable-related-queries",
  "story": "A diagnostic search's first page offers its own call last, with the filters its source also takes as fill-in templates, and a filled-in template runs, over the CLI and typed MCP.",
  "replay": "diagnostic/device-approvals",
  "config": {
    "mcp_tool_mode": "typed",
    "mcp_typed_output_schema": true
  },
  "steps": [
    {
      "run": [
        "search",
        "diagnostic",
        "--source",
        "fda-pma",
        "--manufacturer",
        "Foundation Medicine"
      ],
      "expect": {
        "/page/total": 100,
        "/next/6/kind": "configure",
        "/next/6/args": [
          "search",
          "diagnostic",
          "--manufacturer",
          "Foundation Medicine",
          "--source",
          "fda-pma"
        ],
        "/next/6/options": {
          "equals": {
            "--decision-from": "<YYYY-MM-DD>",
            "--decision-to": "<YYYY-MM-DD>",
            "--intended-use": "<TEXT>",
            "--limit": "<1-50>",
            "--name": "<TEXT>",
            "--offset": "<N>",
            "--product-code": "<TEXT>"
          }
        }
      },
      "max_bytes": 16000
    },
    {
      "mcp_call": {
        "name": "diagnostic",
        "arguments": {
          "action": "search",
          "search": {
            "source": "fda-pma",
            "manufacturer": "Foundation Medicine"
          }
        }
      },
      "expect": {
        "/page/total": 100,
        "/next/6/kind": "configure",
        "/next/6/name": "diagnostic",
        "/next/6/options/decision_from": "<YYYY-MM-DD>",
        "/next/6/options/intended_use": "<TEXT>",
        "/next/6/options/product_code": "<TEXT>"
      }
    },
    {
      "run": [
        "search",
        "diagnostic",
        "--source",
        "fda-pma",
        "--manufacturer",
        "Foundation Medicine",
        "--decision-from",
        "2017-11-30",
        "--decision-to",
        "2017-11-30"
      ],
      "expect": {
        "/status": "complete"
      }
    }
  ]
}

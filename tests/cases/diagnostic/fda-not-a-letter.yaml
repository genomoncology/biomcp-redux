  "verified": "openFDA Drugs@FDA reply for NDA202155 (ELIQUIS) recorded 2026-11-12 by biomcp --record; document 68968 is the s034 Label. Before 0858 the reply was status failed with drugsfda state ok and no result, problem or next step (bench 0039 pt-committee log :82).",
  "replay": "diagnostic/fda-not-a-letter",

        }
      },
      "max_bytes": 4000
    },
    {
      "run": [
        "get",
        "drug",
        "NDA202155",
        "approvals",
        "--source",
        "drugsfda",
        "--document-id",
        "1"
      ],
      "expect": {
        "/status": "partial",
        "/result/approvals/state": "unavailable",
        "/result/approvals/reason": "not-found",
        "/sources/0/notices/*/message": {
          "includes": "This application lists no document 1. Its letter documents include 86347, 82022, 82023, 68973, 67134, 61076, 58977, 54836, 52630, 50563 (20 in all; the approvals section lists each one)."
        }
      },
      "max_bytes": 4000
    }
  ]

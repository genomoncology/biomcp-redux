  "story": "A year of one manufacturer's device recalls is scanned in one call: every row of Abbott's 2025 device recalls carries openFDA's reason_for_recall, and --firm, the drug recall search's name for the recalling firm, gives the same request and rows as --manufacturer, with or without --classification. A device name copied from a label with a symbol outside ASCII, such as Alaris® pump, searches the phrase with the symbol spaced, and the notice names the phrase searched. A name of symbols alone is refused before the request.",

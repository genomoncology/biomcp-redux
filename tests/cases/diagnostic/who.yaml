{
  "feature": "diagnostic-who",
  "story": "Synthetic WHO product rows retain their own complete cells and source order; exact cards do not infer FDA identity or clinical scope.",
  "replay": "diagnostic/who-synthetic",
  "steps": [
    {
      "run": [
        "sync",
        "who-ivd"
      ],
      "mcp": [
        "sync",
        "who-ivd"
      ],
      "max_bytes": 20000,
      "max_tokens": 5000,
      "expect": {
        "/schema": "biomcp.sync/3",
        "/result/rows": 10
      }
    },
    {
      "run": [
        "get",
        "diagnostic",
        "0466-046-00",
        "--source",
        "who-ivd"
      ],
      "mcp": [
        "get",
        "diagnostic",
        "0466-046-00",
        "--source",
        "who-ivd"
      ],
      "max_bytes": 20000,
      "max_tokens": 5000,
      "expect": {
        "/result/kind": "who_ivd_product",
        "/result/id": "0466-046-00",
        "/result/native_rows/0/product_name": "Synthetic \"quoted\" product",
        "/result/native_rows/1/product_code": "two\nlines",
        "/result/native_rows/8/product_code": "CODE-8",
        "/result/native_rows/0/prequalification_year": "2024",
        "/result/native_rows/1/regulatory_version": ""
      }
    },
    {
      "run": [
        "get",
        "diagnostic",
        "12345-12345-00",
        "--source",
        "who-ivd"
      ],
      "mcp": [
        "get",
        "diagnostic",
        "12345-12345-00",
        "--source",
        "who-ivd"
      ],
      "max_bytes": 20000,
      "max_tokens": 5000,
      "expect": {
        "/result/id": "12345-12345-00",
        "/result/native_rows/0/marker": "Other marker"
      }
    },
    {
      "run": [
        "get",
        "diagnostic",
        "9999-999-00",
        "--source",
        "who-ivd"
      ],
      "mcp": [
        "get",
        "diagnostic",
        "9999-999-00",
        "--source",
        "who-ivd"
      ],
      "max_bytes": 20000,
      "max_tokens": 5000,
      "expect": {
        "/status": "absent"
      }
    }
  ]
}

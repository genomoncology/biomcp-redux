{
  "feature": "organization-nci",
  "story": "Organization search reports a missing source key without claiming zero organizations.",
  "steps": [
    {
      "run": [
        "search",
        "organization",
        "--source",
        "nci",
        "--name",
        "Dana-Farber"
      ],
      "expect": {
        "/status": "failed",
        "/sources/0/reason": "no-key"
      },
      "exit": 4,
      "max_bytes": 2000
    }
  ]
}

live_check: "local-only command help, validation or stored-state behavior; no recorded source replies"
feature: query-validation
story: Each public command refuses an unsupported argument before it reads a source.
steps:
- run:
  - search
  - grant
  - --unrecognized-argument
  exit: 2
  expect:
    /error/code: usage.arguments
- run:
  - help
  - search
  - grant
  - --unrecognized-argument
  exit: 2
  expect:
    /error/code: usage.arguments
- run:
  - help
  - search
  - grant
  expect:
    /status: complete
    /result/commands/0/command: [search, grant]

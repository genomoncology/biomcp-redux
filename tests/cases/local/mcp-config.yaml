{
  "feature": "housekeeping",
  "story": "Client configuration retains the stdio startup arguments for each JSON configuration shape.",
  "steps": [
    {
      "run": [
        "mcp-config",
        "--absolute-path"
      ],
      "expect": {
        "/mcpServers/biomcp/args": [
          "serve"
        ]
      }
    },
    {
      "run": [
        "mcp-config",
        "--client",
        "servers"
      ],
      "expect": {
        "/servers/biomcp/args": [
          "serve"
        ]
      }
    }
  ]
}

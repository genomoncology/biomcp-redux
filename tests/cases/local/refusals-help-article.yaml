    /error/code: usage.schema
- run:
  - help
  - article
  - recommendations
  - --unrecognized-argument
  exit: 2
  expect:
    /error/code: usage.schema
- run:
  - help
  - article
  - references
  - --unrecognized-argument
  exit: 2
  expect:
    /error/code: usage.schema
- run:
  - help
  - article
  - supplement
  - --unrecognized-argument
  exit: 2
  expect:
    /error/code: usage.schema
- run:

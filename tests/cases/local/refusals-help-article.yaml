feature: query-validation
story: Each public command refuses an unsupported argument before it reads a source.
steps:
- run:
  - help
  - article
  - --unrecognized-argument
  exit: 2
  expect:
    /error/code: usage.schema
- run:
  - help
  - article
  - citation-evidence
  - --unrecognized-argument
  exit: 2
  expect:
    /error/code: usage.schema
- run:
  - help
  - article
  - citations
  - --unrecognized-argument
  exit: 2
  expect:
    /error/code: usage.schema
- run:

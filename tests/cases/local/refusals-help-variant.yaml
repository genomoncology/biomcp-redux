feature: query-validation
story: Each public command refuses an unsupported argument before it reads a source.
steps:
- run:
  - help
  - variant
  - --unrecognized-argument
  exit: 2
  expect:
    /error/code: usage.arguments
- run:
  - help
  - variant
  - assertions
  - --unrecognized-argument
  exit: 2
  expect:
    /error/code: usage.arguments
- run:
  - help
  - variant
  - normalize
  - --unrecognized-argument
  exit: 2
  expect:
    /error/code: usage.arguments
- run:
  - help
  - variant
  - population
  - --unrecognized-argument
  exit: 2
  expect:
    /error/code: usage.arguments
- run:
  - help
  - variant
  - recurrence
  - --unrecognized-argument
  exit: 2
  expect:
    /error/code: usage.arguments

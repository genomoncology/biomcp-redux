{
  "feature": "housekeeping",
  "story": "The version command and its global alias print the installed release identity exactly.",
  "steps": [
    {
      "run": [
        "version"
      ],
      "stdout": "biomcp 1.0.0\n"
    },
    {
      "run": [
        "--version"
      ],
      "stdout": "biomcp 1.0.0\n"
    },
    {
      "run": [
        "health",
        "--offline"
      ],
      "expect": {
        "/schema": "biomcp.health/6"
      }
    }
  ]
}

{
  "feature": "phenotype-identity",
  "story": "Unsupported phenotype source, namespace and section combinations fail before source access.",
  "steps": [
    {
      "run": [
        "get",
        "phenotype",
        "HP:0001250",
        "hierarchy",
        "--source",
        "hpo"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments",
        "/error/message": "expected a supported command with checked arguments"
      },
      "max_bytes": 199
    },
    {
      "run": [
        "get",
        "phenotype",
        "HP:0001250",
        "diseases",
        "--source",
        "hpo"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments",
        "/error/message": "expected a supported command with checked arguments"
      },
      "max_bytes": 199
    },
    {
      "run": [
        "get",
        "phenotype",
        "HP:0001250",
        "genes",
        "--source",
        "hpo"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments",
        "/error/message": "expected a supported command with checked arguments"
      },
      "max_bytes": 199
    },
    {
      "run": [
        "search",
        "phenotype",
        "literal",
        "--offset",
        "4294967296"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments",
        "/error/message": "expected a supported command with checked arguments"
      },
      "max_bytes": 166
    },
    {
      "run": [
        "get",
        "phenotype",
        "HP:0001250",
        "synonyms",
        "--section-limit",
        "0"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments",
        "/error/message": "expected a supported command with checked arguments",
        "/error/option": "--section-limit"
      },
      "max_bytes": 171
    },
    {
      "run": [
        "get",
        "phenotype",
        "HP:0001250",
        "synonyms",
        "--section-offset",
        "4294967296"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments",
        "/error/message": "expected a supported command with checked arguments"
      },
      "max_bytes": 198
    }
  ]
}

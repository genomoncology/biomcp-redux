{
  "feature": "phenotype-identity",
  "story": "Retired forms name explicit supported routes before any source access.",
  "steps": [
    {
      "run": [
        "list",
        "phenotype"
      ],
      "mcp": [
        "list",
        "phenotype"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "use: help phenotype"
      },
      "max_bytes": 127,
      "max_tokens": 32
    },
    {
      "run": [
        "search",
        "phenotype",
        "HP:0001250 HP:0003002"
      ],
      "mcp": [
        "search",
        "phenotype",
        "HP:0001250 HP:0003002"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "retired; use: search phenotype TEXT; inspect diseases and genes with: get phenotype HP:ID --source monarch"
      },
      "max_bytes": 227,
      "max_tokens": 57
    },
    {
      "run": [
        "search",
        "phenotype",
        "HP:0001250,HP:0003002"
      ],
      "mcp": [
        "search",
        "phenotype",
        "HP:0001250,HP:0003002"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "retired; use: search phenotype TEXT; inspect diseases and genes with: get phenotype HP:ID --source monarch"
      },
      "max_bytes": 227,
      "max_tokens": 57
    },
    {
      "run": [
        "search",
        "phenotype",
        "HP:0001250",
        "HP:0003002"
      ],
      "mcp": [
        "search",
        "phenotype",
        "HP:0001250",
        "HP:0003002"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "retired; use: search phenotype TEXT; inspect diseases and genes with: get phenotype HP:ID --source monarch"
      },
      "max_bytes": 227,
      "max_tokens": 57
    },
    {
      "run": [
        "search",
        "phenotype",
        "synthetic",
        "--source",
        "hpo"
      ],
      "mcp": [
        "search",
        "phenotype",
        "synthetic",
        "--source",
        "hpo"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "HPO term search has no proved paging contract; use: search phenotype TEXT --source monarch"
      },
      "max_bytes": 209,
      "max_tokens": 53
    },
    {
      "run": [
        "search",
        "phenotype",
        "HP:0001250",
        "-l",
        "5"
      ],
      "mcp": [
        "search",
        "phenotype",
        "HP:0001250",
        "-l",
        "5"
      ],
      "offline": true,
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.retired",
        "/error/message": "retired; use: search phenotype TEXT; inspect diseases and genes with: get phenotype HP:ID --source monarch"
      },
      "max_bytes": 227,
      "max_tokens": 57
    }
  ]
}

{
  "feature": "phenotype-identity",
  "story": "Phenotype help and Markdown expose the same checked source arguments.",
  "steps": [
    {
      "run": [
        "help",
        "search",
        "phenotype"
      ],
      "mcp": [
        "help",
        "search",
        "phenotype"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "text",
            "--source",
            "--limit",
            "--offset"
          ]
        },
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/description": {
          "includes": "does not establish a diagnosis"
        },
        "/result/commands/0/arguments/*/choices/*": {
          "includes_all_of": [
            "hpo",
            "monarch"
          ]
        }
      },
      "max_bytes": 100000
    },
    {
      "run": [
        "help",
        "get",
        "phenotype"
      ],
      "mcp": [
        "help",
        "get",
        "phenotype"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/description": {
          "includes": "Neither establishes a diagnosis"
        },
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "id",
            "--source",
            "section",
            "--section-limit",
            "--section-offset",
            "--snapshot"
          ]
        },
        "/result/commands/0/arguments/*/choices/*": {
          "includes_all_of": [
            "hpo",
            "monarch"
          ]
        },
        "/result/commands/0/sections/*/word": {
          "equals": [
            "synonyms",
            "xrefs",
            "hierarchy",
            "diseases",
            "genes"
          ]
        }
      },
      "max_bytes": 100000
    }
  ]
}

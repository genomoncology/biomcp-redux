{
  "feature": "phenotype-identity",
  "story": "Phenotype help and Markdown expose the same checked source arguments.",
  "steps": [
    {
      "run": [
        "help",
        "search",
        "phenotype"
      ],
      "mcp": [
        "help",
        "search",
        "phenotype"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "text",
            "--source",
            "--limit",
            "--offset"
          ]
        },
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/description": "Search literal human HP term candidates through Monarch with bounded native pages. A term lookup answers terminology and does not establish a diagnosis.",
        "/result/commands/0/arguments/*/choices/*": {
          "includes_all_of": [
            "hpo",
            "monarch"
          ]
        }
      },
      "max_bytes": 1133
    },
    {
      "run": [
        "help",
        "get",
        "phenotype"
      ],
      "mcp": [
        "help",
        "get",
        "phenotype"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/examples": {
          "count": 2
        },
        "/result/commands/0/description": "Read an exact HP term from HPO or Monarch, or page native source sections. A term lookup answers terminology; an association answers what its publisher asserts. Neither establishes a diagnosis.",
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "id",
            "--source",
            "section",
            "--section-limit",
            "--section-offset",
            "--snapshot"
          ]
        },
        "/result/commands/0/arguments/*/choices/*": {
          "includes_all_of": [
            "hpo",
            "monarch"
          ]
        },
        "/result/commands/0/sections/*/word": {
          "equals": [
            "synonyms",
            "xrefs",
            "hierarchy",
            "diseases",
            "genes"
          ]
        }
      },
      "max_bytes": 2205
    }
  ]
}

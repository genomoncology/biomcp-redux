{
  "feature": "phenotype-identity",
  "story": "Phenotype help and Markdown expose the same checked source arguments.",
  "steps": [
    {
      "run": [
        "help",
        "search",
        "phenotype"
      ],
      "mcp": [
        "help",
        "search",
        "phenotype"
      ],
      "expect": {
        "/status": "complete",
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "--limit",
            "--offset",
            "--source"
          ]
        }
      },
      "max_bytes": 7000
    },
    {
      "run": [
        "help",
        "get",
        "phenotype"
      ],
      "mcp": [
        "help",
        "get",
        "phenotype"
      ],
      "expect": {
        "/status": "complete"
      },
      "max_bytes": 7000
    }
  ]
}

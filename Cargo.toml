[workspace]
members = ["crates/biodata", "crates/biomcp-fetch", "crates/biomcp"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tempfile = "3.27.0"

ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier", "gzip", "json"] }
schemars = "1.2.3"
jsonschema = { version = "0.46", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
too_many_lines = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

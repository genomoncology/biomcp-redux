[workspace]
members = ["crates/biodata", "crates/biomcp"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"

[workspace.dependencies]
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
too_many_lines = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

[workspace]
members = ["crates/biodata", "crates/biomcp-adapters", "crates/biomcp-fetch", "crates/biomcp-query", "crates/biomcp"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "string"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tempfile = "3.27.0"
libtest-mimic = "0.8.2"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }

rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"

ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier", "gzip", "json"] }
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
jsonschema = { version = "0.46.0", default-features = false }

sha2 = { version = "0.11.1", default-features = false }
httpdate = "1.0.3"
quick-xml = { version = "0.42.0", default-features = false, features = ["serialize"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

url = "2.5.8"
pdf-extract = "=0.12.1"
rlimit = "0.11.0"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
too_many_lines = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

- id: gene-constraint-pli
  question: How do I get the pLI and LOEUF constraint scores for a gene?
  source: product
  frequency: listed from the constraint section
  rank: 38
  page: /getting-started/first-query/
  reference: /reference/commands/get-gene/
  answers_page: true
  example: a-gene-constraint
  answer: |
    Request the gene's `constraint` section: `biomcp get gene SYMBOL constraint`. It returns gnomAD's loss-of-function constraint for the gene's canonical transcript. For TP53 this run returns gnomAD v4 values for transcript ENST00000269305, with pLI near 1 and LOEUF about 0.42.
  why: |
    BioMCP resolves the symbol against HGNC and reads gnomAD's constraint record for the gene. pLI is gnomAD's probability that the gene is intolerant of loss-of-function variants. LOEUF is the upper bound of the observed-to-expected ratio of loss-of-function variants; a lower value means fewer such variants than expected. The section also carries `oe_lof`, `mis_z` and `syn_z`.
  limits: |
    The scores describe variation in the people gnomAD sequenced, for one transcript and one gnomAD version. They are population statistics about the gene, not a classification of any variant.
  page_title: Run your first query
  reference_title: get gene
- id: gene-to-uniprot
  question: How do I find the UniProt accession for a gene?
  source: product
  frequency: listed from the protein section
  rank: 40
  page: /genes-and-proteins/
  reference: /reference/commands/get-gene/
  answers_page: true
  example: a-gene-uniprot
  answer: |
    Request the gene's `protein` section: `biomcp get gene SYMBOL protein`. It returns the reviewed human UniProt entries for the gene. This BioMCP 1.0 run finds P15056 for BRAF, with its name and length.
  why: |
    BioMCP resolves the symbol against HGNC, then reads UniProt's reviewed human entries for that gene. The accession goes straight to `biomcp get protein P15056` for features, domains and sequence.
  limits: |
    Only reviewed (Swiss-Prot) human entries are returned. A gene with several reviewed products returns each one; BioMCP does not choose.
  page_title: Look up genes, proteins and pathways
  reference_title: get gene

- id: hgvs-to-grch38
  question: How do I convert HGVS c. notation to GRCh38 genomic coordinates?
  source: cases
  frequency: "use case 16 normalize to codes"
  rank: 30
  page: /how-to/annotate-variants/
  reference: /reference/commands/variant-normalize/
  answers_page: true
  example: a-hgvs-grch38
  answer: |
    Resolve the description with the ClinGen Allele Registry: `biomcp variant normalize --source car --hgvs 'NM_004985.5:c.35G>A'`. The reply maps the transcript change to its ClinGen allele ID and its GRCh38 genomic descriptions. KRAS c.35G>A, the change behind G12D, resolves to CA122538 and NC_000012.12:g.25245350C>T.
  why: |
    The registry stores each allele once and lists every description of it: transcripts, GRCh37 and GRCh38. BioMCP sends your text unchanged and returns the registry's mappings; it never edits the description to make it match.
  limits: |
    The description needs a versioned reference sequence, such as `NM_004985.5`. A description the registry cannot place returns an outcome other than `resolved`. `--source mutalyzer` and `--source variantvalidator` check the same description with other services.
- id: rsid-to-gene
  question: Which gene and alleles does an rsID belong to?
  source: product
  frequency: listed from get variant inputs
  rank: 32
  page: /how-to/annotate-variants/
  reference: /reference/commands/get-variant/
  answers_page: true
  example: a-rsid-gene
  answer: |
    Run `biomcp get variant RSID`. An rsID can name several alternate alleles, so BioMCP returns one candidate per allele, each with its gene, its other identifiers and its genomic HGVS. This BioMCP 1.0 run shows the three alleles MyVariant.info records for rs113488022 in BRAF.
  why: |
    dbSNP rsIDs name a position and can cover more than one change. BioMCP keeps every source candidate and does not pick one. The candidate whose ClinVar ID is `clinvar:13961` is the A>T change that encodes BRAF V600E; its `next` command reads it with `--build GRCh37`.
  limits: |
    The HGVS here is on the build MyVariant.info used, GRCh37. `biomcp variant normalize` converts it. An rsID absent from MyVariant.info returns no candidates, which is not proof it does not exist.

- id: fda-approval-date
  question: When did FDA first approve a drug?
  source: product
  frequency: listed from the approvals section
  rank: 47
  page: /drugs-and-safety/
  reference: /reference/commands/get-drug/
  answers_page: true
  example: a-fda-approval
  answer: |
    Find the drug's FDA application in Drugs@FDA, then read its `approvals` section. The `ORIG` submission is the original application. This BioMCP 1.0 run sorts the history of NDA202429, the Zelboraf (vemurafenib) application, by date: its original approval is dated 2011-08-17.
  why: |
    `biomcp search drug NAME --source drugsfda` returns the application number. The `approvals` section lists each submission with its kind, number, status and date as Drugs@FDA records them. `AP` means approved. `--section-limit` sets how many rows one page holds.
  limits: |
    Drugs@FDA covers FDA applications only. A drug with several applications, such as different forms, has a history for each. Dates are Drugs@FDA's submission status dates.
  page_title: Look up drugs, labels, safety reports and pharmacogenomics
  reference_title: get drug
- id: ema-authorisation
  question: Is a drug authorised by the European Medicines Agency?
  source: public
  frequency: "issue #226 (EMA documents, 6 comments)"
  rank: 48
  page: /drugs-and-safety/
  reference: /sources/ema/
  answers_page: true
  example: a-ema-status
  answer: |
    Synchronize the EMA bundle once, search the medicine with `--source ema`, then read its `regulatory` section. This BioMCP 1.0 run finds Zelboraf as EMEA/H/C/002409 and reports EMA's status and marketing authorisation date.
  why: |
    EMA publishes its medicines table as a download. `biomcp sync ema` stores it, and reads answer from the stored copy. The `regulatory` section returns EMA's own status and dated events.
  limits: |
    The answer is as fresh as your last sync. Run `biomcp sync ema` again for current data. EMA's status covers the European Union only.
  page_title: Look up drugs, labels, safety reports and pharmacogenomics
  reference_title: EMA source

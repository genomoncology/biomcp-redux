- id: kras-g12c-lung-trials
  question: How do I find recruiting trials for KRAS G12C non-small cell lung cancer?
  source: product
  frequency: a common first agent task for trial search
  rank: 7
  page: /how-to/find-trials/
  reference: /reference/commands/search-trial/
  answers_page: true
  example: a-kras-g12c-trials
  answer: |
    Search ClinicalTrials.gov with the condition, the variant text and the status: `biomcp search trial --condition "non-small cell lung cancer" --variant "KRAS G12C" --status RECRUITING`. This BioMCP 1.0 run returns the first three recruiting trials that mention KRAS G12C in their registry text for that condition.
  why: |
    `--condition` searches the registry's condition field, `--variant` searches its text for the words you give, and `--status RECRUITING` keeps trials whose overall status is recruiting. The registry ranks the results. Each NCT identifier goes to `biomcp get trial NCT eligibility` for the eligibility text.
  limits: |
    Registry text decides the match, so trials that write "G12C" without "KRAS", or name only the drug, can be missed. Run the broader searches too: `--gene KRAS` without the variant, and `--intervention` with a drug name. BioMCP makes no eligibility judgment, and a listing is not an enrollment recommendation.
  page_title: Find clinical trials by condition, gene or variant
  reference_title: search trial
- id: trials-near-location
  question: How do I find clinical trials near a location?
  source: product
  frequency: listed from --lat, --lon and --distance
  rank: 22
  page: /how-to/find-trials/
  reference: /reference/commands/search-trial/
  answers_page: true
  example: a-trials-near
  answer: |
    Add `--lat=`, `--lon=` and `--distance=` with units to `biomcp search trial`. Write each with an equals sign: a negative longitude such as `-74.0060` is read as an option otherwise, and the command stops with `usage.arguments`. This BioMCP 1.0 run finds recruiting melanoma trials with a site within 50 miles of New York City.
  why: |
    ClinicalTrials.gov filters by the distance from the point to each trial site. `--distance` needs explicit units, `mi` or `km`. The search returns whole trials; `biomcp get trial NCT locations` lists each site with its own status.
  limits: |
    A trial matches when any of its sites is in range; that site may not be recruiting. `--facility` cannot combine with a radius. Distances are the registry's calculation from site coordinates.
  page_title: Find clinical trials by condition, gene or variant
  reference_title: search trial
  lines: 5
- id: trials-for-drug
  question: How do I find clinical trials that test a specific drug?
  source: product
  frequency: listed from --intervention; 0.9 drug trials helper
  rank: 24
  page: /how-to/find-trials/
  reference: /reference/commands/search-trial/
  answers_page: true
  example: a-trials-intervention
  answer: |
    Use `--intervention` with the drug name: `biomcp search trial --intervention sotorasib --status RECRUITING`. This BioMCP 1.0 run returns recruiting trials whose registered interventions or text match sotorasib.
  why: |
    `--intervention` sends literal text to the registry's intervention search. BioMCP adds no aliases, so search the brand name and code names too, such as an AMG number, when you need them.
  limits: |
    The registry decides what matches. A trial can mention the drug in another role, such as a diagnostic study about the same mutation. Read each record before reporting it.
  page_title: Find clinical trials by condition, gene or variant
  reference_title: search trial

# Hand-written notes for each source, merged into the generated source pages.
# name: the publisher's name for the source. what: one sentence on what BioMCP reads.
# commands: commands that reach the source without a --source choice (names as in the reference).
# bundle: the sync command's argument when the source is a local bundle.
# guide: the guide page that uses the source. limits: one Limits line for the source page.
# key: the key name when the source uses a key that `biomcp help key` files under another source.
# The page's example is examples/src-SOURCE.
cellosaurus: { name: Cellosaurus, what: "BioMCP reads cell-line cards, names, identity, cross-references and variants from Cellosaurus.", commands: [search cell-line, get cell-line], guide: /studies-and-cell-lines/, limits: "Names stay as Cellosaurus writes them, so `A375` and `A-375` match different rows. A missing record or an empty section describes this source for this input. It is not a negative finding." }
cpic: { name: CPIC, what: "BioMCP reads CPIC gene cards, recommendations, guidelines and diplotype lookups.", commands: [], guide: /drugs-and-safety/, limits: "BioMCP returns CPIC's published text and tables. It does not compute a phenotype or a dose from a genotype." }
clinpgx: { name: ClinPGx, what: "BioMCP reads ClinPGx clinical, guideline and label annotations for a gene.", commands: [], guide: /drugs-and-safety/, limits: "Each annotation keeps ClinPGx's level of evidence. BioMCP does not rank or combine annotations." }
gtr: { name: NCBI Genetic Testing Registry, what: "BioMCP reads GTR test listings with their genes, conditions and methods from a local bundle.", bundle: gtr, guide: /drugs-and-safety/, limits: "BioMCP reads a local copy, current as of your last `biomcp sync gtr`. A test listing is the laboratory's own registration, not a validation." }
who-ivd: { name: WHO prequalified in vitro diagnostics, what: "BioMCP reads WHO prequalified diagnostic products from a local copy of the WHO export.", bundle: who-ivd, guide: /drugs-and-safety/, limits: "BioMCP reads a local copy, current as of your last `biomcp sync who-ivd`. The list covers WHO prequalified products only." }
who-pq: { name: WHO prequalified finished products, what: "BioMCP reads WHO prequalified medicines from a local copy of the WHO export.", bundle: who-pq, guide: /drugs-and-safety/, limits: "BioMCP reads a local copy, current as of your last `biomcp sync who-pq`. The list covers WHO prequalified finished products only." }
fda-cdx: { name: FDA companion diagnostics list, what: "BioMCP reads the FDA list of cleared or approved companion diagnostic devices from a local bundle.", bundle: fda-cdx, guide: /drugs-and-safety/, limits: "BioMCP reads a local copy, current as of your last `biomcp sync fda-cdx`. Cells keep the FDA list's own text. The search below returned `partial` with reason `unsupported`, which the reply schema defines as a format the local reader does not support." }
fda-pma: { name: openFDA premarket approval, what: "BioMCP reads one PMA submission, its regulatory statement and its supplements.", commands: [], guide: /drugs-and-safety/, limits: "BioMCP reads one submission by its PMA number. It does not search devices by name.", key: openfda }
fda-510k: { name: openFDA 510(k), what: "BioMCP reads one 510(k) clearance record.", commands: [], guide: /drugs-and-safety/, limits: "BioMCP reads one clearance by its K number. It does not search devices by name.", key: openfda }
gwas: { name: GWAS Catalog, what: "BioMCP reads GWAS Catalog studies, associations, loci and ancestries, and the gwas section of a variant.", commands: [search gwas, get gwas], guide: /diseases-and-phenotypes/, limits: "Broad searches, such as a search by gene, can exceed the request deadline. An association is the study's reported result, not a causal claim." }
myvariant: { name: MyVariant.info, what: "BioMCP searches variants and reads predictor, conservation and historical COSMIC fields through MyVariant.info.", commands: [get variant], guide: /how-to/annotate-variants/, limits: "MyVariant.info aggregates other databases, and its COSMIC fields are historical. Coordinates are GRCh37." }
car: { name: ClinGen Allele Registry, what: "BioMCP resolves variant identities and normalizes HGVS through the ClinGen Allele Registry.", commands: [get variant], guide: /how-to/annotate-variants/, limits: "The Allele Registry needs a reference-qualified HGVS expression or an identifier it knows." }
mutalyzer: { name: Mutalyzer, what: "BioMCP sends reference-qualified HGVS to Mutalyzer for normalization.", commands: [], guide: /how-to/annotate-variants/, limits: "Mutalyzer checks HGVS syntax against a reference sequence. It does not report clinical meaning." }
variantvalidator: { name: VariantValidator, what: "BioMCP sends reference-qualified HGVS to VariantValidator with a genome build.", commands: [], guide: /how-to/annotate-variants/, limits: "VariantValidator needs `--build`. Keyless calls share a public rate limit and can return `rate_limited`." }
ctgov: { name: ClinicalTrials.gov, what: "BioMCP searches ClinicalTrials.gov and reads trial records, sections and posted documents. It is the default trial source.", commands: [trial document], guide: /how-to/find-trials/, limits: "Text filters such as `--variant` search registry text. They do not match a molecular profile. A listing is not an enrollment recommendation." }
hgnc: { name: HGNC, what: "BioMCP resolves gene symbols, aliases and identifiers against a local HGNC bundle that it can synchronize when a read needs it.", commands: [search gene, get gene], bundle: hgnc, guide: /genes-and-proteins/, limits: "BioMCP synchronizes the HGNC bundle when a read needs it. A missing record or an empty section describes this source for this input. It is not a negative finding." }
mygene: { name: MyGene.info, what: "BioMCP reads gene summaries through MyGene.info for the gene card.", commands: [get gene], guide: /genes-and-proteins/, limits: "The gene summary is the RefSeq text with its date. BioMCP does not rewrite it." }
oncokb: { name: OncoKB, what: "BioMCP reads OncoKB gene and variant annotations with your OncoKB key.", commands: [get gene, get variant], guide: /genes-and-proteins/, limits: "OncoKB needs your own key and license. Without the key BioMCP sends no request and reports `skipped` with reason `no_key`." }
alphagenome: { name: AlphaGenome, what: "BioMCP stores an AlphaGenome key with `biomcp key set alphagenome` or reads `ALPHAGENOME_API_KEY`. No command in this release sends a request to AlphaGenome.", commands: [], guide: /getting-started/api-keys/, limits: "AlphaGenome needs your own key and accepts its terms. The key help is the only output this release gives for AlphaGenome." }
gnomad: { name: gnomAD, what: "BioMCP reads gnomAD population counts for a variant and population constraint for a gene.", commands: [variant population, get variant, get gene], guide: /how-to/annotate-variants/, limits: "A variant missing from gnomAD is not a zero frequency. Constraint values come from one gnomAD version, named in the reply." }
uniprot: { name: UniProt, what: "BioMCP reads reviewed human protein records, features, isoforms, function text and sequences from UniProt.", commands: [search protein, get protein, protein features, protein isoforms, protein sequence, protein structures, get gene], guide: /genes-and-proteins/, limits: "BioMCP reads reviewed human entries. A missing record or an empty section describes this source for this input. It is not a negative finding." }
interpro: { name: InterPro, what: "BioMCP reads InterPro domain and family matches for a protein.", commands: [protein domains, get protein], guide: /genes-and-proteins/, limits: "Matches come from InterPro's member databases as InterPro reports them." }
complex-portal: { name: Complex Portal, what: "BioMCP reads the protein complexes a protein takes part in and their members.", commands: [protein complexes, protein complex-members, get protein], guide: /genes-and-proteins/, limits: "Complex Portal marks predicted complexes with `predicted`. Keep that flag with any claim." }
reactome: { name: Reactome, what: "BioMCP searches Reactome pathways and reads their genes and events, and the pathways section of a gene.", commands: [get pathway, pathway genes, pathway events, get gene], guide: /genes-and-proteins/, limits: "Pathway membership is Reactome's curation. BioMCP runs no enrichment." }
wikipathways: { name: WikiPathways, what: "BioMCP searches WikiPathways and reads pathway members from a local bundle.", commands: [get pathway, pathway genes], bundle: wikipathways, guide: /genes-and-proteins/, limits: "BioMCP reads a local copy, current as of your last `biomcp sync wikipathways`." }
civic: { name: CIViC, what: "BioMCP reads CIViC gene curation, variant molecular-profile evidence and drug therapy evidence.", commands: [get gene, get variant], guide: /how-to/annotate-variants/, limits: "CIViC evidence is curated from publications and keeps its own evidence level. BioMCP does not rank it." }
hotspots: { name: Cancer Hotspots, what: "BioMCP reads Cancer Hotspots residue counts for a variant's position.", commands: [get variant], guide: /how-to/annotate-variants/, limits: "Counts are per residue from the Cancer Hotspots data set. A residue count is not a frequency for a population or a tumor type." }
clinvar: { name: ClinVar, what: "BioMCP reads ClinVar assertions for a variant.", commands: [get variant], guide: /how-to/annotate-variants/, limits: "Each assertion keeps its submitter's classification. Conflicting classifications stay as ClinVar reports them.", key: ncbi }
erepo: { name: ClinGen Evidence Repository, what: "BioMCP reads ClinGen expert-panel variant assertions.", commands: [get variant], guide: /how-to/annotate-variants/, limits: "Only variants that a ClinGen expert panel classified have records. A missing record or an empty section describes this source for this input. It is not a negative finding." }
clingen: { name: ClinGen gene validity and dosage, what: "BioMCP reads ClinGen gene-disease validity and dosage curation from a local bundle that it can synchronize when a read needs it.", commands: [get gene], bundle: clingen, guide: /genes-and-proteins/, limits: "BioMCP synchronizes the ClinGen bundle when a read needs it. Each classification keeps its expert panel and date." }
hpa: { name: Human Protein Atlas, what: "BioMCP reads tissue expression for a gene from the Human Protein Atlas.", commands: [get gene], guide: /genes-and-proteins/, limits: "Expression categories are the Human Protein Atlas's own labels." }
pubmed: { name: PubMed, what: "BioMCP searches PubMed and reads article citations, abstracts and MeSH indexing. It is the default article search source.", commands: [get article], guide: /how-to/find-articles/, limits: "A search returns what PubMed returned for those words. An empty search is not proof that no paper exists. Without a key, NCBI's public rate limit applies." }
europepmc: { name: Europe PMC, what: "BioMCP searches Europe PMC, including open full text and preprints, and resolves article identifiers.", commands: [get article], guide: /how-to/find-articles/, limits: "Europe PMC includes preprints. Check each record's type before you cite it." }
litvar: { name: LitVar2, what: "BioMCP finds publications that mention an exact variant through LitVar2.", commands: [], guide: /how-to/find-articles/, limits: "LitVar2 matches exact variant identifiers. Other spellings of a variant can find other papers." }
litsense: { name: LitSense2, what: "BioMCP finds sentences that resemble the query text through LitSense2.", commands: [], guide: /how-to/find-articles/, limits: "LitSense2 returns sentences that resemble the query. A similar sentence is not a confirmed finding." }
pubtator: { name: PubTator3, what: "BioMCP searches PubTator3 entities and reads text-mined annotations for an article.", commands: [get article], guide: /how-to/find-articles/, limits: "Annotations are text mining output and can be wrong." }
pmc-oa: { name: PMC Open Access, what: "BioMCP reads licensed full text, supplements and PDFs from the PMC Open Access subset.", commands: [get article, article text, article supplement, article pdf], guide: /how-to/find-articles/, limits: "Only the PMC Open Access subset is read. Each article keeps its own license." }
icite: { name: NIH iCite, what: "BioMCP reads citation counts and citation links from NIH iCite. It is the default citation source.", commands: [get article], guide: /how-to/find-articles/, limits: "Citation counts change as NIH iCite updates. Record the date you read them." }
semantic-scholar: { name: Semantic Scholar, what: "BioMCP searches Semantic Scholar papers and authors and reads citations, references, recommendations and summaries.", commands: [get author, author papers, article citation-evidence, article recommendations, get article], guide: /how-to/find-articles/, limits: "Keyless calls share a public rate limit and can return `rate_limited`. A free key raises the limit." }
orcid: { name: ORCID, what: "BioMCP reads one ORCID record and its public works.", commands: [get author, author papers], guide: /how-to/find-articles/, limits: "BioMCP reads public ORCID records only. A record holds what its owner made public." }
nci: { name: NCI Clinical Trials Search, what: "BioMCP searches the NCI Clinical Trials Search API and reads NCI trial records with your NCI key.", commands: [], guide: /how-to/find-trials/, limits: "NCI needs your own key. Without it BioMCP sends no request and reports `skipped` with reason `no_key`. BioMCP never falls back to ClinicalTrials.gov." }
cbioportal: { name: cBioPortal, what: "BioMCP reads cBioPortal study metadata from a local bundle and counts samples with a variant in one study.", commands: [search study, get study], bundle: cbioportal-studies, guide: /studies-and-cell-lines/, limits: "BioMCP reads a local copy, current as of your last `biomcp sync cbioportal-studies`. Until the bundle exists, the source state is `syncing` and the reply names the sync command. BioMCP returns study metadata only and downloads no study data files." }
mychem: { name: MyChem.info, what: "BioMCP searches drugs through MyChem.info. It is the default drug source.", commands: [], guide: /drugs-and-safety/, limits: "MyChem.info merges records from several databases, each named in `sources`." }
chembl: { name: ChEMBL, what: "BioMCP reads ChEMBL drug targets and indications, and ChEMBL cell metadata and assay counts.", commands: [cell-line assay-count, get cell-line], guide: /drugs-and-safety/, limits: "Targets and mechanisms are ChEMBL's curation. A target listing is not a measure of potency." }
opentargets: { name: Open Targets Platform, what: "BioMCP reads Open Targets drug records, targets and indications.", commands: [], guide: /drugs-and-safety/, limits: "Indications carry Open Targets' trial stage. A stage is not an approval." }
openfda-label: { name: openFDA drug labels, what: "BioMCP reads one exact heading of an FDA drug label.", commands: [], guide: /drugs-and-safety/, limits: "BioMCP returns one label heading as the label states it. It does not summarize the label." }
drugsfda: { name: Drugs@FDA, what: "BioMCP reads FDA application and product history for a drug.", commands: [], guide: /drugs-and-safety/, limits: "Drugs@FDA covers FDA applications only.", key: openfda }
ema: { name: European Medicines Agency, what: "BioMCP reads EMA medicine records and regulatory events from a local bundle.", bundle: ema, guide: /drugs-and-safety/, limits: "BioMCP reads a local copy, current as of your last `biomcp sync ema`. Records cover centrally authorised medicines." }
ddinter: { name: DDInter, what: "BioMCP reads drug-drug interaction partners and levels from a local bundle.", bundle: ddinter, guide: /drugs-and-safety/, limits: "BioMCP reads a local copy, current as of your last `biomcp sync ddinter`. An interaction level is DDInter's label, not advice for one patient." }
ols: { name: EMBL-EBI Ontology Lookup Service, what: "BioMCP searches MONDO, DOID and NCIt disease terms through OLS. It is the default disease source.", commands: [], guide: /diseases-and-phenotypes/, limits: "Searches cover MONDO, DOID and NCIt. A term missing from these ontologies can exist elsewhere." }
mydisease: { name: MyDisease.info, what: "BioMCP reads disease records through MyDisease.info. `search trial --condition-id MONDO:0005105` looks the disease up here before the trial search runs.", commands: [search trial], guide: /diseases-and-phenotypes/, limits: "MyDisease.info aggregates other databases, each with its own terms." }
monarch: { name: Monarch Initiative, what: "BioMCP reads disease and phenotype associations with genes from the Monarch Initiative.", commands: [], guide: /diseases-and-phenotypes/, limits: "Associations are Monarch's aggregation from its sources, each named in the association." }
hpo: { name: Human Phenotype Ontology, what: "BioMCP searches and reads HPO phenotype terms.", commands: [], guide: /diseases-and-phenotypes/, limits: "BioMCP reads HPO terms by identifier. Text search for phenotypes uses Monarch." }
seer: { name: SEER, what: "BioMCP reads SEER cancer sites, stage incidence and survival rows.", commands: [], guide: /diseases-and-phenotypes/, limits: "SEER statistics describe the United States population that SEER covers. They are not a risk for one person." }
faers: { name: FDA Adverse Event Reporting System, what: "BioMCP searches and reads FAERS drug adverse event reports through openFDA. It is the default adverse event source.", commands: [], guide: /drugs-and-safety/, limits: "A report count is not an incidence rate. Reports are unverified and can be duplicated.", key: openfda }
maude: { name: FDA MAUDE, what: "BioMCP searches and reads MAUDE medical device reports through openFDA.", commands: [], guide: /drugs-and-safety/, limits: "A device report is the reporter's account. A report count is not a failure rate.", key: openfda }
vaers: { name: VAERS through CDC WONDER, what: "BioMCP reads VAERS report summaries for MMR, COVID-19 and named influenza vaccines from CDC WONDER.", commands: [], guide: /drugs-and-safety/, limits: "VAERS reports are unverified, and a report does not show that a vaccine caused an event." }

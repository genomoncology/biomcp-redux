# Read by scripts/gen-reference.mjs. plain: one plain sentence per command, saying what it does,
# for the command's reference page, the commands index and src/data/commands.json (the tables on
# guide pages). Each restates the command's help text in plain words; the help text itself is
# quoted below it on the command's page. A command missing here fails the generator.
plain:
  author papers: "Lists the papers of one author record from Semantic Scholar or ORCID, a page at a time."
  search author: "Finds author records by name in Semantic Scholar."
  get author: "Reads author records by their Semantic Scholar or ORCID ID, in the order you give."
  cell-line assay-count: "Counts the ChEMBL assays recorded for one cell line."
  search cell-line: "Finds cell lines by name in Cellosaurus."
  get cell-line: "Reads one cell line by its ID, and optionally one named section such as its variants."
  get gwas: "Reads one GWAS Catalog association or study, and optionally its loci, associations or ancestries."
  search gwas: "Finds GWAS Catalog associations by trait, gene, variant, study or PubMed ID, smallest p-value first."
  protein features: "Lists UniProt features of one protein, five at a time, filtered by type or residue."
  protein isoforms: "Lists the isoforms of one protein, five at a time."
  protein domains: "Lists the InterPro domains of one protein, five at a time."
  protein complexes: "Lists the Complex Portal complexes that hold one protein, five at a time."
  protein complex-members: "Lists the members of one Complex Portal complex that holds the protein, five at a time."
  protein structures: "Lists the PDB structures of one protein, five at a time."
  protein sequence: "Prints the whole amino-acid sequence of one UniProt protein or isoform."
  search protein: "Finds reviewed human UniProt proteins by text or by gene, five at a time."
  get protein: "Reads UniProt protein records by accession, and optionally sections such as domains or sequence."
  search phenotype: "Finds Human Phenotype Ontology (HP) terms by text in HPO or Monarch."
  get phenotype: "Reads one HP term from HPO or Monarch, and optionally its synonyms, links, related diseases or genes."
  search pathway: "Finds human pathways in Reactome, the default, or WikiPathways."
  get pathway: "Reads one Reactome or WikiPathways pathway, and optionally its summary, genes or events."
  pathway genes: "Lists the genes and gene products of one pathway."
  pathway events: "Lists the events, such as reactions, of one Reactome pathway."
  search study: "Finds cBioPortal studies by text in a downloaded copy of the study list."
  get study: "Reads one cBioPortal study, and optionally its profiles, sample lists or files."
  search pgx: "Finds CPIC gene-drug pairs for a gene."
  get pgx: "Reads pharmacogenomic records from CPIC or ClinPGx, such as guidelines, recommendations or annotations."
  search diagnostic: "Finds diagnostic tests in one source, such as GTR, the FDA companion diagnostic list or WHO's prequalified tests."
  get diagnostic: "Reads one diagnostic test record, and optionally one section such as its genes or conditions."
  search adverse-event: "Finds adverse event reports in FAERS, VAERS or MAUDE, five at a time."
  get adverse-event: "Reads one adverse event report by its ID, and optionally one section such as its drugs or reactions."
  search disease: "Finds disease concepts by text, or lists SEER cancer sites."
  get disease: "Reads one disease concept or SEER cancer site, and optionally a section such as its genes or incidence."
  search drug: "Finds drugs by name in one source."
  get drug: "Reads one drug record by its ID in one source, and optionally a section such as its label or approvals."
  get gene: "Reads one to twenty human genes, in the order you give, and optionally sections such as constraint or expression."
  search gene: "Finds human genes by text, by cytoband, or both."
  search article: "Finds articles by text, gene, disease, drug, variant, author, journal or date."
  get article: "Reads one to twenty articles by PMID, PMCID or DOI, and optionally sections such as the full text."
  article supplement: "Reads one supplementary file of an article, or the rows of it that match a search, or saves the file."
  article pdf: "Downloads an article's PDF from its publisher to a file you name."
  article text: "Reads one part of an article's full text, finds matching passages, or saves the text as Markdown."
  article citations: "Lists the papers that cite one PubMed article, a page at a time."
  article references: "Lists the papers one PubMed article cites, a page at a time."
  article citation-evidence: "Shows where and how one article cites another, with the citing passage when the full text is open."
  article recommendations: "Lists papers that Semantic Scholar recommends from one or more seed papers."
  search trial: "Finds clinical trials in ClinicalTrials.gov, the default, or NCI, by condition, drug, gene, location and more."
  get trial: "Reads clinical trials by NCT ID, and optionally sections such as eligibility or locations."
  trial document: "Downloads one document a trial posted on ClinicalTrials.gov, such as its protocol PDF, to a file you name."
  variant assertions: "Lists the assertions one source, such as ClinVar, makes about a variant, a page at a time."
  get variant: "Reads a variant by rsID, ClinVar ID, ClinGen allele ID or HGVS, and optionally sections such as ClinVar or population."
  variant population: "Lists gnomAD population frequency details for one variant."
  search variant: "Finds variants by gene, protein change, region or another single selector."
  variant recurrence: "Counts the samples that carry one variant in one cBioPortal study."
  variant normalize: "Sends an HGVS variant name to the ClinGen Allele Registry, Mutalyzer or VariantValidator to check and normalize it."
  skill: "Shows the agent guide and worked examples built into BioMCP."
  skill list: "Lists the worked examples built into BioMCP."
  skill render: "Prints the whole agent guide."
  skill status: "Reports whether the guide installed in a folder is missing, changed, out of date or current."
  skill install: "Installs the agent guide into a folder."
  version: "Prints the version; --verbose adds the commit it was built from, the schema IDs and the paths BioMCP uses."
  mcp-config: "Prints the configuration an MCP client needs to start BioMCP."
  store clean: "Removes expired replies and stored searches from the local cache."
  health: "Lists every source with its terms and checks that each one answers."
  sync: "Downloads a source's bundle, a local copy that commands read."
  schema: "Prints one reply schema as JSON Schema."
  help: "Prints the help for every command, or for one, as JSON."
  key list: "Lists the keys BioMCP supports and where each one is set, without showing values."
  key set: "Stores a key for one source, read from a hidden prompt or standard input."
  key remove: "Removes a stored key."
  serve: "Runs BioMCP as an MCP server over standard input and output, or over HTTP."
  sync wikipathways: "Downloads the WikiPathways bundle that pathway searches read."
  sync cbioportal-studies: "Downloads the cBioPortal study list bundle that study commands read."
  sync ema: "Downloads the European Medicines Agency bundle that EMA drug commands read."
  sync ddinter: "Downloads the DDInter drug interaction bundle."
  sync who-pq: "Downloads the WHO prequalified medicines bundle."
  sync gtr: "Downloads the Genetic Testing Registry bundle that diagnostic commands read."
  sync who-ivd: "Downloads the WHO prequalified diagnostics bundle."
  sync fda-cdx: "Downloads the FDA companion diagnostics bundle."
  help key ncbi: "Shows how to set the NCBI key: the key name and its environment variable."
  help key semantic-scholar: "Shows how to set the Semantic Scholar key: the key name and its environment variable."
  help key orcid: "Shows how to set the ORCID key: the key name and its environment variable."
  help key oncokb: "Shows how to set the OncoKB key: the key name and its environment variable."
  help key alphagenome: "Shows how to set the AlphaGenome key: the key name and its environment variable."
  help key nci: "Shows how to set the NCI key: the key name and its environment variable."
  help key openfda: "Shows how to set the openFDA key: the key name and its environment variable."
  help network proxy: "Shows how to make BioMCP reach the sources through a proxy."
  help network ca_bundle: "Shows how to make BioMCP trust a private certificate authority."

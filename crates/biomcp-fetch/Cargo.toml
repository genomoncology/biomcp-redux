[package]
name = "biomcp-fetch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tonic = { version = "=0.14.7", default-features = false, features = ["channel", "codegen", "tls-ring"] }
h2 = { version = "0.4", default-features = false }
hyper = { version = "1", default-features = false, features = ["http2"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
base64.workspace = true
prost = { version = "=0.14.3", default-features = false, features = ["derive", "std"] }
zstd = { version = "=0.14.3", default-features = false }
csv.workspace = true
flate2.workspace = true
biomcp-types = { workspace = true }
url.workspace = true
biodata = { workspace = true }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
ureq.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
sha2.workspace = true
httpdate.workspace = true
quick-xml.workspace = true
rusqlite.workspace = true

tempfile.workspace = true

[dev-dependencies]
rcgen = { version = "0.13.2", default-features = false, features = ["crypto", "ring", "pem"] }
rusqlite = { workspace = true, features = ["trace"] }

[lints]
workspace = true
